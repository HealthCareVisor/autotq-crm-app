<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>AutoTQ Marketing</title>
<style>
/* AutoTQ Marketing — an operations console for the sending network: near-black ground, two panel steps, 1px rules,
   Inter at one UI size with rank by weight and case, coral as the only fill (live dot, elevated state, primary action). */
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("assets/inter-latin.woff2") format("woff2")}
:root{
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ground:#0B0B0C; --paper:#111214; --panel:#17181B; --rule:#232428; --rule-2:#1C1D21; --rule-3:#2E2F35;
  --ink:#F2F2F0; --ink-2:#C9C8C3; --ink-3:#8E8D88; --ink-4:#5E5D5A;
  --coral:#E8673B; --coral-ink:#F08A64; --coral-wash:rgba(232,103,59,.16);
  --l1:#E8673B; --l2:#5B9BE6; --l3:#7DBE57; --l4:#D27BB0; --l5:#E6B04A; --l6:#45C2BE;
  --ok:#7FD07A; --ok-wash:rgba(127,208,122,.14); --warn:#E6B04A; --warn-wash:rgba(230,176,74,.14); --bad:#F2655F; --bad-wash:rgba(242,101,95,.16); --info:#6BA6F5; --info-wash:rgba(107,166,245,.14);
  --sh-1:none; --sh-2:0 0 0 1px var(--rule-3); --sh-3:0 24px 60px -24px rgba(0,0,0,.85),0 8px 20px -10px rgba(0,0,0,.6);
  --ring:0 0 0 3px rgba(232,103,59,.28); --r:10px; --r-lg:14px; --r-xl:18px; --ease:cubic-bezier(.2,.8,.2,1); --ui:13.5px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:var(--ui);line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"calt" 0,"ss01" 0}
button{font-family:inherit;cursor:pointer;color:inherit;font-size:inherit}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:2px}
::selection{background:rgba(232,103,59,.32)}
input,textarea{caret-color:var(--coral);accent-color:var(--coral)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}
input:focus-visible,textarea:focus-visible{outline:none}
*{scrollbar-width:thin;scrollbar-color:#2E2F35 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2E2F35;border-radius:99px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}
/* ---- shell ---- */
.live{display:inline-flex;align-items:center;gap:7px;color:var(--ink-3);font-size:12.5px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-wash)}
.live[data-state=off] i{background:var(--ink-4);box-shadow:none}.live[data-state=up] i{background:var(--warn)}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex:none}
button.av{border:0;padding:0}
.ph{display:flex;align-items:baseline;gap:14px;margin:4px 0 16px}
.ph h1{font-size:20px;font-weight:650;margin:0;letter-spacing:-.014em}
.ph p{margin:0;color:var(--ink-3)}
.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:12px}
.t1{font-weight:600;letter-spacing:-.006em;margin:0;color:var(--ink)}
.t2{font-size:12.5px;color:var(--ink-3);margin:2px 0 0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.mark{fill:currentColor;flex:none}
/* ---- the net (transit map) ---- */
.netwrap{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-xl);box-shadow:var(--sh-1);overflow:hidden}
svg.net{width:100%;height:auto;display:block;font-family:var(--font)}
svg.net .col{font-size:11px;letter-spacing:.09em;fill:var(--ink-4);font-weight:600}
svg.net .line{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;transition:opacity .35s var(--ease),stroke-width .25s}
svg.net .line.ghost{stroke-width:3;stroke-dasharray:1 9;opacity:.55}
svg.net .plate{cursor:pointer}svg.net .plate rect{fill:var(--panel);stroke:var(--rule-3);stroke-width:1;transition:stroke .2s}
svg.net .plate:hover rect{stroke:var(--ink-3)}
svg.net .plate .pt{font-size:13px;font-weight:650}svg.net .plate .ps{font-size:11.5px;fill:var(--ink-3)}
svg.net .plate .pn{font-size:22px;font-weight:650;fill:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
svg.net .station{cursor:pointer}svg.net .station circle{fill:var(--panel);stroke:var(--ink);stroke-width:2.5;transition:stroke-width .2s}
svg.net .station:hover circle{stroke-width:3.5}
svg.net .station .st{font-size:12.5px;font-weight:600;fill:var(--ink)}svg.net .station .ss{font-size:11px;fill:var(--ink-3)}
svg.net .station.hold circle{stroke:var(--bad)}svg.net .station.idle circle{stroke:var(--ink-4);stroke-width:2}
svg.net .stop{cursor:pointer}
svg.net .stop .tt{font-size:11.5px;font-weight:600;fill:var(--ink)}svg.net .stop .ts{font-size:11px;fill:var(--ink-3)}
svg.net .train{opacity:.95}
svg.net .dim{opacity:.10;transition:opacity .35s var(--ease)}
svg.net .lbl{font-size:11.5px;fill:var(--ink-3)}
.legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--rule);background:var(--paper)}
.legend .lg{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px 0 10px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;font-weight:550;color:var(--ink-2);transition:border-color .15s,background .15s}
.legend .lg:hover{border-color:var(--rule-3)}.legend .lg.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.legend .lg i{width:10px;height:10px;border-radius:50%;flex:none}.legend .lg b{font-weight:650}.legend .lg small{color:inherit;opacity:.7}
.legend .spacer{flex:1}
.vroute{padding:6px 0 14px}
.vplate{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--rule-3);background:var(--paper);border-radius:14px;padding:10px 14px;text-align:left;font:inherit}
.vplate small{display:block;color:var(--ink-3);font-size:12px}
.vline{position:relative;margin:0 0 0 22px;padding:10px 0 0 0;border-left:6px solid var(--c);border-radius:0 0 0 6px}
.vline.ghost{border-left-style:dotted;border-left-width:3px;margin-left:23.5px}
.vst{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 0 6px 14px;text-align:left;font:inherit;position:relative}
.vst i{position:absolute;left:-15px;width:18px;height:18px;border-radius:50%;background:var(--panel);border:2.5px solid var(--ink)}
.vst.stop i{left:-10px;width:5px;height:22px;border-radius:3px;background:var(--c);border:0}
.vst small{color:var(--ink-3)}
/* ---- inspector drawer ---- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.open{opacity:1;pointer-events:auto}
#insp{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--paper);box-shadow:var(--sh-3);transform:translateX(104%);transition:transform .32s var(--ease);z-index:41;overflow:auto;padding:22px 22px 32px}
#insp.open{transform:none}
#insp h2{font-size:17px;font-weight:650;margin:0 36px 4px 0;letter-spacing:-.012em}
.inspx{position:absolute;top:12px;right:12px;width:32px;height:32px;border:0;border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}.inspx:hover{background:var(--panel)}
.insp-line{height:6px;border-radius:99px;margin:14px 0 16px}
/* ---- components ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 13px;border:1px solid var(--rule-3);background:var(--paper);color:var(--ink);border-radius:var(--r);font-weight:550;white-space:nowrap;transition:background .15s,border-color .15s,transform .12s var(--ease)}
.btn:hover{background:var(--panel)}.btn:active{transform:translateY(.5px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn svg.i{width:15px;height:15px;stroke-width:2}
.btn.sm{min-height:28px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.coral{background:var(--coral);border-color:var(--coral);color:var(--ground);font-weight:600}.btn.coral:hover{background:var(--coral-ink);border-color:var(--coral-ink)}
.btn.block{display:flex;width:100%;min-height:44px;border-radius:12px;white-space:normal}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}.btn.ghost:hover{background:var(--panel)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--coral-ink);padding:0 4px;min-height:0;font-weight:600}.btn.quiet:hover{background:transparent;text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;line-height:16px;padding:2px 8px;border-radius:6px;white-space:nowrap;background:var(--panel);color:var(--ink-2);vertical-align:middle}
.pill svg.i{width:12px;height:12px;stroke-width:2.4}
.pill.warn{background:var(--warn-wash);color:var(--warn)}.pill.dang{background:var(--bad-wash);color:var(--bad)}.pill.ok{background:var(--ok-wash);color:var(--ok)}.pill.info{background:var(--info-wash);color:var(--info)}.pill.coral{background:var(--coral-wash);color:var(--coral-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border:1px solid var(--rule-3);background:var(--paper);border-radius:999px;font-size:12.5px;font-weight:550;color:var(--ink-2);cursor:pointer;user-select:none;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}.chip.on{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);padding:13px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
button.card{width:100%;font:inherit;text-align:left;transition:border-color .15s,box-shadow .15s}
button.card:hover{border-color:var(--rule-3);background:var(--panel)}
.card.block{display:block}
.list{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px}
.list>.card{margin:0;border:0;border-radius:0;border-top:1px solid var(--rule-2)}.list>:first-child{border-top:0}.list>button.card:hover{background:var(--panel);box-shadow:none}
.callhead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.callhead{grid-template-columns:1fr}}
.callgoal{padding:16px 18px}.cg-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.cg-top small{color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.cg-top b.num{display:block;font-size:44px;font-weight:300;line-height:1.05}.cg-top b.num span{font-size:20px;color:var(--ink-3);margin-left:2px}
.cg-goal{text-align:right}.cg-goal .chips{justify-content:flex-end;margin-top:6px}
.cg-bar{height:8px;border-radius:99px;background:var(--rule-2);margin:14px 0 12px;overflow:hidden}.cg-bar i{display:block;height:100%;background:var(--coral);border-radius:99px}
.cg-days{position:relative;display:flex;gap:6px;align-items:flex-end;height:74px}.cg-days>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cg-days i{display:block;width:100%;max-width:26px;min-height:2px;background:var(--ink-4);border-radius:4px 4px 0 0}.cg-days i.hit{background:var(--coral)}.cg-days .td i{outline:1px solid var(--ink-2)}
.cg-days small{font-size:10.5px;color:var(--ink-3);margin-top:4px}.goalline{position:absolute;left:0;right:0;border-top:1px dashed var(--ink-3);opacity:.6}
.callconfs .ccrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;border:0;border-top:1px solid var(--rule-2);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ccrow .ck{width:18px;height:18px;border:1.5px solid var(--ink-3);border-radius:5px;display:grid;place-items:center;flex:none}.ccrow .ck .i{width:13px;height:13px}.ccrow.off{opacity:.5}
.ccrow .grow{display:flex;flex-direction:column;min-width:0}.ccrow small{color:var(--ink-3);font-size:12px}.cbar{display:block;height:4px;border-radius:9px;background:var(--rule-2);margin-top:6px;overflow:hidden}.cbar i{display:block;height:100%;background:var(--ink-2)}
.phoneonly{display:none}@media (max-width:900px){.deskonly{display:none}.phoneonly{display:block;margin-top:14px}.cg-days{display:none}.callgoal p.t2:last-child{display:none}}
.callgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}@media (max-width:900px){.callgrid{grid-template-columns:1fr}}
.callcard{padding:18px 20px}.cc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cc-name{font-size:28px;font-weight:600;margin:12px 0 2px;letter-spacing:-.01em}.cc-sub{margin:0;color:var(--ink-2);font-size:15px}
.callbtn{font-size:16px;padding:10px 16px;text-decoration:none}.cc-ctx{margin-top:14px;padding:10px 12px;border:1px solid var(--rule-2);border-radius:10px;background:var(--panel-2,transparent)}.cc-ctx p{margin:3px 0;font-size:13.5px}.cc-ctx b{color:var(--ink-3);font-weight:600;margin-right:6px}
.cc-hist{margin-top:10px}.cc-hist p{margin:4px 0}.callouts .chip{min-height:38px;padding:0 14px}
.callnext .ibx.on{background:var(--rule-2)}
.cc-fu{margin-top:12px;padding:10px 12px;border:1px dashed var(--rule);border-radius:10px}.cc-fu .btn{text-decoration:none}
.callfu .fu-grid{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;column-gap:10px;margin-top:6px}.callfu .fu-grid label.fl{margin:10px 0 0}.callfu .fu-grid>.f,.callfu .fu-grid>.row,.callfu .fu-grid>.fu-cc{margin-top:10px}
.fu-cc{display:flex;align-items:center;gap:8px;font-size:14px}.fu-body{margin-top:12px;font:14px/1.55 var(--sans,inherit);min-height:240px;resize:vertical}.callfu .btn{text-decoration:none}
@media (max-width:640px){.callfu .fu-grid{grid-template-columns:1fr}.callfu .fu-grid label.fl{margin-top:12px}}
.fu-row{align-items:flex-start;gap:14px}.fu-act{text-align:right;min-width:190px}.fu-act .btn{text-decoration:none}.fu-reply{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--ok);background:var(--rule-2);border-radius:6px;font-size:13.5px;white-space:pre-wrap}
@media (max-width:640px){.fu-row{flex-direction:column}.fu-act{text-align:left;min-width:0}.fu-act .row{justify-content:flex-start!important}}
.planstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}.pblk{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:inherit;cursor:pointer;font:inherit}
.pblk .pl{display:flex;flex-direction:column}.pblk small{color:var(--ink-3);font-size:12px}.pblk.on{border-color:var(--coral,#E8473F);box-shadow:0 0 0 1px var(--coral,#E8473F) inset}.pblk.done{opacity:.6}.pblk .cbar{margin-top:0}.pblk.on .cbar i{background:var(--coral,#E8473F)}
@media (max-width:640px){.planstrip{grid-template-columns:1fr}}
.chip.hotchip{border-color:var(--bad);color:var(--bad)}.chip.hotchip.on{background:var(--bad);color:#fff}
.kpis .kpi-s{background:var(--paper);padding:12px 14px;border:0;border-radius:0}.kpi-s small{display:block;color:var(--ink-3);font-size:12.5px}.kpi-s b{font-size:24px;font-weight:650;letter-spacing:-.02em}.kpi-s b small{display:inline;font-size:13px;font-weight:500;margin-left:4px}
table.score td.num{white-space:nowrap}table.score tr.tot td{font-weight:650;border-top:2px solid var(--rule)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.reccard{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);padding:16px 18px}
.lists{display:flex;flex-direction:column;margin-top:6px}.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--rule-2)}.lrow:first-child{border-top:0}
.lrow .grow{display:flex;flex-direction:column;min-width:0}.lrow b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lrow small{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.ldot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;vertical-align:middle;margin-right:3px}
.perfrow .ldot{margin:0 4px 0 2px}
.sech{font-size:15px;font-weight:650;letter-spacing:-.012em;margin:24px 0 10px}
.sectlabel{font-size:13.5px;font-weight:600;letter-spacing:-.006em;color:var(--ink);margin:0 0 8px}
.empty{text-align:center;color:var(--ink-3);padding:40px 20px;line-height:1.55}
.tk{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--rule-2)}.tk:first-of-type{border-top:0}.tk>b{width:86px;flex:none;color:var(--ink-3);font-weight:600}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
input.f,textarea.f{width:100%;border:1px solid var(--rule-3);background:var(--paper);border-radius:var(--r);padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input.f:hover,textarea.f:hover{border-color:var(--ink-4)}input.f:focus,textarea.f:focus{border-color:var(--coral);box-shadow:var(--ring)}
textarea.f{min-height:72px;resize:vertical;line-height:1.5}
.wiz{display:flex;gap:6px;margin:14px 0 16px;flex-wrap:wrap}
.wiz button{flex:1;min-width:120px;border:1px solid var(--rule);background:var(--paper);border-radius:11px;padding:10px 12px;font-weight:600;color:var(--ink-3);text-align:left}
.wiz button.on{border-color:var(--ink-3);color:var(--ink);background:var(--panel)}.wiz button.done{color:var(--ok)}
.tablewrap{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:auto}
table.lv{width:100%;border-collapse:collapse}
table.lv th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0;background:var(--paper);z-index:1}
table.lv td{padding:9px 12px;border-bottom:1px solid var(--rule-2);white-space:nowrap;vertical-align:top}table.lv tr:last-child td{border-bottom:0}
table.lv td.wrap{white-space:normal;min-width:260px}.lvname{font-weight:600}
.dropzone{border:1.5px dashed var(--rule-3);border-radius:16px;padding:28px 18px;text-align:center;color:var(--ink-3);background:var(--paper);cursor:pointer}.dropzone:hover{border-color:var(--coral)}.dropzone svg{width:24px;height:24px;color:var(--ink-4)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ground);font-weight:550;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:99;box-shadow:var(--sh-3)}
.toast.show{opacity:1;transform:translateX(-50%)}
/* schedule board */
.sched th.dc,.sched td.dc{text-align:center;min-width:46px;padding:8px 4px;font-variant-numeric:tabular-nums}
.sched .we{background:var(--panel);color:var(--ink-4)}.sched .today{box-shadow:inset 0 0 0 2px rgba(232,103,59,.45)}.sched th.today{color:var(--coral-ink)}
.sched .cell{display:inline-block;min-width:30px;padding:3px 7px;border-radius:7px;color:var(--ground);font-size:12px;font-weight:650}.sched .cell.soft{background:var(--panel);color:var(--ink-2)}
.sched tr.tot td{background:var(--panel);font-weight:600}.sched a{text-decoration:none}.sched a:hover{text-decoration:underline}
.sched .bar{height:6px;border-radius:99px;background:var(--panel);overflow:hidden}.sched .bar i{display:block;height:100%;border-radius:99px}
.sched .lane{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px}
/* route cards (campaign list) + route header (one campaign) */
.route{display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(0,2fr) auto;gap:16px;align-items:center;padding:14px 18px}
.route .trk{position:relative;height:40px}
.route .trk .ln{position:absolute;left:0;right:0;top:17px;height:6px;border-radius:99px}
.route .trk .sp{position:absolute;top:12px;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2.5px solid currentColor;transform:translateX(-50%)}
.route .trk .sp.done{background:currentColor}

.login{max-width:380px;margin:12vh auto 0;padding:0 20px}
.login .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:650;justify-content:center;letter-spacing:-.014em}.login .logo svg{width:20px;height:30px;color:var(--coral)}
.login .tag{text-align:center;color:var(--ink-3);margin:4px 0 26px}
.login .who{color:var(--ink-3);text-align:center;margin-bottom:12px}
.ubtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--paper);padding:12px 14px;text-align:left;font:inherit}
.ubtn:hover{background:var(--panel)}.ubtn .uav{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.ubtn b{display:block;font-size:14.5px}.ubtn small{color:var(--ink-3);font-size:12.5px}
#loginMsg{font-size:13px;color:var(--ink-3);text-align:center;min-height:18px;margin-top:12px}

/* ---- console shell: the sidebar + breadcrumb + main (sidebar rebuilt 2026-10-21 after Max's sidebar video — the CRM has the
   same one): a floating panel that folds to an icon rail (panel button; the logo opens it again; remembered per device), a
   switcher under the logo (Marketing ⇄ CRM), Search + Ctrl/⌘K, groups that fold, Conferences on a guide line under Email
   Campaigns, badges, the running campaigns, Settings, the sent-today card and the user card with its menu. Phones keep the
   slide-in drawer. ---- */
:root{--s-on:rgba(255,255,255,.07);--s-hov:rgba(255,255,255,.04);--s-tip:#F2F2F0;--s-tip-ink:#0B0B0C}
:root[data-theme="light"]{--s-on:rgba(26,25,22,.06);--s-hov:rgba(26,25,22,.035);--s-tip:#1A1916;--s-tip-ink:#FFFFFF}
@keyframes spopin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.app{display:grid;grid-template-columns:auto minmax(0,1fr);min-height:100vh}
.side{width:252px;position:sticky;top:0;height:100vh;height:100dvh;padding:10px 0 10px 10px;transition:width .26s var(--ease);z-index:40}
.sbox{height:100%;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--rule);border-radius:16px;overflow:hidden;position:relative}
.side .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .18s var(--ease)}
.shead{display:flex;align-items:center;gap:6px;padding:12px 10px 8px 15px;flex:none}
.sws{display:flex;align-items:center;gap:10px;min-width:0;flex:1;border:0;background:none;padding:4px 6px 4px 0;border-radius:10px;text-align:left;color:var(--ink);cursor:pointer}
.sws:hover{background:var(--s-hov)}
.slogo{width:30px;height:30px;border-radius:9px;background:var(--coral);display:flex;align-items:center;justify-content:center;flex:none}
.slogo svg.mark{width:12px;height:18px;color:#fff}
.sws .lbl b{display:block;font-size:14px;font-weight:650;letter-spacing:-.015em;line-height:1.15}
.sws .lbl small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:1px}
.sws>svg.i{width:15px;height:15px;color:var(--ink-4);margin-left:auto;flex:none}
.sicon{width:30px;height:30px;border-radius:8px;border:0;background:none;color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s,color .15s}
.sicon:hover{background:var(--s-hov);color:var(--ink)}
.sicon svg.i{width:18px;height:18px}
.ssearch{display:flex;align-items:center;gap:10px;margin:2px 10px 8px;min-height:34px;padding:0 8px 0 11px;border:1px solid var(--rule-3);border-radius:9px;background:var(--ground);color:var(--ink-3);font-size:13px;flex:none;transition:border-color .15s,background .15s}
.ssearch:hover{color:var(--ink-2)}
.ssearch svg.i{width:16px;height:16px;flex:none}
.ssearch .lbl{flex:1;text-align:left}
.ssearch kbd,.palk kbd{font-family:inherit;font-size:10.5px;font-weight:600;color:var(--ink-3);border:1px solid var(--rule-3);border-radius:5px;padding:1px 5px;background:var(--paper);line-height:16px}
.snavs{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 10px 8px;scrollbar-color:transparent transparent}
.snavs:hover{scrollbar-color:var(--scroll) transparent}
.sgrp-h{display:flex;align-items:center;width:100%;border:0;background:none;padding:12px 6px 4px 6px;font-size:11.5px;font-weight:600;color:var(--ink-3);position:relative;border-radius:6px;text-align:left;letter-spacing:.02em}
.sgrp-h:hover{color:var(--ink-2)}
.sgrp-h .lbl{flex:1}
.sgrp-h svg.i{width:14px;height:14px;opacity:0;transition:opacity .15s,transform .2s var(--ease)}
.sgrp-h:hover svg.i,.sgrp.closed .sgrp-h svg.i{opacity:1}
.sgrp.closed .sgrp-h svg.i{transform:rotate(-90deg)}
.sgrp-h .gbadge{margin-right:6px}
.sgrp-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s var(--ease)}
.sgrp.closed>.sgrp-b{grid-template-rows:0fr}
.sgrp-b>div{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:1px}
.sitem{display:flex;align-items:center;gap:11px;width:100%;min-height:34px;padding:0 8px 0 11px;border:0;background:none;border-radius:8px;color:var(--ink-2);font-size:13.5px;font-weight:500;text-align:left;position:relative;text-decoration:none;transition:background .15s,color .15s}
.sitem svg.i{width:17px;height:17px;flex:none;color:var(--ink-3);stroke-width:1.8;transition:color .15s}
.sitem:hover{background:var(--s-hov);color:var(--ink)}
.sitem:hover svg.i{color:var(--ink-2)}
.sitem.on{background:var(--s-on);color:var(--ink);font-weight:600}
.sitem.on svg.i{color:var(--coral)}
.sitem .lbl{flex:1;min-width:0}
.sbadge{flex:none;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;line-height:18px;text-align:center;font-variant-numeric:tabular-nums;transition:opacity .15s}
.sbadge.act{background:none;color:var(--coral);box-shadow:inset 0 0 0 1.5px var(--coral)}
.sbadge+.sbadge{margin-left:-6px}
.skid{flex:none;width:24px;height:24px;margin-right:-4px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-4)}
.skid:hover{background:var(--s-on);color:var(--ink-2)}
.skid svg.i{width:14px;height:14px;transition:transform .2s var(--ease)}
.sitem.open .skid svg.i{transform:rotate(90deg)}
.skids{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s var(--ease)}
.skids.open{grid-template-rows:1fr}
.skids>div{overflow:hidden;min-height:0;position:relative;display:flex;flex-direction:column;gap:1px}
.skids>div::before{content:"";position:absolute;left:19px;top:2px;bottom:16px;width:1px;background:var(--rule-3)}
.skids .sitem{min-height:32px;padding-left:34px;font-size:13px}
.skids .sitem::before{content:"";position:absolute;left:19px;top:50%;width:9px;height:1px;background:var(--rule-3)}
.skids .sitem.on::after{content:"";position:absolute;left:18px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--coral)}
.srun .sitem{min-height:32px;font-size:13px}
.srun .sitem .dot{width:17px;display:flex;justify-content:center;flex:none}
.srun .sitem .dot i{width:8px;height:8px;border-radius:50%}
.srun .sitem small{flex:none;color:var(--ink-4);font-size:11px;transition:opacity .18s}
.srun .snone{padding:2px 11px 6px;margin:0;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.sfoot{flex:none;padding:6px 10px 10px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:1px}
.ssent{display:block;width:100%;text-align:left;border:1px solid var(--rule);border-radius:12px;background:var(--ground);padding:9px 12px 10px;margin:6px 0;color:var(--ink);transition:border-color .15s;position:relative;min-height:52px}
.ssent:hover{border-color:var(--rule-3)}
.ssent .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.ssent .row1 b{color:var(--ink);font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums}
.ssent .bar{margin-top:8px;height:4px}
.ssent .ring{display:none}
.suser{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--rule);border-radius:12px;background:var(--ground);padding:8px 8px 8px 9px;text-align:left;color:var(--ink);transition:border-color .15s}
.suser:hover{border-color:var(--rule-3)}
.suser .av{width:30px;height:30px;font-size:11.5px;position:relative}
.suser .av i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--ground)}
.suser .av i.off{background:var(--ink-4)}
.suser .lbl{flex:1;min-width:0}
.suser .lbl b{display:block;font-size:13px;font-weight:650;line-height:1.2}
.suser .lbl small{display:block;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.suser>svg.i{width:15px;height:15px;color:var(--ink-4);flex:none}
.spop{position:absolute;left:10px;right:10px;z-index:30;background:var(--panel);border:1px solid var(--rule-3);border-radius:12px;box-shadow:var(--sh-3);padding:6px;display:none}
.spop.open{display:block;animation:spopin .16s var(--ease)}
.spop.top{top:56px}.spop.bottom{bottom:66px}
.spop .sitem{min-height:34px;font-size:13.5px;padding-left:10px}
.spop .sep{height:1px;background:var(--rule);margin:5px 4px}
.spop .phd{font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 10px 4px}
.spop .phd b{display:block;font-size:13px;color:var(--ink);font-weight:650}
.spop .sitem small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
.spop .sitem .ck{margin-left:auto;color:var(--coral);width:16px;height:16px}
.spop .sitem.out,.spop .sitem.out svg.i{color:var(--bad)}
.spop .wsl{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.spop .wsl svg{color:#fff}
/* the folded rail (desktop only — phones keep the drawer) */
@media (min-width:901px){
  .app.mini .side{width:72px}
  .app.mini .side .lbl,.app.mini .sws>svg.i,.app.mini .sbadge,.app.mini .skid,.app.mini .ssearch kbd,.app.mini .srun .sitem small{opacity:0;pointer-events:none}
  .app.mini .shead .sicon{display:none}
  .app.mini .ssearch{border-color:transparent;background:none}
  .app.mini .ssearch:hover{background:var(--s-hov)}
  .app.mini .sgrp-h{height:13px;padding:6px 0;pointer-events:none}
  .app.mini .sgrp-h::after{content:"";position:absolute;left:10px;right:10px;top:6px;height:1px;background:var(--rule)}
  .app.mini .sgrp-h svg.i{opacity:0}
  .app.mini .sgrp.closed>.sgrp-b{grid-template-rows:1fr}
  .app.mini .skids{grid-template-rows:0fr!important}
  .app.mini .srun .snone{opacity:0}
  .app.mini .sitem .mdot{display:block;position:absolute;left:25px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid var(--paper)}
  .app.mini .snavs{scrollbar-width:none}
  .app.mini .ssent{border-color:transparent;background:none;height:46px;min-height:0;display:flex;align-items:center;padding:0 0 0 7px}
  .app.mini .ssent .row1,.app.mini .ssent .bar{display:none}
  .app.mini .ssent .ring{display:block}
  .app.mini .suser{border-color:transparent;background:none;padding:8px 0 8px 9px}
  .app.mini .suser>svg.i{opacity:0}
  .app.mini .spop{left:78px;right:auto;width:250px}
  .app.mini .spop.top{top:10px}.app.mini .spop.bottom{bottom:10px}
}
.sitem .mdot{display:none}
#stip{position:fixed;z-index:80;pointer-events:none;background:var(--s-tip);color:var(--s-tip-ink);font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;transform:translateX(-4px);transition:opacity .12s,transform .12s}

#stip kbd{font-family:inherit;font-size:10.5px;opacity:.65;margin-left:6px}
/* Ctrl/⌘K */
.pal{position:fixed;inset:0;z-index:90;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.pal.open{display:flex}
.palbox{width:min(620px,100%);max-height:70vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule-3);border-radius:16px;box-shadow:var(--sh-3);overflow:hidden;animation:spopin .16s var(--ease)}
.palin{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.palin svg.i{width:18px;height:18px;color:var(--ink-3)}
.palin input{flex:1;border:0;outline:none;font:inherit;font-size:15.5px;background:none;color:var(--ink);min-width:0}

.palit{display:flex;align-items:center;gap:11px;width:100%;min-height:38px;padding:6px 10px;border:0;background:none;border-radius:9px;text-align:left;color:var(--ink);font-size:13.5px}

@media (max-width:900px){.side{padding:0}.sbox{border-radius:0;border:0;border-right:1px solid var(--rule)}.shead .sicon,.ssearch kbd{display:none}} /* the drawer: no fold button, no shortcut hint */

@media (max-width:900px){.app.open .sidescrim{display:block}.today .t2{width:100%}}

.main{max-width:none;padding:22px 28px 90px}

/* ---------- session + data ---------- */
let SESSION=null;try{SESSION=JSON.parse(localStorage.getItem(SKEY)||"null");}catch(e){}
let USER=null, DB={}, view="home", curCampaign=null, campStep=1, mktTab="campaigns", leadsQ="", leadsConf="";
const logState={otpEmail:null,pwEmail:null,setPw:null};
const SYNC={lastPull:"1970-01-01T00:00:00Z",dirty:{},timer:null,pushing:false,state:"off",booted:false};
function authed(){return !!(SESSION&&SESSION.access_token);}
function saveSession(s){SESSION=s;if(s)localStorage.setItem(SKEY,JSON.stringify(s));else localStorage.removeItem(SKEY);}
function admin(){return USER==="max";}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(DKEY)||"null");if(r&&r.db){DB=r.db;SYNC.lastPull=r.lastPull||SYNC.lastPull;SYNC.colls=r.colls||[];}}catch(e){}PULL_COLLECTIONS.concat(["activities"]).forEach(c=>{DB[c]=DB[c]||[];});}
function saveLocal(){try{localStorage.setItem(DKEY,JSON.stringify({db:DB,lastPull:SYNC.lastPull,colls:SYNC.colls||[]}));}catch(e){/* quota — the server copy is the real one */}}
async function supa(path,opts){
  opts=opts||{};const h=Object.assign({"apikey":SUPA_KEY,"Authorization":"Bearer "+(SESSION?SESSION.access_token:""),"Content-Type":"application/json"},opts.headers||{});
  let res=await fetch(SUPA_URL+path,Object.assign({},opts,{headers:h}));
  if(res.status===401&&await refreshSession()){h.Authorization="Bearer "+SESSION.access_token;res=await fetch(SUPA_URL+path,Object.assign({},opts,{headers:h}));}
  return res;
}
async function refreshSession(){
  if(!SESSION||!SESSION.refresh_token)return false;
  try{const res=await fetch(SUPA_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SESSION.refresh_token})});
    if(!res.ok){saveSession(null);USER=null;render();return false;}saveSession(await res.json());return true;}catch(e){return false;}
}
function syncDot(state){SYNC.state=state;const el=document.getElementById("syncdot");if(el){el.dataset.state=state;el.lastChild.textContent=state==="off"?"Offline":state==="up"?"Saving…":"Live";}}
/* writes: put(coll, record) saves locally and upserts to the shared records table (same shape the CRM pushes) */
function put(coll,rec){DB[coll]=DB[coll]||[];const i=DB[coll].findIndex(r=>String(r.id)===String(rec.id));if(i>-1)DB[coll][i]=rec;else DB[coll].push(rec);
  SYNC.dirty[coll+"|"+rec.id]={collection:coll,id:String(rec.id),data:rec,deleted:false};saveLocal();clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushDirty,500);}
function del(coll,id){DB[coll]=(DB[coll]||[]).filter(r=>String(r.id)!==String(id));SYNC.dirty[coll+"|"+id]={collection:coll,id:String(id),data:{id:id},deleted:true};saveLocal();clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushDirty,300);}
async function pushDirty(){
  if(SYNC.pushing||!authed())return;const keys=Object.keys(SYNC.dirty);if(!keys.length)return;
  SYNC.pushing=true;syncDot("up");
  try{const rows=keys.map(k=>Object.assign({updated_by:USER||""},SYNC.dirty[k]));
    const res=await supa("/rest/v1/records?on_conflict=collection,id",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
    if(res.ok){keys.forEach(k=>delete SYNC.dirty[k]);syncDot("ok");}else{syncDot("off");toast("Couldn't save to the team database ("+res.status+") — kept locally, will retry");}
  }catch(e){syncDot("off");}
  SYNC.pushing=false;
}
async function pullChanges(full){
  if(!authed())return;
  try{let changed=false;const from=full?"1970-01-01T00:00:00Z":SYNC.lastPull;let maxTs=SYNC.lastPull,offset=0,page=0;
    const colls="("+PULL_COLLECTIONS.join(",")+")";
    while(page<40){
      const res=await supa("/rest/v1/records?collection=in."+colls+"&updated_at=gte."+encodeURIComponent(from)+"&order=updated_at.asc,collection.asc,id.asc&limit=1000&offset="+offset);
      if(!res.ok){syncDot("off");return;}
      const rows=await res.json();
      rows.forEach(r=>{if(r.updated_at>maxTs)maxTs=r.updated_at;if(SYNC.dirty[r.collection+"|"+r.id])return;
        const arr=DB[r.collection]=DB[r.collection]||[];const i=arr.findIndex(x=>String(x.id)===String(r.id));
        if(r.deleted){if(i>-1){arr.splice(i,1);changed=true;}return;}
        const s=JSON.stringify(r.data);if(i>-1){if(JSON.stringify(arr[i])!==s){arr[i]=r.data;changed=true;}}else{arr.push(r.data);changed=true;}});
      if(rows.length<1000)break;offset+=1000;page++;}
    SYNC.lastPull=maxTs;if(full)SYNC.colls=PULL_COLLECTIONS.slice();saveLocal();syncDot("ok");
    if(changed){const ae=document.activeElement;if(!ae||!/INPUT|TEXTAREA/.test(ae.tagName))render();}
  }catch(e){syncDot("off");}
}
async function bootSync(){await pullChanges(!(DB.people||[]).length||PULL_COLLECTIONS.some(c=>!(SYNC.colls||[]).includes(c)));/* a collection added since this cache was made (e.g. orders) needs one full pull */SYNC.booted=true;if(Object.keys(SYNC.dirty).length)pushDirty();setInterval(pullChanges,10000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pullChanges();});}
function company(id){return (DB.companies||[]).find(c=>c.id===id);}
function person(id){return (DB.people||[]).find(p=>p.id===id);}
function personStates(p){if(Array.isArray(p.states)&&p.states.length)return p.states;if(p.state)return [p.state];const c=company(p.cid);return c&&c.state?[c.state]:[];}
function contactType(p){const c=company(p.cid);if(!c)return "enduser";if(c.type==="manrep"||c.type==="partner")return "manrep";if(c.type==="distributor")return "distrep";return "enduser";}
function distStatus(c){if(c.dstatus)return c.dstatus;return (((c.units||0)>0)||((c.orders||0)>0))?"setup":"potential";}
function myLists(){return (DB.lists||[]).filter(l=>!l.removed);}
function confLeadLists(){const by={};(DB.confLeads||[]).forEach(l=>{(by[l.conf]=by[l.conf]||[]).push(l);});
  return Object.keys(by).map(conf=>{const ls=by[conf];return {conf,total:ls.length,contacted:ls.filter(l=>l.contacted).length,tocall:ls.filter(l=>!l.contacted&&l.segment!=="Set Aside").length,hot:ls.filter(l=>l.temp==="Hot").length};}).sort((a,b)=>b.total-a.total);}

function renderLogin(){

  else if(step==="pw")h+='<div class="who">Password for<br><b style="color:var(--ink)">'+esc(logState.pwEmail)+'</b></div><input class="f" id="pwInput" type="password" placeholder="Password" autocomplete="current-password"><button class="btn coral block" data-act="verifypw" style="margin-top:14px">Sign in</button><button class="btn block ghost" data-act="sendotp" data-email="'+esc(logState.pwEmail)+'" style="margin-top:8px">Email me a code instead</button><button class="btn block ghost" data-act="otpback" style="margin-top:4px">Different account</button><p id="loginMsg"></p>';
  else if(step==="setpw")h+='<div class="who">You\'re in. Set a password for next time, or skip.</div><input class="f" id="pw1" type="password" placeholder="New password (8+ characters)"><input class="f" id="pw2" type="password" placeholder="Retype it" style="margin-top:8px"><button class="btn coral block" data-act="setpwsave" style="margin-top:14px">Save password</button><button class="btn block ghost" data-act="setpwskip" style="margin-top:8px">Skip for now</button><p id="loginMsg"></p>';
  else h+='<div class="who">Enter the code we emailed to<br><b style="color:var(--ink)">'+esc(logState.otpEmail)+'</b></div><input class="f" id="otpCode" inputmode="numeric" maxlength="12" placeholder="Code" autocomplete="one-time-code" style="text-align:center;font-size:26px;letter-spacing:6px;font-weight:700"><button class="btn coral block" data-act="verifyotp" style="margin-top:14px">Sign in</button><button class="btn block ghost" data-act="otpback" style="margin-top:8px">Back</button><p id="loginMsg"></p>';
  document.getElementById("screen").innerHTML=h+"</div>";
  const f=document.getElementById("pwInput")||document.getElementById("otpCode")||document.getElementById("pw1");if(f)setTimeout(()=>f.focus(),60);
}
function loginMsg(m,bad){const el=document.getElementById("loginMsg");if(el){el.textContent=m;el.style.color=bad?"var(--dang-t)":"var(--muted)";}}
function signedIn(j,email){saveSession(j);USER=TEAM_EMAILS[((j.user&&j.user.email)||email).toLowerCase()]||"";localStorage.setItem(UKEY,USER);logState.pwEmail=null;logState.otpEmail=null;}
async function verifyPw(){const pw=(document.getElementById("pwInput")||{}).value||"";if(!pw){loginMsg("Enter your password",true);return;}loginMsg("Signing in…");

/* past buyers (Max, 2026-10-19: never email anyone whose organization already bought AutoTQ). The same function runs in mail-run.
   Buyers = CRM orders (contactEmail, billEmail, account — $0 orders, loaners and GHM's own supplier POs don't count), companies with
   orders/units/revenue, and the people at those companies. A lead matches on its exact email, its company name (lowercase, no
   punctuation, no inc/llc/co/corp/company/the/ltd/group…) or its email domain. Generic mail never matches by domain; a broad domain
   (.mil .gov .us .edu k12) only asks for a look ("review", still sends). Our own team is always left out. Returns lead -> null | {skip,how,why}. */
const BUYER_GENERIC=new Set("gmail.com yahoo.com hotmail.com outlook.com aol.com icloud.com mac.com comcast.net msn.com live.com me.com att.net verizon.net protonmail.com ymail.com sbcglobal.net bellsouth.net cox.net charter.net mail.com gmx.com".split(" "));
const BUYER_BROAD=/(\.mil$|\.gov$|\.us$|k12|\.edu$)/, BUYER_TEAM=new Set(["goldenhourmedical.com","autotq.net","auto-tq.com","theautotq.com"]);
function pastBuyers(orders,companies,people){
  const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").replace(/\b(inc|llc|l l c|co|corp|corporation|company|the|ltd|lp|llp|pllc|pc|group|holdings|usa|us)\b/g," ").replace(/\s+/g," ").trim();
  const dom=e=>{e=String(e||"").trim().toLowerCase();return e.includes("@")?e.split("@").pop():"";};
  const num=v=>parseFloat(v)||0, em=new Map(), nm=new Map(), dm=new Map();
  const add=(email,name,why)=>{const e=String(email||"").trim().toLowerCase(),d=dom(e),n=norm(name);if(d&&!em.has(e))em.set(e,why);if(d&&!BUYER_GENERIC.has(d)&&!dm.has(d))dm.set(d,why);if(n.length>=3&&!nm.has(n))nm.set(n,why);};
  (orders||[]).forEach(o=>{if(!o||!(num(o.amount)>0)||/^(loaner|supplier)$/i.test(o.status||"")||/^LNR/i.test(o.poNo||"")||/loaner/i.test(o.notes||""))return; // $0 = a demo or loaner, even when logged as a web checkout
    const why="order "+(o.poNo||"?")+(o.poDate?" · "+o.poDate:"")+" · "+(o.account||"?");add(o.contactEmail,String(o.account||"").split(/\s[;|]\s/)[0],why);add(o.billEmail,"",why);});
  const cust=new Map();(companies||[]).forEach(c=>{if(!c||!(num(c.orders)>0||num(c.units)>0||num(c.revenue)>0))return;cust.set(c.id,c);const why="customer: "+c.name;add("",c.name,why);
    const w=String(c.website||c.web||"").trim().toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").split("/")[0];if(w.includes(".")&&!BUYER_GENERIC.has(w)&&!dm.has(w))dm.set(w,why);});
  (people||[]).forEach(p=>{const c=p&&cust.get(p.cid);if(c)add(p.email,"","contact at customer "+c.name);});
  return l=>{const e=String(l.email||"").trim().toLowerCase(),d=dom(e),n=norm(l.company);
    if(BUYER_TEAM.has(d)||n==="golden hour medical"||n==="autotq")return {skip:true,how:"our team",why:"Golden Hour Medical / AutoTQ"};
    if(d&&em.has(e))return {skip:true,how:"same person",why:em.get(e)};
    if(n&&nm.has(n))return {skip:true,how:"same company",why:nm.get(n)};
    if(d&&dm.has(d))return BUYER_BROAD.test(d)?{skip:false,how:"review: shares "+d,why:dm.get(d)}:{skip:true,how:"same email domain "+d,why:dm.get(d)};
    return null;};}
let BUYERS={key:"",test:null};
function buyerHit(l){const k=(DB.orders||[]).length+"|"+(DB.companies||[]).length+"|"+(DB.people||[]).length+"|"+SYNC.lastPull;
  if(BUYERS.key!==k)BUYERS={key:k,test:pastBuyers(DB.orders,DB.companies,DB.people)};return l&&l.email?BUYERS.test(l):null;}

  if(a==="callfunudge"){const l=byId(t.dataset.id);if(!l)return true;callFuOpen(l,"nudge",{from:"fu"});callTab="fu";render();window.scrollTo(0,0);return true;}
  if(a==="callfureopen"){const l=byId(t.dataset.id);if(!l)return true;const e=callLastEmail(l);callFuOpen(l,e&&e.tpl||"talked",{from:"fu",out:e&&e.out});if(e){callFu.subject=e.subject;callFu.body=e.body;callFu.ccOn=!!e.cc;callFu.reopen=true;}render();window.scrollTo(0,0);return true;}

  if(a==="callfutpl"){if(!callFu)return true;callFuRead();const l=byId(callFu.id);if(!l)return true;callFu.tpl=t.dataset.v;const x=callTpl(l,callFu.tpl,callFu.dist,callFu.cb);callFu.subject=x.subject;callFu.body=x.body;callFu.ccOn=!!callFu.cc&&!["vm","noanswer","nudge"].includes(callFu.tpl);render();return true;}
