*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1,"ss01" 1;overflow:hidden}

.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:0;height:0}

/* ---------- kiosk shell ---------- */
.kiosk{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:28px;padding:16px 32px;background:var(--card);border-bottom:1px solid var(--line)}
.top .logo{height:46px;width:auto;display:block}
.top .sep{width:1px;height:38px;background:var(--line)}
.top .ttl{font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.top .ttl small{display:block;font-weight:500;font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink2);background:#fff;white-space:nowrap}
.icon{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.icon:hover{background:var(--bg)}
.icon svg{width:20px;height:20px}
.main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:22px;padding:22px 32px 26px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-height:0}

/* ---------- leaderboard ---------- */
.board{display:flex;flex-direction:column;overflow:hidden;position:relative}
.bh{display:flex;align-items:baseline;justify-content:space-between;padding:22px 28px 12px}
.bh h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.bh .sub{font-size:14px;color:var(--muted);font-weight:500}
.bv{flex:1;position:relative;overflow:hidden;--rh:72px}
.rows{position:absolute;left:0;right:0;top:0;will-change:transform}
.row{display:grid;grid-template-columns:78px minmax(0,1fr) auto;align-items:center;gap:16px;padding:0 28px;height:var(--rh);border-top:1px solid var(--line);position:relative;background:#fff;transition:background .6s}
.row.new{background:var(--accent2);animation:rowin .7s ease-out}
@keyframes rowin{0%{opacity:0}60%{opacity:0}100%{opacity:1}}
.row .rk{font-weight:800;font-size:calc(var(--rh)*.36);letter-spacing:-.03em;color:var(--ink2)}
.row.r1 .rk{color:var(--gold)} .row.r2 .rk{color:var(--silver)} .row.r3 .rk{color:var(--bronze)}
.row.r1::before,.row.r2::before,.row.r3::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.row.r2::before{background:var(--silver)} .row.r3::before{background:var(--bronze)}
.row .nm{min-width:0}
.row .nm b{display:block;font-weight:700;font-size:calc(var(--rh)*.34);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.row .nm span{display:block;font-size:calc(var(--rh)*.19);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-weight:500}
.row .tm{font-weight:800;font-size:calc(var(--rh)*.38);letter-spacing:-.03em}
.row .tm small{font-size:.5em;font-weight:600;color:var(--muted);margin-left:2px}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);text-align:center;padding:40px}
.empty img{height:110px;opacity:.12}
.empty b{font-size:22px;color:var(--ink2);font-weight:700}
.empty span{font-size:15px;max-width:360px;line-height:1.5}
.fade{position:absolute;left:0;right:0;height:56px;pointer-events:none;z-index:2}
.fade.b{bottom:0;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff)}

/* ---------- right column ---------- */
.side{display:grid;grid-template-rows:auto minmax(0,1fr);gap:22px;min-height:0}
.stage{padding:26px 28px;position:relative;min-height:300px;display:flex;flex-direction:column}
.stage .lab{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stage .who{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:8px;word-break:break-word}
.stage .ask{font-size:clamp(34px,3.4vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:10px;word-break:break-word;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
.stage .ask em{font-style:normal;color:var(--accent)}
.stage .hob{font-size:15px;color:var(--muted);margin-top:6px;font-weight:500}
.clock{font-weight:800;font-size:clamp(64px,7.4vw,120px);letter-spacing:-.05em;line-height:1;margin:18px 0 8px;color:var(--ink)}
.clock.run{color:var(--accent)}
.clock.dim{color:var(--faint)}
.clock small{font-size:.32em;font-weight:700;color:var(--muted);letter-spacing:-.01em;margin-left:4px}
.big{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:78px;border-radius:18px;background:var(--ink);color:#fff;font-weight:800;font-size:24px;letter-spacing:.02em;transition:transform .08s}
.big:active{transform:scale(.985)}
.big.stop{background:var(--accent)}
.big kbd{font-family:inherit;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:2px 7px;opacity:.8}
.ghost{height:48px;border-radius:14px;border:1px solid var(--line);font-weight:600;font-size:15px;padding:0 18px;background:#fff;color:var(--ink2)}
.ghost:hover{background:var(--bg)}
.xbtn{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);font-size:18px;color:var(--muted);background:#fff}
.res{display:flex;align-items:center;gap:14px;margin-top:4px;flex-wrap:wrap}
.rank{display:inline-flex;align-items:baseline;gap:6px;border-radius:14px;padding:10px 16px;background:var(--ink);color:#fff;font-weight:800;font-size:26px;letter-spacing:-.02em}
.rank small{font-size:13px;font-weight:600;opacity:.75;letter-spacing:.02em}
.rank.top{background:var(--gold)}
.msg{font-size:16px;font-weight:600;color:var(--ink2)}
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px 0 6px}
.idle img{height:64px;opacity:.15;margin-bottom:6px}
.idle b{font-size:20px;font-weight:700}
.idle span{color:var(--muted);font-size:14px;max-width:300px;line-height:1.5}
.idle .big{margin-top:12px;height:64px;font-size:20px}

.queue{display:flex;flex-direction:column;overflow:hidden}
.qh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 10px}
.qh h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.qh h3 em{font-style:normal;color:var(--muted);font-weight:600;margin-left:6px}
.add{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 14px 9px 11px;font-size:13px;font-weight:700;color:#fff;background:var(--ink)}
.add:hover{background:#000}
.add.sec{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.add.sec:hover{background:var(--bg)}
.row{cursor:pointer}
.hit{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer;border:1px solid var(--line);margin-top:8px}
.hit:hover{background:var(--bg)}
.hit b{display:block;font-size:16px}
.hit span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.hit .bt{margin-left:auto;font-weight:800;font-size:18px;white-space:nowrap}
.ql{flex:1;overflow-y:auto;padding:0 12px 12px}
.q{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;border-radius:14px;cursor:pointer;border:1px solid transparent;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
.q:hover{background:var(--bg)}
.q.sel{border-color:var(--ink);background:#fff}
.q .av{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--ink2);flex:none}
.q.fresh .av{background:var(--accent2);color:var(--accent)}
.q .qn{flex:1;min-width:0}
.q .qn b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .qn span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.q .tag{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent2);border-radius:999px;padding:4px 8px;letter-spacing:.04em;text-transform:uppercase}
.q .go{width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.q .go svg{width:16px;height:16px}
.q .go:hover{background:#000}
.qempty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
@keyframes pop{0%{transform:translateY(-8px) scale(.98);opacity:0}100%{transform:none;opacity:1}}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,11,12,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
.sheet{background:#fff;border-radius:24px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.sheet h3{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.sheet .sub{font-size:14px;color:var(--muted);margin-bottom:18px;line-height:1.45}
.f{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;background:#fff;outline:none;transition:border-color .15s}
.f:focus{border-color:var(--ink)}
.f.bad{border-color:var(--accent)}
label.l{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
label.l i{font-style:normal;color:var(--muted);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:10px;margin-top:22px;justify-content:flex-end;flex-wrap:wrap}
.btn{height:50px;border-radius:14px;padding:0 20px;font-weight:700;font-size:15px;background:var(--ink);color:#fff}
.btn.sec{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.set{border-top:1px solid var(--line);padding:16px 0;display:flex;align-items:center;gap:14px}
.set:last-child{border-bottom:1px solid var(--line)}
.set .st{flex:1;min-width:0}
.set .st b{display:block;font-size:15px;font-weight:700}
.set .st span{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink2);background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
.note.bad{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){.main{grid-template-columns:1fr 1fr}.top .ttl{font-size:18px}}
@media (max-width:820px){body{overflow:auto}.kiosk{height:auto}.main{grid-template-columns:1fr;padding:16px}.side{grid-template-rows:auto auto}.board{height:70vh}.queue{min-height:40vh}}
</style>

// every conference this laptop has a board for (localStorage keys) -> [{slug,name,count}]
function savedEvents(){const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith("autotq_challenge_v2:"))continue;const slug=k.slice(20);let n=0;try{n=Object.keys(JSON.parse(localStorage.getItem(k)||"{}").entries||{}).length;}catch(e){}
  out.push({slug,name:(cfg.events||{})[slug]||unslug(slug),count:n});}return out.sort((a,b)=>a.name.localeCompare(b.name));}
const EMAIL_OK=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function fmt(ms){if(ms==null)return "—";ms=Math.max(0,Math.round(ms));const m=Math.floor(ms/60000),s=((ms%60000)/1000);
  return m?`${m}:${s.toFixed(2).padStart(5,"0")}`:s.toFixed(2);}
function unit(ms){return ms!=null&&ms>=60000?"":"s";}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2400);}

let cfg={};try{cfg=JSON.parse(localStorage.getItem(CFG_KEY)||"{}");}catch(e){}
if(qs.get("event")){cfg.name=qs.get("event");cfg.slug=slugify(cfg.name);}
const ST={booted:false,entries:{},cur:null,phase:"idle",t0:0,elapsed:0,seen:{},pan:{y:0,mode:"top",hold:0,t:0,until:0},lastResult:null,doneTimer:null};
const dataKey=()=>"autotq_challenge_v2:"+cfg.slug;
function loadLocal(){ST.entries={};try{ST.entries=JSON.parse(localStorage.getItem(dataKey())||"{}").entries||{};}catch(e){}
  all().forEach(r=>{if(!r.attempts)r.attempts=r.time_ms!=null?[r.time_ms]:[];});}
function saveLocal(){try{localStorage.setItem(dataKey(),JSON.stringify({entries:ST.entries,savedAt:new Date().toISOString()}));}catch(e){toast("Couldn't save — storage is full or blocked");}}
function saveCfg(){localStorage.setItem(CFG_KEY,JSON.stringify(cfg));}

/* ---- derived lists ---- */
const all=()=>Object.values(ST.entries).filter(Boolean);
function ranked(){return all().filter(r=>r.status==="done"&&r.time_ms!=null).sort((a,b)=>a.time_ms-b.time_ms||String(a.finished_at||"").localeCompare(String(b.finished_at||"")));}
function rankOf(id){const i=ranked().findIndex(r=>r.id===id);return i<0?null:i+1;}
function waiting(){return all().filter(r=>r.status!=="done"&&r.id!==ST.cur).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));}

function shell(){

    <div class="top">

  $("setbtn").onclick=()=>openSettings();
  $("fsbtn").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});};
  $("addbtn").onclick=()=>openAdd();
  $("findbtn").onclick=()=>openFind();
  $("rows").addEventListener("click",e=>{const row=e.target.closest(".row");if(row&&row.dataset.id)select(row.dataset.id,false);});
  $("ql").addEventListener("click",e=>{const q=e.target.closest(".q");if(!q)return;select(q.dataset.id,!!e.target.closest(".go"));});
  const ACT={start,stop,next,redo,again,reset,cancel,remove:removeCur,add:openAdd};
  $("stage").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&ACT[b.dataset.act])ACT[b.dataset.act]();});

function renderHeader(){$("evpill").textContent=cfg.name||"Event";}

/* ---- leaderboard ---- */
function sizeRows(){const bv=$("bv");if(!bv)return;bv.style.setProperty("--rh",Math.max(44,Math.floor(bv.clientHeight/TOP))+"px");}
function renderBoard(){
  const list=ranked().slice(0,PAN_MAX),rows=$("rows");if(!rows)return;
  const before={};rows.querySelectorAll(".row").forEach(el=>before[el.dataset.id]=el.getBoundingClientRect().top);
  $("bsub").textContent=list.length?`Top ${Math.min(list.length,TOP)} · ${ranked().length} timed`:"";
  if(!list.length){rows.style.height="100%";rows.innerHTML=`<div class="empty"><img src="${LOGO.ring}" alt=""><b>The board is open.</b><span>First person to stop the bleed sets the time to beat.</span></div>`;rows.style.transform="none";$("fadeb").style.opacity=0;return;}
  rows.style.height="";
  rows.innerHTML=list.map((r,i)=>`<div class="row r${i+1} ${ST.lastResult&&ST.lastResult.id===r.id&&Date.now()-ST.lastResult.at<15000?"new":""}" data-id="${r.id}">
    <div class="rk num">${i+1}</div>
    <div class="nm"><b>${esc(r.name)}</b>${r.hobby?`<span>${esc(r.hobby)}</span>`:""}</div>
    <div class="tm num">${fmt(r.time_ms)}<small>${unit(r.time_ms)}</small></div></div>`).join("");
  // FLIP: slide rows from their old spot to the new one
  rows.querySelectorAll(".row").forEach(el=>{const id=el.dataset.id;if(before[id]==null)return;const d=before[id]-el.getBoundingClientRect().top;if(!d)return;
    el.style.transition="none";el.style.transform=`translateY(${d}px)`;requestAnimationFrame(()=>{el.style.transition="transform .55s cubic-bezier(.2,.8,.2,1)";el.style.transform="";});});
  layoutBoard();
}
function overflowPx(){const bv=$("bv"),rows=$("rows");if(!bv||!rows)return 0;return Math.max(0,rows.scrollHeight-bv.clientHeight);}
function layoutBoard(){const o=overflowPx();$("fadeb").style.opacity=o>0?1:0;if(o<=0){ST.pan.y=0;ST.pan.mode="top";ST.pan.until=0;$("rows").style.transform="none";}}
// Auto-pan: rest at the top, glide down through the top 50, rest, glide back.
const PAN={restTop:7000,restBot:4000,speed:34};// px per second
function panTick(now){
  const o=overflowPx(),rows=$("rows");if(!rows||o<=0)return;
  const p=ST.pan;const dt=Math.min(100,now-(p.t||now));p.t=now;
  if(p.hold>now)return;
  if(p.mode==="top"){if(!p.until)p.until=now+PAN.restTop;if(now>=p.until){p.mode="down";p.until=0;}}
  else if(p.mode==="down"){p.y=Math.min(o,p.y+PAN.speed*dt/1000);if(p.y>=o){p.mode="bot";p.until=now+PAN.restBot;}}
  else if(p.mode==="bot"){if(now>=p.until){p.mode="up";p.until=0;}}
  else if(p.mode==="up"){p.y=Math.max(0,p.y-PAN.speed*dt/1000*1.6);if(p.y<=0){p.mode="top";p.until=now+PAN.restTop;}}
  rows.style.transform=`translateY(${-Math.round(p.y)}px)`;
}
function revealRank(rank){ // scroll so a freshly ranked row is visible, then hold
  const bv=$("bv");if(!bv||!rank)return;const rh=parseFloat(getComputedStyle(bv).getPropertyValue("--rh"))||72;
  const o=overflowPx();if(o<=0)return;
  const target=rank<=TOP?0:Math.max(0,Math.min(o,(rank-1)*rh-bv.clientHeight/2+rh/2));
  ST.pan.y=target;ST.pan.hold=performance.now()+9000;ST.pan.mode=target<=0?"top":target>=o?"bot":"down";ST.pan.until=0;
  $("rows").style.transition="transform .8s cubic-bezier(.2,.8,.2,1)";$("rows").style.transform=`translateY(${-Math.round(target)}px)`;
  setTimeout(()=>{$("rows").style.transition="";},900);
}

  const x=`<button class="xbtn" data-act="cancel" title="Back to list">×</button>`;
  if(ST.phase==="ready"){
    const again=r.attempts&&r.attempts.length;
    s.innerHTML=x+`<div class="lab">${again?"Another go":"Now up"}</div><div class="ask"><em>${esc(first(r.name))}</em>, ${again?"ready to beat "+fmt(r.time_ms)+unit(r.time_ms)+"?":"are you ready?"}</div>${r.hobby?`<div class="hob">${esc(r.hobby)}${again?" · best "+fmt(r.time_ms)+unit(r.time_ms)+" · #"+rankOf(r.id):""}</div>`:(again?`<div class="hob">Best ${fmt(r.time_ms)}${unit(r.time_ms)} · #${rankOf(r.id)} on the board</div>`:"")}
      <div class="clock num dim" id="clock">0.00<small>s</small></div><button class="big" data-act="start">Start the clock <kbd>space</kbd></button>
      <div class="acts" style="margin-top:12px;justify-content:flex-start"><button class="ghost" data-act="remove" style="height:40px;font-size:13px">Remove entrant</button></div>`;
  }else if(ST.phase==="running"){
    s.innerHTML=x+`<div class="lab">Go, ${esc(first(r.name))}!</div><div class="who">${esc(r.name)}</div>
      <div class="clock num run" id="clock">0.00<small>s</small></div><button class="big stop" data-act="stop">Stop <kbd>space</kbd></button>
      <div class="acts" style="margin-top:12px;justify-content:flex-start"><button class="ghost" data-act="reset" style="height:40px;font-size:13px">Reset clock — false start</button></div>`;
  }else if(ST.phase==="done"){
    const rk=rankOf(r.id),n=ranked().length,att=r.attempts||[],pb=ST.elapsed<=r.time_ms;
    const msg=!pb?`Didn't beat their best of ${fmt(r.time_ms)}${unit(r.time_ms)} — the board keeps the best.`:rk===1?"New fastest time on the board.":rk<=3?"Podium finish.":rk<=TOP?"Made the top 10.":"Just outside the top 10.";
    s.innerHTML=x+`<div class="lab">${att.length>1?"Run "+att.length+(pb?" · personal best":""):"Result"}</div><div class="who">${esc(r.name)}</div>${r.hobby?`<div class="hob">${esc(r.hobby)}</div>`:""}
      <div class="clock num" id="clock">${fmt(ST.elapsed)}<small>${unit(ST.elapsed)}</small></div>
      <div class="res"><span class="rank ${rk===1?"top":""}">#${rk}<small>of ${n}</small></span><span class="msg">${msg}</span></div>
      <div class="acts" style="margin-top:20px"><button class="ghost" data-act="redo" title="Throw this run out">Discard run</button><button class="ghost" data-act="again">Go again</button><button class="big" data-act="next" style="width:auto;flex:1;height:56px;font-size:18px">Next up <kbd>enter</kbd></button></div>`;
  }
}
function tickClock(now){if(ST.phase!=="running")return;const c=$("clock");if(!c)return;const ms=now-ST.t0;c.innerHTML=fmt(ms)+`<small>${unit(ms)}</small>`;}
function select(id,andStart){
  const r=ST.entries[id];if(!r)return;
  if(ST.phase==="running")return toast("Stop the running clock first");
  clearTimeout(ST.doneTimer);
  ST.cur=id;ST.phase="ready";ST.elapsed=0;
  renderStage();renderQueue();
  if(andStart)start();
}
function start(){const r=cur();if(!r||ST.phase!=="ready")return;ST.phase="running";ST.t0=performance.now();r.status="running";saveLocal();renderStage();renderQueue();}
function stop(){const r=cur();if(!r||ST.phase!=="running")return;
  ST.elapsed=Math.round(performance.now()-ST.t0);ST.phase="done";
  r.attempts=(r.attempts||[]);r.attempts.push(ST.elapsed);
  if(r.time_ms==null||ST.elapsed<r.time_ms){r.time_ms=ST.elapsed;r.finished_at=new Date().toISOString();}
  r.status="done";r.lastRun=new Date().toISOString();saveLocal();
  ST.lastResult={id:r.id,at:Date.now()};
  renderStage();renderBoard();renderQueue();
  revealRank(rankOf(r.id));
  ST.doneTimer=setTimeout(()=>{if(ST.phase==="done")next();},45000);
}
function next(){clearTimeout(ST.doneTimer);ST.cur=null;ST.phase="idle";ST.elapsed=0;renderStage();renderQueue();renderBoard();}
function redo(){ // throw out the run that just happened, keep any earlier ones
  const r=cur();if(!r)return;clearTimeout(ST.doneTimer);
  const att=(r.attempts||[]).slice(0,-1);r.attempts=att;
  if(att.length){r.time_ms=Math.min.apply(null,att);r.status="done";}else{r.time_ms=null;r.finished_at=null;r.status="waiting";}
  saveLocal();ST.phase="ready";ST.elapsed=0;renderStage();renderBoard();renderQueue();}
function again(){const r=cur();if(!r)return;clearTimeout(ST.doneTimer);ST.phase="ready";ST.elapsed=0;renderStage();renderQueue();}
function reset(){if(ST.phase!=="running")return;const r=cur();ST.phase="ready";ST.elapsed=0;if(r&&r.status==="running")r.status=(r.attempts||[]).length?"done":"waiting";saveLocal();renderStage();toast("Clock reset — no time recorded");}
function cancel(){const r=cur();if(r&&ST.phase==="running")return toast("Stop the clock first");
  if(r&&r.status==="running"){r.status=(r.attempts||[]).length?"done":"waiting";saveLocal();}
  next();}
function removeCur(){const r=cur();if(!r||ST.phase==="running")return;
  if(!confirm(`Remove ${r.name}${r.time_ms!=null?" and their time":""} from this conference?`))return;
  delete ST.entries[r.id];saveLocal();next();toast("Removed");}

/* ---- waiting list ---- */
function renderQueue(){
  const list=waiting(),ql=$("ql");if(!ql)return;
  $("qcount").textContent=list.length?`· ${list.length}`:"";
  if(!list.length){ql.innerHTML=`<div class="qempty">Nobody waiting. Anyone added while someone else is up lands here.</div>`;return;}
  const now=Date.now();
  // keyed update: existing rows are patched in place so only true newcomers play the pop-in animation
  const have={};ql.querySelectorAll(".q").forEach(el=>have[el.dataset.id]=el);
  const keep=new Set(list.map(r=>r.id));
  Array.from(ql.children).forEach(el=>{if(!el.classList.contains("q")||!keep.has(el.dataset.id))el.remove();});
  list.forEach((r,i)=>{
    const fresh=(now-(ST.seen[r.id]||0))<20000;const ini=esc((r.name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase());
    const cls=`q ${fresh?"fresh":""}`;
    const inner=`<div class="av">${ini}</div><div class="qn"><b>${esc(r.name)}</b><span>${esc(r.hobby||r.email||"")}</span></div>${fresh?`<span class="tag">Just added</span>`:""}<button class="go" title="Bring up and start">${I.play}</button>`;
    let el=have[r.id];
    if(!el){el=document.createElement("div");el.dataset.id=r.id;el.className=cls;el.innerHTML=inner;el.dataset.sig=inner;}
    else{if(el.className!==cls)el.className=cls;if(el.dataset.sig!==inner){el.innerHTML=inner;el.dataset.sig=inner;}}
    if(ql.children[i]!==el)ql.insertBefore(el,ql.children[i]||null);
  });
}

/* ---- add-entrant sheet ---- */
function sheet(html){closeSheet();const d=document.createElement("div");d.className="scrim";d.id="scrim";d.innerHTML=`<div class="sheet">${html}</div>`;
  d.addEventListener("click",e=>{if(e.target===d)closeSheet();});document.body.appendChild(d);return d;}
function closeSheet(){const d=$("scrim");if(d)d.remove();}
function openAdd(){
  if(ST.phase==="running")return toast("Stop the running clock first");
  sheet(`<h3>Add entrant</h3><div class="sub">Name and email are required — that's the lead. Add and their name pops up on the screen.</div>
    <label class="l">Name</label><input class="f" id="wn" placeholder="First and last name" maxlength="80" autocomplete="off">
    <label class="l">Email</label><input class="f" id="we" type="email" placeholder="name@company.com" maxlength="120" autocomplete="off">
    <div class="two"><div><label class="l">Phone <i>optional</i></label><input class="f" id="wp" type="tel" placeholder="(555) 555-5555" maxlength="40" autocomplete="off"></div>
    <div><label class="l">Favorite hobby <i>optional</i></label><input class="f" id="wh" placeholder="Fishing, pickleball…" maxlength="80" autocomplete="off"></div></div>
    <div class="note bad" id="wm"></div>
    <div class="acts"><button class="btn sec" id="wc">Cancel</button><button class="btn" id="wg">Add <kbd style="font-family:inherit;font-size:11px;opacity:.7;margin-left:6px">enter</kbd></button></div>`);
  setTimeout(()=>$("wn").focus(),50);
  const save=()=>{
    const name=($("wn").value||"").trim(),email=($("we").value||"").trim().toLowerCase();
    ["wn","we"].forEach(id=>$(id).classList.remove("bad"));
    if(name.length<2){$("wn").classList.add("bad");$("wm").textContent="Enter their name.";$("wn").focus();return;}
    if(!EMAIL_OK.test(email)){$("we").classList.add("bad");$("wm").textContent="Enter a valid email — it's required.";$("we").focus();return;}
    const dupe=all().find(r=>(r.email||"").toLowerCase()===email);
    if(dupe&&!confirm(`${email} is already on the list as ${dupe.name}. Add anyway?`))return;
    const rec={id:uuid(),name,email,phone:($("wp").value||"").trim(),hobby:($("wh").value||"").trim(),status:"waiting",attempts:[],created_at:new Date().toISOString()};
    ST.entries[rec.id]=rec;ST.seen[rec.id]=Date.now();saveLocal();closeSheet();
    select(rec.id,false); // → "First, are you ready?"
  };
  $("wc").onclick=closeSheet;$("wg").onclick=save;
  $("scrim").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();save();}});
}

/* ---- find entrant (another run, or check their result) ---- */
function openFind(){
  if(ST.phase==="running")return toast("Stop the running clock first");
  sheet(`<h3>Find entrant</h3><div class="sub">Search by name or email — tap them to bring them up for another run.</div>
    <input class="f" id="fq" placeholder="Start typing a name…" autocomplete="off"><div id="fr"></div>`);
  setTimeout(()=>$("fq").focus(),50);
  const draw=()=>{const q=($("fq").value||"").trim().toLowerCase();const list=all().filter(r=>!q||(r.name||"").toLowerCase().includes(q)||(r.email||"").toLowerCase().includes(q))
      .sort((a,b)=>(a.name||"").localeCompare(b.name||"")).slice(0,q?30:8);
    $("fr").innerHTML=list.length?list.map(r=>{const rk=rankOf(r.id);return `<div class="hit" data-id="${r.id}"><div><b>${esc(r.name)}</b><span>${esc(r.email||"")}${r.hobby?" · "+esc(r.hobby):""}${(r.attempts||[]).length>1?" · "+r.attempts.length+" runs":""}</span></div><div class="bt num">${r.time_ms!=null?fmt(r.time_ms)+unit(r.time_ms)+' <small style="color:var(--muted);font-size:12px">#'+rk+'</small>':'<small style="color:var(--muted);font-size:13px;font-weight:600">not timed</small>'}</div></div>`;}).join(""):
      `<div class="note">${all().length?"No one matches.":"Nobody entered yet."}</div>`;};
  $("fq").addEventListener("input",draw);draw();
  $("fr").addEventListener("click",e=>{const h=e.target.closest(".hit");if(!h)return;closeSheet();select(h.dataset.id,false);});
  $("scrim").addEventListener("keydown",e=>{if(e.key==="Enter"){const h=$("fr").querySelector(".hit");if(h){e.preventDefault();closeSheet();select(h.dataset.id,false);}}});
}

/* ---- settings sheet ---- */
function openSettings(){
  const setup=!cfg.slug;
  const saved=savedEvents();
  sheet(`<h3>Select conference</h3><div class="sub">${setup?"Pick a conference this laptop already has a board for, or start a new one. Every day's results stay under the conference name.":"Version "+VERSION+" · "+all().filter(r=>!r.sample).length+" entrants on this board"}</div>
    ${saved.length?`<label class="l">Saved on this computer</label><div class="chips" id="evs">${saved.map(e=>`<button class="chip ${e.slug===cfg.slug?"on":""}" data-slug="${esc(e.slug)}" data-name="${esc(e.name)}">${esc(e.name)}<span style="opacity:.6;font-weight:500"> · ${e.count}</span></button>`).join("")}</div>`:""}
    <label class="l">${saved.length?"Or a new conference":"Conference name"}</label><input class="f" id="sn" value="" placeholder="e.g. NSC 2026 · Denver" maxlength="60">
    <div class="acts"><button class="btn" id="ssave">${setup?"Open the board":"Open"}</button></div>
    ${setup?"":`
    <div style="margin-top:26px">
      <div class="set"><div class="st"><b>Export leads (CSV)</b><span>Everyone entered — name, email, phone, hobby, time, rank. Do this before closing the laptop.</span></div><button class="btn sec" id="xleads">Export</button></div>
      <div class="set"><div class="st"><b>Sample entrants</b><span>Fake names to see the board pan. Cleared with one tap.</span></div><button class="btn sec" id="samp">Load 14</button><button class="btn sec" id="unsamp">Clear</button></div>
    </div>`}`);
  const evs=$("evs");if(evs)evs.onclick=e=>{const b=e.target.closest("[data-slug]");if(!b)return;openEvent(b.dataset.slug,b.dataset.name);};
  $("ssave").onclick=()=>{const name=($("sn").value||"").trim();if(name.length<2){$("sn").focus();return toast("Type the conference name");}openEvent(slugify(name),name);};
  if(setup)return;
  $("xleads").onclick=exportLeads;
  $("samp").onclick=()=>{loadSamples();closeSheet();toast("14 sample entrants added");};
  $("unsamp").onclick=()=>{Object.keys(ST.entries).forEach(id=>{if(ST.entries[id].sample)delete ST.entries[id];});if(ST.cur&&!ST.entries[ST.cur])next();saveLocal();renderBoard();renderQueue();closeSheet();toast("Samples cleared");};
}
function openEvent(slug,name){
  const changed=slug!==cfg.slug;cfg.name=name;cfg.slug=slug;cfg.events=cfg.events||{};cfg.events[slug]=name;saveCfg();closeSheet();
  if(changed||!ST.booted){loadLocal();ST.cur=null;ST.phase="idle";ST.booted=true;shell();}else renderHeader();
  toast(changed?name+" — board open":"Saved");
}
function exportLeads(){
  const rk={};ranked().forEach((r,i)=>rk[r.id]=i+1);
  const rows=all().filter(r=>!r.sample).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
  if(!rows.length)return toast("Nobody entered yet");
  const out=[["Rank","Name","Email","Phone","Hobby","Best time (s)","Runs","All runs (s)","Status","Entered","Conference"]].concat(rows.map(r=>[rk[r.id]||"",r.name,r.email||"",r.phone||"",r.hobby||"",r.time_ms!=null?(r.time_ms/1000).toFixed(2):"",(r.attempts||[]).length,(r.attempts||[]).map(a=>(a/1000).toFixed(2)).join(" | "),r.time_ms!=null?"timed":"not timed",r.created_at||"",cfg.name||""]));
  dl(csv(out),`AutoTQ_Challenge_${cfg.slug}_leads.csv`);toast(`${rows.length} leads exported`);
}
const csv=rows=>rows.map(r=>r.map(v=>{v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\r\n");
function dl(text,name){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:"text/csv"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function loadSamples(){
  const names=["Jordan Blake","Priya Natarajan","Marcus Lee","Dana Whitfield","Tomás Herrera","Kelsey Nguyen","Andre Boateng","Rae Lindqvist","Sam Okafor","Mia Castellano","Devin Park","Holly Brandt","Luis Ortega","Nora Feldman"];
  const hobbies=["Fly fishing","Pickleball","Woodworking","Trail running","Guitar","Cooking","Bass fishing","Photography","Golf","Hiking","Cycling","Gardening","Bowling","Chess"];
  names.forEach((n,i)=>{const id="sample-"+i;const done=i<12;const t=new Date(Date.now()-(20-i)*60000).toISOString();
    ST.entries[id]={id,name:n,email:n.toLowerCase().replace(/[^a-z]+/g,".")+"@example.com",hobby:hobbies[i],sample:true,created_at:t,status:done?"done":"waiting",time_ms:done?Math.round(9000+Math.random()*14000):null,finished_at:done?t:null};ST.entries[id].attempts=done?[ST.entries[id].time_ms]:[];ST.seen[id]=Date.now()-(done?60000:0);});
  saveLocal();renderBoard();renderQueue();
}

/* ---- keyboard, wake lock, loop ---- */
document.addEventListener("keydown",e=>{
  if($("scrim")){if(e.key==="Escape")closeSheet();return;}
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.code==="Space"||e.key===" "||e.key==="Spacebar"){e.preventDefault();if(ST.phase==="ready")start();else if(ST.phase==="running")stop();}
  else if(e.key==="Enter"){if(ST.phase==="done")next();}
  else if(e.key==="Escape"){if(ST.phase!=="running")cancel();}
  else if((e.key==="n"||e.key==="N")&&ST.phase!=="running")openAdd();
  else if((e.key==="f"||e.key==="F"||e.key==="/")&&ST.phase!=="running"){e.preventDefault();openFind();}
});
let wl=null;async function wake(){try{if("wakeLock"in navigator&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null;});}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake();});
document.addEventListener("click",()=>wake(),{once:true});
function loop(now){tickClock(now);panTick(now);requestAnimationFrame(loop);}
// age out the "just added" tags and the new-row highlight
setInterval(()=>{if(!$("scrim")){renderQueue();if(ST.lastResult&&Date.now()-ST.lastResult.at>15000&&Date.now()-ST.lastResult.at<20000)renderBoard();}},5000);
window.addEventListener("beforeunload",e=>{if(ST.phase==="running"){e.preventDefault();e.returnValue="";}});

if(!cfg.slug){shell();openSettings();}
else{loadLocal();ST.booted=true;shell();}
requestAnimationFrame(loop);
</script>
</body>
</html>
