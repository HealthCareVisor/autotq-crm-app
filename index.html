/* ---------- DASHBOARD ---------- */
function hbars(rows,fmt){
  if(!rows.length)return '<div class="empty" style="padding:14px">No data yet.</div>';
  const top=Math.max(...rows.map(r=>r.v))||1;
  fmt=fmt||(v=>String(v));
  return '<div class="hbars">'+rows.map(r=>'<div class="hrow" title="'+esc(r.l)+': '+esc(fmt(r.v))+'"><span class="hl">'+esc(r.l)+'</span><span class="ht">'+(r.v>0?'<i style="width:'+Math.max(1,Math.round(r.v/top*100))+'%'+(r.c?';background:'+r.c:'')+'"></i>':'')+'</span><span class="hv">'+fmt(r.v)+'</span></div>').join("")+'</div>';
}
function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.v,0);
  if(!total)return '<div class="empty" style="padding:14px">No data yet.</div>';
  /* 2px surface gap between segments (only when more than one segment is non-zero) */
  let acc=0;const R=35,C=2*Math.PI*R,live=segs.filter(s=>s.v>0).length,gap=live>1?2:0;
  const arcs=segs.map(s=>{const f=s.v/total,off=C*(1-acc),len=Math.max(0,C*f-gap);acc+=f;if(!s.v)return "";
    return '<circle r="'+R+'" cx="45" cy="45" fill="none" stroke="'+s.c+'" stroke-width="12" stroke-dasharray="'+len.toFixed(1)+' '+(C-len).toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 45 45)"><title>'+esc(s.l)+': '+esc(s.f)+'</title></circle>';}).join("");
  const legend=segs.map(s=>'<span class="lg"><i style="background:'+s.c+'"></i>'+esc(s.l)+'<b>'+s.f+'</b></span>').join("");
  return '<div class="dnut"><svg width="96" height="96" viewBox="0 0 90 90" role="img" aria-label="'+esc(segs.map(s=>s.l+" "+s.f).join(", "))+'">'+arcs+'</svg><div class="legend">'+legend+'</div></div>';
}
const CHART_COLORS=["#D85A30","#185FA5","#3B6D11","#854F0B","#993556","#6b6a64"];
/* ordered stages read as one coral ramp, light → dark (validated: monotone L, single hue) */
const ORDINAL_CORAL=["#F0A487","#E47D57","#D85A30","#B3441F","#8A3217"];
/* region colors follow the entity everywhere (East blue · Central amber · West teal · Nationwide coral);
   validated adjacent-pair CVD ΔE ≥ 9, normal-vision ΔE ≥ 23 — legend + counts carry the amber's low contrast */
const REGION_COLORS={East:"#2F6FB8",Central:"#D19A12",West:"#178A73",Nationwide:"#D85A30",Unassigned:"#B8B3A8"};
function viewDash(){
  const opps=myOpps(), open=opps.filter(oppIsOpen);

  let h='<div class="kpis">'+
   '<div class="kpi"><b>Open pipeline</b><span>'+fmtK(openAmt)+'</span><small>'+open.length+' deals</small></div>'+
   '<div class="kpi"><b>Weighted</b><span>'+fmtK(wAmt)+'</span></div>'+
   '<div class="kpi"><b>Closed won</b><span>'+fmtK(wonAmt)+'</span></div>'+
   '<div class="kpi"><b>Revenue shipped</b><span>'+fmtK(rev)+'</span><small>'+units+' units</small></div>'+
   '<div class="kpi"><b>Demos out</b><span>'+dms.length+'</span></div>'+
   '<div class="kpi"><b>Accounts</b><span>'+cos.length+'</span><small>'+ppl.length+' contacts</small></div>'+
  '</div>';
  const dist=cos.filter(c=>c.type==="distributor");
  const funnelRows=ESTAGES.map((s,i)=>({l:s,v:dist.filter(c=>enableStage(c)===s).length,c:ORDINAL_CORAL[i]}));
  const topVol=dist.filter(c=>(c.units||0)>0).sort((a,b)=>(b.units||0)-(a.units||0)).slice(0,8).map(c=>({l:c.name,v:c.units||0}));
  const byState={};dms.forEach(d=>{const st=(d.state||"").toUpperCase();if(st)byState[st]=(byState[st]||0)+1;});
  const demoRows=Object.entries(byState).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([l,v])=>({l:l,v:v}));
  const regs={};ppl.forEach(p=>{const r=personRegion(p)||"Unassigned";regs[r]=(regs[r]||0)+1;});
  const regSegs=["East","Central","West","Nationwide","Unassigned"].filter(r=>regs[r]).concat(Object.keys(regs).filter(r=>!REGION_COLORS[r]))
    .map((l,i)=>({l:l,v:regs[l],f:String(regs[l]),c:REGION_COLORS[l]||CHART_COLORS[(i+1)%6]}));
  const cards=[];
  cards.push('<div class="dcard"><h3>Distributor enablement funnel</h3>'+hbars(funnelRows)+'</div>');
  cards.push('<div class="dcard"><h3>Top distributors by units</h3>'+hbars(topVol)+'</div>');
  const cl=confLeadLists();
  if(cl.length){
    /* progress reads as a meter: contacted = coral fill, still to call = lighter step of the same ramp */
    const segs=cl.flatMap((x,i)=>[{l:x.conf+" · contacted",v:x.contacted,f:String(x.contacted),c:"#D85A30"},
                                  {l:x.conf+" · to call",v:x.tocall,f:String(x.tocall),c:"#F2C4B2"}]);
    cards.push('<div class="dcard"><h3>Conference call-list progress</h3>'+donutSVG(segs)+'</div>');
  }
  if(open.length){
    const stageRows=OPP_STAGES.slice(0,4).map((s,i)=>({l:OPP_SHORT[s],v:open.filter(o=>o.stage===s).reduce((a,o)=>a+(o.amount||0),0),c:ORDINAL_CORAL[i+1]}));
    cards.push('<div class="dcard"><h3>Open pipeline by stage</h3>'+hbars(stageRows,fmtK)+'</div>');
  }else{
    cards.push('<div class="dcard"><h3>Open pipeline by stage</h3><div class="empty" style="padding:14px">No deals yet — the chart appears as you add opportunities.</div></div>');
  }
  cards.push('<div class="dcard"><h3>Demos by state</h3>'+hbars(demoRows)+'</div>');
  cards.push('<div class="dcard"><h3>Contacts by region</h3>'+donutSVG(regSegs)+'</div>');
  h+='<div class="dgrid">'+cards.join("")+'</div>';
  return h;
}

/* ---------- DISTRIBUTOR VOLUME ---------- */
function viewInsights(){
  const dist=DB.companies.filter(c=>c.type==="distributor"&&(admin()||inRegion(companyRegion(c))));
  const pool=dist.filter(c=>(c.units||0)>0||(c.orders||0)>0||(c.demoCount||0)>0)
    .sort((a,b)=>(b.units||0)-(a.units||0)||(b.revenue||0)-(a.revenue||0));
  const units=pool.reduce((s,c)=>s+(c.units||0),0), rev=pool.reduce((s,c)=>s+(c.revenue||0),0);
  const orders=pool.reduce((s,c)=>s+(c.orders||0),0), demos=pool.reduce((s,c)=>s+(c.demoCount||0),0);
  let h='<div class="kpis">'+
   '<div class="kpi"><b>Units through distributors</b><span>'+units+'</span></div>'+
   '<div class="kpi"><b>Revenue</b><span>'+fmtK(rev)+'</span></div>'+
   '<div class="kpi"><b>Orders</b><span>'+orders+'</span></div>'+
   '<div class="kpi"><b>Demo units picked up</b><span>'+demos+'</span><small>across '+pool.filter(c=>c.demoCount).length+' distributors</small></div></div>';
  if(!pool.length)return h+'<div class="empty">No distributor volume yet.</div>';
  const top=pool[0].units||1;
  h+='<div class="sectlabel">Distributor volume — units bought &amp; demos picked up</div>';
  h+='<div class="list">'+pool.map((c,i)=>'<button class="card" data-act="roster" data-id="'+c.id+'"><div class="row"><span class="ic '+(i<3?"coral":"")+'" style="border-radius:10px">'+(i<3?(i+1):svg("ware"))+'</span>'+
    '<div class="grow"><p class="t1">'+esc(c.name)+'</p>'+
    '<p class="t2">'+money(c.revenue||0)+' · '+(c.orders||0)+' order'+((c.orders||0)===1?'':'s')+(c.lastOrder?' · last '+esc(c.lastOrder):'')+(c.demoCount?' · '+c.demoCount+' demo unit'+(c.demoCount>1?'s':'')+' out':'')+'</p></div>'+
    '<div style="text-align:right;font-weight:650;font-variant-numeric:tabular-nums">'+(c.units||0)+'u</div>'+chev()+'</div>'+
    '<div class="bar"><i style="width:'+Math.max(2,Math.round((c.units||0)/top*100))+'%"></i></div></button>').join("")+'</div>';
  h+='<button class="btn block" data-act="export" style="margin-top:10px">'+svg("dl")+' Export to CSV</button>';
  return h;
}

const BC_FIELDS=[["bcName","name"],["bcTitle","title"],["bcCoQ","company"],["bcEmail","email"],["bcPhone","phone"],["bcMobile","mobile"],["bcCity","city"],["bcState","state"]];

function bcThumb(msg){const b=logState.bc;if(!b||!(b.thumb||b.pdf))return "";
  return '<div class="row" style="margin-top:12px;gap:12px">'+(b.thumb?'<img src="'+b.thumb+'" alt="Business card" style="width:112px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--line)">':

   '<div class="grow t2" style="white-space:normal">'+msg+'</div></div>';}
/* downscale to ≤1600px JPEG — phone photos are 4–12 MB, the card reads fine at ~300 KB.
   A PDF scan is sent as-is (Claude reads PDFs natively) — no canvas, no pdf.js. */
function bcIsPdf(file){return file.type==="application/pdf"||/\.pdf$/i.test(file.name||"");}
function bcReadPdf(file){return new Promise((res,rej)=>{
  if(file.size>5e6){rej(new Error("big"));return;}
  const fr=new FileReader();fr.onload=()=>res({blob:file,dataUrl:String(fr.result),pdf:true});fr.onerror=()=>rej(new Error("read"));fr.readAsDataURL(file);});}
function bcShrink(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    cv.toBlob(b=>b?res({blob:b,dataUrl:cv.toDataURL("image/jpeg",.85)}):rej(new Error("encode")),"image/jpeg",.85);};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("decode"));};
  img.src=url;});}
function bcMatchCompany(name){const q=String(name||"").trim().toLowerCase();if(!q)return null;
  const strip=s=>shortAcct(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  return DB.companies.find(c=>(c.name||"").toLowerCase()===q)||DB.companies.find(c=>strip(c.name)===strip(q))||null;}
function bcSyncCompany(){const b=logState.bc;if(!b)return;const w=document.getElementById("bcKindWrap");
  if(w)w.style.display=(!b.cid&&val("bcCoQ"))?"block":"none";}
async function bcHandleFile(file){
  const b=logState.bc;if(!b||!file)return;
  const pdf=bcIsPdf(file);let shr;
  try{shr=pdf?await bcReadPdf(file):await bcShrink(file);}
  catch(e){toast(pdf?(e.message==="big"?"That PDF is over 5 MB — scan just the card page":"Couldn't open that PDF"):"Couldn't open that photo — try another");return;}
  b.blob=shr.blob;b.pdf=pdf;b.thumb=pdf?null:shr.dataUrl;b.name=pdf?(file.name||"card.pdf"):"";
  bcStatus(bcThumb('<span class="spinwheel" style="display:inline-block;width:16px;height:16px;border-width:2px;margin:0 8px -3px 0"></span>Reading the card…'));
  let card=null,why="";
  try{
    const r=await supa("/functions/v1/card-scan",{method:"POST",body:JSON.stringify({image:shr.dataUrl.split(",")[1],mime:pdf?"application/pdf":"image/jpeg"})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.card)card=j.card;else why=j.error||("HTTP "+r.status);
  }catch(e){why="offline";}
  if(logState.bc!==b)return; // sheet closed or reopened while reading
  if(!card){console.warn("card-scan:",why);
    // function not deployed / key missing — not the rep's photo. (An undeployed function fails its CORS
    // preflight, so the browser reports it as a network error even though we're online.)
    const setup=/HTTP 404|secret is not set|was rejected/.test(why)||(why==="offline"&&navigator.onLine);
    bcStatus(bcThumb((setup?"Automatic card reading isn't switched on yet (Max is finishing the setup)":"Couldn't read the card automatically")+" — type the details below. The card is still saved with the contact."));return;}
  b.card=card;let n=0;
  BC_FIELDS.forEach(f=>{const el=document.getElementById(f[0]);let v=String(card[f[1]]||"").replace(/&amp;/g,"&").trim();
    if(f[1]==="state")v=v.toUpperCase().slice(0,2);if(f[1]==="email")v=v.toLowerCase();
    if(el&&v&&!el.value.trim()){el.value=v;n++;}});
  const hit=bcMatchCompany(val("bcCoQ"));
  if(hit){b.cid=hit.id;document.getElementById("bcCoQ").value=hit.name;}
  bcSyncCompany();
  bcStatus(bcThumb(n?'<b style="color:var(--ok-t)">'+svg("check")+' Pulled '+n+' detail'+(n>1?"s":"")+' off the card.</b> Give it a quick look'+(hit?" — matched to your account "+esc(hit.name):"")+', then add your note.':"Couldn't find any text on that card — try a closer, sharper shot or type the details."));
  const note=document.getElementById("bcNote");if(note&&n)note.focus();
}
function saveCard(){

  const coTxt=val("bcCoQ"),city=val("bcCity"),st=val("bcState").toUpperCase().slice(0,2),email=val("bcEmail").toLowerCase();
  const phone=val("bcPhone")||val("bcMobile"),mobile=val("bcPhone")?val("bcMobile"):"",title=val("bcTitle");
  const card=b.card||{};
  let c=b.cid?company(b.cid):bcMatchCompany(coTxt),newCo=false;
  if(!c&&coTxt){c={id:uid(),name:coTxt,type:b.kind,city:city,state:st,website:card.website?"https://"+String(card.website).replace(/^https?:\/\//i,""):"",owner:USER,source:"Business card"};
    if(b.kind==="distributor"){c.territory=regionFromState(st);c.dstatus="potential";}
    DB.companies.unshift(c);newCo=true;}
  const addr=[card.street,[city||card.city,[st||String(card.state||"").toUpperCase(),card.zip].filter(Boolean).join(" ")].filter(Boolean).join(", ")].filter(Boolean).join(", ");
  let p=(email&&DB.people.find(x=>(x.email||"").toLowerCase()===email))||DB.people.find(x=>(x.name||"").toLowerCase()===name.toLowerCase()&&(c?x.cid===c.id:!x.cid)),isNew=!p;
  if(isNew){p={id:uid(),name:name,cid:c?c.id:null,branch:c?c.name+(city?" — "+city:""):"",role:title||"Contact",email:email,phone:phone,city:city,state:st,units:0,pos:0,last:null,source:"Business card"};
    if(mobile)p.mobile=mobile;if(card.street&&addr)p.address=addr;DB.people.unshift(p);}
  else{ // already in the CRM — only fill what's blank
    [["role",title],["email",email],["phone",phone],["mobile",mobile],["city",city],["state",st],["address",card.street?addr:""]].forEach(f=>{if(f[1]&&!p[f[0]])p[f[0]]=f[1];});
    if(!p.cid&&c){p.cid=c.id;if(!p.branch)p.branch=c.name+(city?" — "+city:"");}}
  const d=val("bcDate")||todayStr(),when=d===todayStr()?new Date().toISOString():d+"T12:00:00.000Z";
  DB.activities.unshift({id:uid(),type:"meeting",pid:p.id,cid:p.cid||null,note:val("bcNote")||"Met — business card collected",date:when,by:USER});
  if(!p.last||new Date(when)>new Date(p.last))p.last=when;
  save();closeSheet();pushNav();curPerson=p.id;view="person";render();window.scrollTo(0,0);
  toast(name+(isNew?" added":" updated")+(newCo?" · new account "+c.name:""));
  if(b.blob){const path="cards/"+p.id+"_"+Date.now()+(b.pdf?".pdf":".jpg"),pid=p.id;
    storUpload(path,b.blob).then(ok=>{const q=person(pid);if(ok&&q){q.cardPath=path;save();if(view==="person"&&curPerson===pid)render();}
      else if(!ok)toast("Contact saved — the card photo didn't upload (offline?)");}).catch(()=>{});}
  logState.bc=null;
}

/* ---------- EXPORT LISTS (Records > Export) — rule-based call/email list builder ----------
   e.g. Kellan calls all set-up distributors in TX; Grainger reps in MS/AR/SD. */
let expF={mode:"contacts",acctCid:null,acctTxt:"",types:[],dstatus:"",states:"",region:"",needEmail:false,needPhone:false};
function expStatesList(){return expF.states.split(/[,\s]+/).map(x=>x.trim().toUpperCase().slice(0,2)).filter(x=>x.length===2);}
function expRows(){
  const stl=expStatesList();
  if(expF.mode==="accounts"){
    let cs=DB.companies.slice();
    if(expF.acctCid)cs=cs.filter(c=>c.id===expF.acctCid);
    if(expF.types.length)cs=cs.filter(c=>expF.types.includes(c.type));
    if(expF.dstatus)cs=cs.filter(c=>c.type==="distributor"&&distStatus(c)===expF.dstatus);
    if(stl.length)cs=cs.filter(c=>stl.includes(String(c.state||"").toUpperCase()));
    if(expF.region)cs=cs.filter(c=>companyRegion(c)===expF.region);
    cs.sort((a,b)=>a.name.localeCompare(b.name));
    return {headers:["Account","Type","Status","City","State","Region","Units","Orders","Demos"],
      rows:cs.map(c=>[c.name,typeLabel(c.type),c.type==="distributor"?(distStatus(c)==="setup"?"Set-up":"Potential"):(c.stage||""),c.city||"",c.state||"",companyRegion(c)||"",c.units||0,c.orders||0,c.demoCount||0]),
      objs:cs};
  }
  let ps=DB.people.slice();
  if(expF.acctCid)ps=ps.filter(p=>p.cid===expF.acctCid);
  if(expF.types.length)ps=ps.filter(p=>expF.types.includes(contactType(p)||"enduser"));
  if(expF.dstatus)ps=ps.filter(p=>{const c=company(p.cid);return c&&c.type==="distributor"&&distStatus(c)===expF.dstatus;});
  if(stl.length)ps=ps.filter(p=>personStates(p).some(x=>stl.includes(String(x).toUpperCase().slice(0,2))));
  if(expF.region)ps=ps.filter(p=>personRegion(p)===expF.region);
  if(expF.q)ps=ps.filter(p=>((p.name||"")+" "+(p.role||"")+" "+((company(p.cid)||{}).name||p.branch||"")).toLowerCase().includes(expF.q));
  if(expF.needEmail)ps=ps.filter(p=>p.email);
  if(expF.needPhone)ps=ps.filter(p=>p.phone);
  ps.sort((a,b)=>a.name.localeCompare(b.name));
  return {headers:["Name","Role","Company","City","States","Region","Email","Phone","Last contact"],
    rows:ps.map(p=>[p.name,p.role||"",(company(p.cid)||{}).name||p.branch||"",p.city||"",personStates(p).join(" "),personRegion(p)||"",p.email||"",p.phone||"",p.last?String(p.last).slice(0,10):""]),

function parsePoFname(fn){
  const base=fn.replace(/\.pdf$/i,"");
  const m=base.match(/^(.*?)\s+(\d{2})-(\d{2})-(\d{4})\s+(.+)$/);
  if(m)return {account:m[1].trim(),poDate:m[4]+"-"+m[2]+"-"+m[3],poNo:m[5].trim()};
  const m2=base.match(/(?:PO[\s#_-]*)?([A-Z0-9][A-Z0-9-]{4,})$/i);
  return {account:base.replace(/\s*(purchase\s*order|po)\s*[#:]?\s*/i," ").trim(),poDate:todayStr(),poNo:m2?m2[1]:base};
}

async function attachPoFile(id,file){
  const o=(DB.orders||[]).find(x=>x.id===id);if(!o||!file)return;
  toast("Uploading "+file.name+"…");
  const path="pos/"+file.name;
  const ok=await storUpload(path,file);
  if(!ok){toast("Upload failed — try again");return;}
  o.file=path;o.fname=file.name;
  save();render();toast("PDF attached to "+shortAcct(o.account));
}

/* everything is Net 30 (Max, 2026-09-03). Due date comes ONLY from the invoice date —
   never the PO date (Laresa, 2026-09-03: PO ≈ invoice is not a safe assumption). */
function netDue(o){
  if(!o.invoicedAt)return null;
  const d=new Date(String(o.invoicedAt).slice(0,10)+"T12:00:00");if(isNaN(d))return null;
  d.setDate(d.getDate()+30);
  return {label:d.toLocaleDateString(undefined,{month:"short",day:"numeric"}),over:d<new Date()};
}
/* Delete an order (wrong upload, dupe, test PO). Hard delete — the sync engine tombstones it for the
   whole team; the demo-map entry + shipments that were derived from it go too. The PO PDF stays in storage. */
function deleteOrder(id){
  const o=(DB.orders||[]).find(x=>x.id===id);if(!o)return;
  const demos=(DB.demos||[]).filter(d=>d.srcOrder===o.id).length,ships=shipmentsFor(o.id).length;
  const extra=[demos?demos+' Demo Map entr'+(demos>1?'ies':'y'):'',ships?ships+' shipment record'+(ships>1?'s':''):''].filter(Boolean);
  if(!confirm('Delete the '+(shortAcct(o.account)||o.account||"this")+' order'+(o.poNo?' (PO '+o.poNo+')':'')+'?'+
    (extra.length?'\n\n• Also removes: '+extra.join(', '):'')+
    (o.fname?'\n• The PO PDF stays in the file library':'')+
    '\n\nThis syncs to the whole team and cannot be undone.'))return;
  DB.demos=(DB.demos||[]).filter(d=>d.srcOrder!==o.id);
  DB.shipments=(DB.shipments||[]).filter(s=>s.orderId!==o.id);
  DB.orders=(DB.orders||[]).filter(x=>x.id!==o.id);
  save();closeSheet();render();toast("Order deleted");
}

/* ---------- SHIPPING (Kellan, 2026-09-08) — one record per box that goes out the door; feeds Invoicing ----------
   Rules: distributors cover freight → a billable shipment cost becomes the Freight line on the order
   (loaners: the cost lands in o.upsCost → Demo Map). Ship-to is remembered per account (c.shipTo). */
function shipAccess(){return false;} /* Shipping tab retired 2026-10-16 — orders still carry shipments if any were recorded */
const SHIP_STATUS={packed:["Packed — not picked up","#3b6fb5","rgba(60,110,180,.12)"],shipped:["In transit","var(--warn-t,#a15c00)","rgba(255,180,0,.14)"],delivered:["Delivered","var(--ok-t)","rgba(0,160,90,.12)"]};

const CARRIERS=["UPS","FedEx","USPS","LTL freight","Pickup"];
const SERVICES={UPS:["Ground","3 Day Select","2nd Day Air","Next Day Air"],FedEx:["Ground","Home Delivery","2Day","Priority Overnight"],USPS:["Ground Advantage","Priority Mail","Priority Express"],"LTL freight":["Standard LTL"],Pickup:["Customer pickup"]};
function trackUrl(car,tn){tn=String(tn||"").replace(/\s+/g,"");if(!tn)return "";
  if(/^1Z/i.test(tn)||car==="UPS")return "https://www.ups.com/track?loc=en_US&tracknum="+encodeURIComponent(tn);
  if(car==="FedEx")return "https://www.fedex.com/fedextrack/?trknbr="+encodeURIComponent(tn);
  if(car==="USPS")return "https://tools.usps.com/go/TrackConfirmAction?tLabels="+encodeURIComponent(tn);
  return "";}
function trackLink(s){if(!s||!s.tracking)return "";const u=trackUrl(s.carrier,s.tracking);
  return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener" data-stop="1" style="color:var(--coral,#e8543f);font-weight:600">'+esc(s.tracking)+' ↗</a>':'<b>'+esc(s.tracking)+'</b>';}
function shipmentsAll(){return (DB.shipments||[]).slice().sort((a,b)=>String(b.shipDate||b.addedAt||"").localeCompare(String(a.shipDate||a.addedAt||"")));}
function shipmentsFor(oid){return oid?(DB.shipments||[]).filter(s=>s.orderId===oid):[];}
function orderById(id){return (DB.orders||[]).find(x=>x.id===id)||null;}
function acctForOrder(o){const k=shortAcct((o&&o.account)||"").toLowerCase();if(!k)return null;
  return DB.companies.find(x=>x.name&&shortAcct(x.name).toLowerCase()===k)||DB.companies.find(x=>x.name&&k.includes(shortAcct(x.name).toLowerCase()))||null;}
function shipItems(o){return orderItems(o).filter(x=>!/freight/i.test(String(x.sku||"")));}
function shipItemsSummary(items){return (items||[]).filter(x=>+x.qty>0).map(x=>(+x.qty||0)+"× "+(SKU_SHORT[x.sku]||x.sku)).join(" + ");}
/* what's still in the warehouse for an order, per SKU */
function orderShipState(o){
  const ss=shipmentsFor(o.id),want=shipItems(o),sent={};
  ss.forEach(s=>(s.items||[]).forEach(it=>{sent[it.sku]=(sent[it.sku]||0)+(+it.qty||0);}));
  const remaining=want.map(it=>({sku:it.sku,qty:Math.max(0,(+it.qty||0)-(sent[it.sku]||0))})).filter(x=>x.qty>0);
  const covered=want.length?!remaining.length:!!ss.length;
  const status=!ss.length?"none":!covered?"partial":ss.every(s=>s.status==="delivered")?"delivered":ss.some(s=>s.status!=="packed")?"shipped":"packed";
  return {shipments:ss,remaining:remaining,covered:covered,status:status};
}
/* invoiced ≠ shipped: since 9/1 Laresa invoices same-day, so recent invoiced/paid orders
   stay in the ship queue until a shipment covers them (history before that is assumed shipped) */
function orderNeedsShip(o){return !o.noShip&&o.status!=="supplier"&&(o.status==="queue"||(o.status==="loaner"&&!o.upsCost)||((o.status==="invoiced"||o.status==="paid")&&String(o.poDate||"")>="2026-09-01"));}
/* orders that still have to go out. Older invoiced/paid orders with no shipment record are assumed shipped
   (the feature is new) — only the queue, un-costed loaners and partially shipped orders show up. */
function ordersToShip(){
  return ordersAll().filter(o=>{
    if(o.noShip||o.status==="supplier")return false;
    if(!orderNeedsShip(o)&&!shipmentsFor(o.id).length)return false;
    return !orderShipState(o).covered;
  }).sort((a,b)=>String(a.poDate||"").localeCompare(String(b.poDate||"")));
}
function shipToFor(o){
  const c=acctForOrder(o);
  const last=shipmentsAll().find(s=>s.shipTo&&s.account&&o.account&&shortAcct(s.account).toLowerCase()===shortAcct(o.account).toLowerCase());
  if(last)return Object.assign({},last.shipTo);
  if(c&&c.shipTo)return Object.assign({},c.shipTo);
  return {name:o.account||"",attn:o.contactName||"",street:"",city:(c&&c.city)||"",state:(c&&c.state)||"",zip:"",phone:""};
}
function shipToLines(t){if(!t)return [];return [t.name,t.attn?"Attn: "+t.attn:"",t.street,[t.city,t.state].filter(Boolean).join(", ")+(t.zip?" "+t.zip:""),t.phone].map(x=>String(x||"").trim()).filter(Boolean);}
function lastShipmentFor(o){return shipmentsFor(o.id).slice().sort((a,b)=>String(b.shipDate||"").localeCompare(String(a.shipDate||"")))[0]||null;}
function daysSince(d){if(!d)return 0;const a=new Date(String(d).slice(0,10)+"T12:00:00");return isNaN(a)?0:Math.max(0,Math.round((Date.now()-a)/864e5));}
/* freight feeds the order: billable shipment cost → Freight line (non-loaner) or o.upsCost (loaner) */
function syncFreightToOrder(oid){
  const o=orderById(oid);if(!o)return;
  const ss=shipmentsFor(oid);
  const all=ss.reduce((t,s)=>t+(+s.cost||0),0),bill=ss.filter(s=>s.billFreight).reduce((t,s)=>t+(+s.cost||0),0);
  if(isLoanerOrder(o)||o.status==="loaner"){
    if(all>0){o.upsCost=Math.round(all*100)/100;const d=(DB.demos||[]).find(x=>x.srcOrder===o.id);if(d)d.note="Loaner order "+(o.poNo||"")+" · UPS "+fmtC(o.upsCost);}
    return;}
  const items=orderItems(o).slice();
  const i=items.findIndex(it=>/freight/i.test(String(it.sku||"")));
  if(bill>0){const line={sku:"Freight",qty:1,unit:Math.round(bill*100)/100,fromShip:true};
    if(i>-1){if(items[i].fromShip||!(+items[i].unit>0.05))items[i]=line;}else items.push(line);}
  else if(i>-1&&items[i].fromShip)items.splice(i,1);
  o.items=items;
  if(items.length)o.amount=Math.round(itemsTotal(items)*100)/100;
}

function saveShipment(id){
  const s=id?(DB.shipments||[]).find(x=>x.id===id):null;
  const o=orderById(s?s.orderId:logState.shipOrderId);
  if(!s&&!o){toast("Pick the order first");return;}
  collectShipItems();
  const items=(logState.shipItems||[]).filter(it=>it.sku&&it.sku.trim()&&+it.qty>0).map(it=>({sku:it.sku.trim(),qty:+it.qty}));
  const rec=s||{id:uid(),addedBy:USER,addedAt:new Date().toISOString()};
  if(o){rec.orderId=o.id;rec.account=o.account;rec.poNo=o.poNo;}
  rec.shipTo={name:val("shName"),attn:val("shAttn"),street:val("shStreet"),city:val("shCity"),state:val("shState").toUpperCase(),zip:val("shZip"),phone:val("shPhone")};
  rec.items=items;rec.carrier=logState.shipCarrier||"UPS";rec.service=val("shService");rec.shipDate=val("shDate")||todayStr();
  rec.tracking=val("shTrack").replace(/\s+/g,"");rec.boxes=parseInt(val("shBoxes"),10)||0;rec.weight=parseFloat(val("shWeight"))||0;
  rec.cost=parseFloat(val("shCost").replace(/[$,]/g,""))||0;
  const cb=document.getElementById("shBill");rec.billFreight=cb?cb.checked:true;
  rec.status=logState.shipStatus||"shipped";if(rec.status==="delivered"&&!rec.deliveredAt)rec.deliveredAt=todayStr();
  rec.notes=val("shNotes");rec.updatedAt=new Date().toISOString();rec.updatedBy=USER;
  if(!s){DB.shipments=DB.shipments||[];DB.shipments.push(rec);}
  const c=o?acctForOrder(o):null;
  if(c&&rec.shipTo.street)c.shipTo=Object.assign({},rec.shipTo);
  if(o){o.noShip=false;syncFreightToOrder(o.id);
    if(!s&&c)DB.activities.unshift({id:uid(),type:"note",pid:null,cid:c.id,note:"Shipped PO "+(o.poNo||"")+(items.length?" — "+shipItemsSummary(items):"")+" via "+rec.carrier+(rec.tracking?" · "+rec.tracking:""),date:new Date().toISOString(),by:USER});}
  const loaner=!!(o&&(o.status==="loaner"||isLoanerOrder(o)));
  save();closeSheet();render();
  toast(s?"Shipment saved":"Shipped — "+shortAcct(rec.account)+(rec.cost?(loaner?" · UPS cost on the Demo Map":rec.billFreight?" · freight added to the order":""):""));
}

function quoteCollect(){
  const S=logState.qt;if(!S)return;
  const g=id=>{const el=document.getElementById(id);return el?el.value:null;};
  [["qtAcct","acct"],["qtCon","con"],["qtEmail","email"],["qtShip","shipTo"],["qtShipAmt","shipping"],["qtNotes","notes"],["qtDist","dist"],["qtDistRep","distRep"]].forEach(m=>{const v=g(m[0]);if(v!==null)S[m[1]]=v;});
  S.items.forEach((it,i)=>{
    const nm=g("qt_name_"+i);if(nm!==null)it.name=nm;
    const qv=g("qt_qty_"+i);if(qv!==null)it.qty=parseFloat(qv)||0;
    const uv=g("qt_unit_"+i);if(uv!==null)it.unit=uv.trim()===""?"":(parseFloat(uv.replace(/[$,]/g,""))||0);
  });
}
/* typing in a line: the totals follow without redrawing (focus stays put); a new kit quantity re-prices its tier */
function quoteItemInput(el){
  const S=logState.qt,m=String(el.id).match(/^qt_(qty|unit|name)_(\d+)$/);if(!S||!m)return;
  const i=+m[2],it=S.items[i];if(!it)return;
  if(m[1]==="name"){it.name=el.value;return;}
  if(m[1]==="unit"){it.unit=parseFloat(String(el.value).replace(/[$,]/g,""))||0;it.auto=false;}
  else{it.qty=parseFloat(el.value)||0;
    if(it.auto){const p=quotePrice(it.sku,it.qty,S.level);
      if(p!=null&&p!==it.unit){it.unit=p;const u=document.getElementById("qt_unit_"+i);if(u)u.value=p.toFixed(2);}}}
  const sub=document.getElementById("qt_sub_"+i);if(sub)sub.textContent=quoteItemSub(it,S.level);
  const t=document.getElementById("qt_tot_"+i);if(t)t.textContent=fmtC(qLine(it));

function saveQuote(mode){
  const S=logState.qt;if(!S)return;quoteCollect();
  const acct=String(S.acct||"").trim(),email=String(S.email||"").trim();
  if(!acct){toast("Who is the quote for? Add the company");return;}
  const items=S.items.filter(it=>(it.sku||String(it.name||"").trim())&&+it.qty>0)
   .map(it=>({sku:it.sku||"",name:it.sku?"":String(it.name||"").trim(),qty:+it.qty,unit:Math.round((+it.unit||0)*100)/100,auto:!!it.auto}));
  if(!items.length){toast("Add at least one line item");return;}
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast("That email doesn't look right");return;}
  DB.quotes=DB.quotes||[];
  let q=S.id?quoteById(S.id):null;const fresh=!q;
  if(!q){q={id:uid(),no:nextQuoteNo(),date:todayStr(),status:"draft",by:USER,createdAt:new Date().toISOString()};DB.quotes.push(q);}
  if(!S.cid){const c=DB.companies.find(x=>x.name&&x.name.toLowerCase()===acct.toLowerCase());if(c)S.cid=c.id;}
  const sh=String(S.shipping||"").replace(/[$,\s]/g,"");
  q.account=acct;q.cid=S.cid||null;q.contactName=String(S.con||"").trim();q.contactEmail=email;q.pid=S.pid||null;
  q.level=S.level;q.validDays=S.validDays;q.items=items;q.shipTo=String(S.shipTo||"").trim();q.notes=String(S.notes||"").trim();
  q.shipping=sh===""?null:(parseFloat(sh)||0);q.total=quoteTotal(q);q.updatedAt=new Date().toISOString();
  const dn=S.level==="dist"?"":String(S.dist||"").trim(); // a distributor's own quote has nobody to buy it through
  if(dn&&!S.distCid){const d=DB.companies.find(x=>x.type==="distributor"&&x.name&&x.name.toLowerCase()===dn.toLowerCase());if(d)S.distCid=d.id;}
  const dr=dn&&S.distCid&&S.distPid?person(S.distPid):null;
  q.distName=dn;q.distCid=dn?(S.distCid||null):null;q.distPid=dr?dr.id:null;
  q.distRep=dn?(dr?dr.name:String(S.distRep||"").trim()):"";q.distRepEmail=dr?(dr.email||""):"";q.distRepPhone=dr?(dr.phone||dr.mobile||""):"";
  const cu=company(q.cid); // remember the routing on the customer's account page ("Who they buy from")
  if(dn&&cu&&cu.type==="enduser"&&!bfList(cu).some(e=>(q.distCid&&e.cid===q.distCid)||String(e.name||"").toLowerCase()===dn.toLowerCase())){
    cu.buysFrom=bfList(cu);cu.buysFrom.push({cid:q.distCid||null,name:dn,first:!cu.buysFrom.length});}
  S.id=q.id;save();render();
  if(mode==="send"){formQuoteSend(q.id);return;}
  if(mode==="preview")quotePrint(q.id);
  quoteSheet(q.id);toast("Quote "+q.no+(fresh?" saved":" updated"));
}

function quotePrint(id,print){
  const q=quoteById(id);if(!q)return;

}

/* send-invoice builds and emails an INVOICE for any request it doesn't recognise, so a deployment from before the
   notify branch would mail the customer a blank one. Ask first, with a request that cannot send anything: the
   recipient is on a reserved domain that never resolves, the html is empty (the notify branch answers "html required"
   before it touches mail) and the line item is one an old deployment fails on while drawing its PDF. */
let NOTIFY_READY=null;
async function notifyReady(){ // resolves when it is safe to send; throws with the reason when it is not
  if(NOTIFY_READY===false)throw new Error("the mail function needs a redeploy");
  if(NOTIFY_READY)return true;
  const r=await fetch(SUPA_URL+"/functions/v1/send-invoice",{method:"POST",
    headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SESSION.access_token,"Content-Type":"application/json"},
    body:JSON.stringify({action:"notify",to:"probe@example.invalid",html:"",invoice:{invNo:"🔒",items:[null]}})});
  const b=await r.json().catch(()=>({}));
  if(r.status===400&&String(b.error||"")==="html required"){NOTIFY_READY=true;return true;}
  if(r.status===500){NOTIFY_READY=false;throw new Error("the mail function needs a redeploy");} // an old deployment, choking on the probe's invoice
  throw new Error(b.error||b.message||("HTTP "+r.status)); // signed out, not on the allowlist, offline… — not remembered, so the next try asks again
}

/* UPS Billing Center import (the cleaned CSV from UPS Shipping Data/build_ups_db.py, or any CSV with
   tracking_number + total_charge columns): matches by tracking # and writes the real billed cost. */
function importUpsCsv(text){
  const rows=parseCSV(text);if(!rows.length){toast("Empty file");return;}
  const hdr=rows[0].map(h=>String(h||"").replace(/^\ufeff/,"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"_"));
  const col=(...names)=>{for(const n of names){const i=hdr.indexOf(n);if(i>-1)return i;}return -1;};
  const iT=col("tracking_number","tracking","tracking_no"),iC=col("total_charge","net_amount","total","amount"),iW=col("billed_weight_lbs","billed_weight"),iI=col("invoice_number","invoice"),iS=col("service");
  if(iT<0||iC<0){toast("Need tracking_number + total_charge columns");return;}
  const byTrack={};rows.slice(1).forEach(r=>{const t=String(r[iT]||"").replace(/\s+/g,"").toUpperCase();if(!t)return;
    const b=byTrack[t]||(byTrack[t]={cost:0,w:0,inv:"",svc:""});b.cost+=parseFloat(String(r[iC]||"").replace(/[$,]/g,""))||0;
    if(iW>-1&&!b.w)b.w=parseFloat(r[iW])||0;if(iI>-1&&!b.inv)b.inv=String(r[iI]||"").trim();if(iS>-1&&!b.svc)b.svc=String(r[iS]||"").trim();});
  let hit=0,changed=0;const touched={};
  (DB.shipments||[]).forEach(sh=>{const t=String(sh.tracking||"").replace(/\s+/g,"").toUpperCase();const b=t&&byTrack[t];if(!b)return;hit++;
    const cost=Math.round(b.cost*100)/100;
    if(cost&&Math.abs((+sh.cost||0)-cost)>0.004){sh.cost=cost;changed++;}
    if(b.w&&!sh.weight)sh.weight=b.w;if(b.inv)sh.upsInvoice=b.inv;sh.upsBilled=true;sh.updatedAt=new Date().toISOString();sh.updatedBy=USER;
    touched[sh.orderId]=1;});
  Object.keys(touched).forEach(oid=>syncFreightToOrder(oid));
  const unmatched=Object.keys(byTrack).length-hit;
  save();render();
  toast(hit?hit+" shipment"+(hit>1?"s":"")+" matched · "+changed+" cost"+(changed===1?"":"s")+" updated"+(unmatched?" · "+unmatched+" tracking #s not in the CRM":""):"No tracking numbers in that file match a shipment here");
}

function collectInvItems(){
  (logState.invItems||[]).forEach((it,i)=>{

}

function saveOrder(id){
  const o=id?(DB.orders||[]).find(x=>x.id===id):null;
  const rec=o||{id:uid(),addedBy:USER,addedAt:new Date().toISOString(),file:null,fname:null};
  rec.account=val("ivAcct");rec.contactName=val("ivContact");rec.contactEmail=val("ivEmail");rec.poNo=val("ivPo");rec.poDate=val("ivDate");rec.invoicedAt=val("ivInvDate")||rec.invoicedAt||null;
  collectInvItems();
  const items=(logState.invItems||[]).filter(it=>(it.sku&&it.sku.trim())||(+it.qty&&+it.unit));
  rec.items=items;
  rec.amount=items.length?Math.round(itemsTotal(items)*100)/100:(parseFloat(String(val("ivAmt")).replace(/[$,]/g,""))||0);
  rec.status=logState.invStatus||"queue";rec.qbInv=val("ivQb");rec.billEmail=val("ivBill");rec.notes=val("ivNotes");
  if(!o){DB.orders=DB.orders||[];DB.orders.push(rec);}
  save();closeSheet();render();toast("Order saved");
}
async function invUploadFiles(files){
  DB.orders=DB.orders||[];
  const prog=()=>document.getElementById("invProg");
  let done=0,fail=0;
  for(const f of files){
    if(prog())prog().textContent="Uploading "+(done+fail+1)+" / "+files.length+"…";
    const meta=parsePoFname(f.name),seedM=poSeedFor(meta.poNo);
    const path="pos/"+f.name;
    const ok=await storUpload(path,f);
    if(!ok){fail++;continue;}
    const dup=DB.orders.find(x=>x.fname===f.name||(x.poNo&&meta.poNo&&x.poNo.toUpperCase()===meta.poNo.toUpperCase()));
    const rec=dup||{id:uid(),addedBy:USER,addedAt:new Date().toISOString()};
    rec.file=path;rec.fname=f.name;
    if(!dup||!dup.account)rec.account=(seedM&&seedM.account)||meta.account;
    if(!dup||!dup.poNo)rec.poNo=meta.poNo;
    if(!dup||!dup.poDate)rec.poDate=meta.poDate;
    if(seedM){if(!rec.amount)rec.amount=seedM.amount;if(!rec.qbInv)rec.qbInv=seedM.qbInv;if(!rec.status||rec.status==="queue")rec.status=seedM.status;if(!rec.notes)rec.notes=seedM.notes;}
    else if(!rec.status)rec.status="queue";
    if(!dup)DB.orders.push(rec);
    done++;save();
  }
  render();
  toast(done+" uploaded"+(fail?" · "+fail+" failed (check connection)":""));
}
async function invOpenFile(id,download){
  const o=(DB.orders||[]).find(x=>x.id===id);if(!o||!o.file)return;
  toast(download?"Downloading…":"Opening…");
  const b=await storBlob(o.file);
  if(!b){toast("Couldn't fetch the PDF — are you online?");return;}
  const url=URL.createObjectURL(b);
  if(download){const a=document.createElement("a");a.href=url;a.download=o.fname||"PO.pdf";document.body.appendChild(a);a.click();a.remove();}
  else{window.open(url,"_blank");}
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
/* tiny RFC-4180 CSV parser (quoted fields, embedded commas/newlines) */
function parseCSV(text){
  const rows=[];let row=[],cur="",inQ=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=ch;}
    else if(ch==='"')inQ=true;
    else if(ch===","){row.push(cur);cur="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(c=>c!==""))rows.push(row);row=[];}
    else cur+=ch;}
  if(cur!==""||row.length){row.push(cur);if(row.some(c=>c!==""))rows.push(row);}
  return rows;
}
/* expects header: account,poNo,poDate,amount,status,qbInv,notes — dedupes on PO # (or account+date+amount when no PO) */
function invImportCsv(text){
  const rows=parseCSV(text);if(rows.length<2){toast("That CSV looks empty");return;}
  const hd=rows[0].map(s=>s.trim().toLowerCase()),ix=k=>hd.indexOf(k.toLowerCase());
  const iA=ix("account"),iP=ix("poNo"),iD=ix("poDate"),iM=ix("amount"),iS=ix("status"),iQ=ix("qbInv"),iN=ix("notes");
  if(iA<0||iP<0){toast("Need at least account + poNo columns");return;}
  DB.orders=DB.orders||[];
  let added=0,merged=0;
  rows.slice(1).forEach(r=>{
    const po=(r[iP]||"").trim(),acct=(r[iA]||"").trim();
    if(!acct&&!po)return;
    const key=po?po.toUpperCase():null;
    const dup=DB.orders.find(x=>key&&x.poNo&&x.poNo.toUpperCase()===key)||
              (!key&&DB.orders.find(x=>x.account===acct&&x.poDate===(r[iD]||"").trim()&&+x.amount===+(r[iM]||0)));
    if(dup){ // enrich, never overwrite what's already set
      if(!dup.qbInv&&iQ>-1&&r[iQ])dup.qbInv=r[iQ].trim();
      if(!dup.amount&&iM>-1)dup.amount=parseFloat(String(r[iM]).replace(/[$,]/g,""))||dup.amount;
      if(!dup.notes&&iN>-1)dup.notes=(r[iN]||"").trim();
      merged++;return;}
    DB.orders.push({id:uid(),addedBy:USER,addedAt:new Date().toISOString(),file:null,fname:null,
      account:acct,poNo:po,poDate:(iD>-1?(r[iD]||"").trim():"")||todayStr(),
      amount:parseFloat(String(iM>-1?r[iM]:"0").replace(/[$,]/g,""))||0,
      status:(iS>-1&&INV_STATUS[(r[iS]||"").trim()])?(r[iS]||"").trim():"queue",
      qbInv:iQ>-1?(r[iQ]||"").trim():"",notes:iN>-1?(r[iN]||"").trim():""});
    added++;
  });
  save();render();toast(added+" orders imported"+(merged?" · "+merged+" merged into existing":""));
}

  if(e.target.id==="oDistQ"){logState.oppDistCid=null;sugRender("oDistQ",acctSugItems(e.target.value,"pickOppDist",["distributor"]));return;}
  if(e.target.id==="oDistRepQ"){logState.oppDistRepPid=null;sugRender("oDistRepQ",peopleSugItemsF(e.target.value,"pickOppDistRep",logState.oppDistCid?(p=>p.cid===logState.oppDistCid):(p=>contactType(p)==="distrep")));return;}
  if(e.target.id==="oManrepQ"){logState.oppManrepPid=null;sugRender("oManrepQ",peopleSugItemsF(e.target.value,"pickOppManrep",p=>contactType(p)==="manrep"));return;}
  if(/^qt_(qty|unit|name)_\d+$/.test(e.target.id||"")){quoteItemInput(e.target);return;}
  if(e.target.id==="qtAcct"){if(logState.qt&&logState.qt.cid){logState.qt.cid=null;quoteRedrawConChips();}sugRender("qtAcct",acctSugItems(e.target.value,"pickQtAcct"));return;}
  if(e.target.id==="qtCon"){const S=logState.qt;if(S)S.pid=null;document.querySelectorAll("#qtConChips .qchip").forEach(x=>x.classList.remove("on"));sugRender("qtCon",peopleSugItemsF(e.target.value,"pickQtCon",S&&S.cid?(p=>p.cid===S.cid):(p=>true)));return;}
  if(e.target.id==="qtDist"){const S=logState.qt;if(S){S.dist=e.target.value;if(S.distCid){S.distCid=null;S.distPid=null;S.distRep="";quoteRedrawDistRep();}}sugRender("qtDist",acctSugItems(e.target.value,"pickQtDist",["distributor"]));return;}
  if(e.target.id==="qtDistRep"){const S=logState.qt;if(S){S.distPid=null;S.distRep=e.target.value;document.querySelectorAll("#qtDistRepWrap .qchip").forEach(x=>x.classList.remove("on"));}
    sugRender("qtDistRep",peopleSugItemsF(e.target.value,"pickQtDistRep",p=>!!S&&p.cid===S.distCid));return;}
  if(e.target.id==="qsTo"){sugRender("qsTo",/@/.test(e.target.value)?[]:peopleSugItemsF(e.target.value,"pickQsTo",p=>!!p.email));return;}
  if(e.target.id==="ivAcct"){sugRender("ivAcct",acctSugItems(e.target.value,"pickIvAcct"));return;}
  if(e.target.id==="shOrderQ"){sugRender("shOrderQ",orderSugItems(e.target.value,"pickShOrder"));return;}
  if(e.target.id==="ocTo"){sugRender("ocTo",/@/.test(e.target.value)?[]:peopleSugItemsF(e.target.value,"pickOcTo",p=>!!p.email));return;}
  if(e.target.id==="snTo"){sugRender("snTo",/@/.test(e.target.value)?[]:peopleSugItemsF(e.target.value,"pickSnTo",p=>!!p.email));return;}
  if(e.target.id==="bfSearch"){sugRender("bfSearch",acctSugItems(e.target.value,"pickBf",["distributor"]));return;}
  if(e.target.id==="nlBuyQ"){logState.nlBuyCid=null;sugRender("nlBuyQ",acctSugItems(e.target.value,"pickNlBuy",["distributor"]));return;}
  if(e.target.id==="elBuyQ"){logState.elBuyCid=null;sugRender("elBuyQ",acctSugItems(e.target.value,"pickElBuy",["distributor"]));return;}
  if(/^lnote_/.test(e.target.id||"")){const parts=e.target.id.split("_");const l=(DB.lists||[]).find(x=>x.id===parts[1]);const it=l&&l.items[+parts[2]];
    if(it){it.note=e.target.value;it.noteAt=new Date().toISOString();clearTimeout(window.__lnT);window.__lnT=setTimeout(save,800);}return;}
  if(e.target.id==="listSt"){logState.listSt=e.target.value;return;}
  if(e.target.id==="listQ"){logState.listQ=e.target.value;return;}
  if(/^lphone_/.test(e.target.id||"")){const parts=e.target.id.split("_");const l=(DB.lists||[]).find(x=>x.id===parts[1]);const it=l&&l.items[+parts[2]];
    if(it){it.phone=e.target.value.trim();it.phoneAt=new Date().toISOString();
      const pr=it.pid?person(it.pid):null;if(pr&&!pr.phone&&it.phone)pr.phone=it.phone;
      clearTimeout(window.__lnT);window.__lnT=setTimeout(save,800);}return;}
  if(e.target.id==="oConQ"){logState.oppConPid=null;sugRender("oConQ",peopleSugItems(e.target.value,"pickOppCon"));return;}
  if(e.target.id==="campName"){const c=campaignById(curCampaign);if(c){c.name=e.target.value;save();}return;}
  if(e.target.dataset&&e.target.dataset.cfield){const c=campaignById(curCampaign);
    if(c&&c.steps[+e.target.dataset.ci]){const f=e.target.dataset.cfield;
      if(f==="day")c.steps[+e.target.dataset.ci].day=Math.max(1,parseInt(e.target.value,10)||1);
      else c.steps[+e.target.dataset.ci][f]=e.target.value;
      save();}
    return;}
  if(e.target.id==="contactState"){contactStateF=e.target.value;render();}
});
/* type-ahead lists used to stay open after you moved on, covering the labels and fields below (Max's New-quote
   screenshot, 2026-10-13). A list now closes when its field loses focus; pressing on a suggestion keeps the focus
   where it is, so the pick still lands. */
document.addEventListener("mousedown",e=>{if(e.target.closest&&e.target.closest(".sug"))e.preventDefault();});
document.addEventListener("focusout",e=>{
  const el=e.target,box=el&&el.closest?(el.closest(".sug")||(el.id?document.getElementById(el.id+"_sug"):null)):null;
  if(!box||!/_sug$/.test(box.id))return;const fid=box.id.slice(0,-4);
  setTimeout(()=>{const a=document.activeElement;if(a&&(a.id===fid||box.contains(a)))return;sugRender(fid,[]);},160); // tabbing into the list keeps it open
});
function refocus(idv){const el=document.getElementById(idv);if(el){const v=el.value;el.focus();try{el.setSelectionRange(v.length,v.length);}catch(_){}}}

/* Excel-style column resize: drag a header's right edge; double-click the edge to reset the table */
document.addEventListener("mousedown",e=>{
  const rz=e.target.closest&&e.target.closest("table.lv th .rz");if(!rz)return;
  e.preventDefault();e.stopPropagation();
  const th=rz.parentElement,tr=th.parentElement,table=th.closest("table"),tbl=table.dataset.tbl;
  const ths=[...tr.children];
  const widths=ths.map(x=>x.getBoundingClientRect().width);
  table.classList.add("fixedcols");
  ths.forEach((x,i)=>x.style.width=widths[i]+"px");
  const idx=ths.indexOf(th),startX=e.clientX,w0=widths[idx];
  rz.classList.add("on");
  function mv(ev){th.style.width=Math.max(52,w0+(ev.clientX-startX))+"px";}
  function up(){document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);rz.classList.remove("on");
    if(tbl){COLW[tbl]=[...tr.children].map(x=>x.getBoundingClientRect().width);localStorage.setItem("autotq_colw_v1",JSON.stringify(COLW));}
    topScrollSync();}
  document.addEventListener("mousemove",mv);
  document.addEventListener("mouseup",up);
});
/* campaign dropzone drag & drop */
document.addEventListener("dragover",e=>{const dz=e.target.closest&&e.target.closest(".dropzone");if(dz){e.preventDefault();dz.classList.add("drag");}});
document.addEventListener("dragleave",e=>{const dz=e.target.closest&&e.target.closest(".dropzone");if(dz)dz.classList.remove("drag");});
document.addEventListener("drop",e=>{const dz=e.target.closest&&e.target.closest(".dropzone");if(!dz)return;e.preventDefault();dz.classList.remove("drag");campHandleFile(e.dataTransfer.files&&e.dataTransfer.files[0]);});
document.addEventListener("dblclick",e=>{
  const rz=e.target.closest&&e.target.closest("table.lv th .rz");if(!rz)return;
  const table=rz.closest("table"),tbl=table.dataset.tbl;
  if(tbl){delete COLW[tbl];localStorage.setItem("autotq_colw_v1",JSON.stringify(COLW));}
  table.classList.remove("fixedcols");table.querySelectorAll("thead th").forEach(x=>x.style.width="");
});

load();applyRosterCorrections();applyManrepPersonCoverage();applyPersonAddresses();
// Arriving via a Supabase magic link: tokens land in the URL hash — capture them,
// then route through the set-password screen like a code sign-in.
let HASHLOGIN=false;
if(location.hash&&location.hash.indexOf("access_token=")>-1){
  const hp=new URLSearchParams(location.hash.slice(1));
  if(hp.get("access_token")){
    saveSession({access_token:hp.get("access_token"),refresh_token:hp.get("refresh_token")});
    history.replaceState(null,"",location.pathname+location.search);
    logState.setPw=true;HASHLOGIN=true;
  }
}
USER=authed()?(TEAM_EMAILS[((SESSION.user&&SESSION.user.email)||"").toLowerCase()]||localStorage.getItem(UKEY)||""):null;
if(USER&&authed())applyRoleDefaults();
render();
if(HASHLOGIN)fetch(SUPA_URL+"/auth/v1/user",{headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SESSION.access_token}})
  .then(r=>r.json()).then(u=>{
    const mapped=TEAM_EMAILS[(u.email||"").toLowerCase()]||"";
    if(mapped){USER=mapped;localStorage.setItem(UKEY,USER);SESSION.user=u;saveSession(SESSION);renderLogin();}
  }).catch(()=>{});
if(authed())bootSync();
</script>
