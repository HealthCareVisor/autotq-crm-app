,"PH","Year-end 'use it or lose it' budget calls","sales",0,"5 starter orders","Call warm EHS / campus accounts with leftover 2026 budget: starter order now, the rest in the new budget year.","Dec 1-18"],["2026-12-01","2026-12-01",0,"ML","Named-account mailer (10 of the 30 target accounts)","max,sales",0,"10 sent, 3 meetings","Lumpy mail to 10 named accounts this month: one-pager 'put AutoTQ next to your AED' + handwritten note + QR to the giveaway. Rotate so all 30 get one per quarter.","Tue Dec 1"],["2026-12-01","2026-12-31",2,"VI","Monthly content requirement","elvi,carisse",0,"2 long + 10 reels posted","2 long-form videos (4-10 min) + 10 reels cut from them. Every reel ends with the giveaway CTA.","All month"],["2026-12-01","2026-12-31",2,"VI","Christmas Event Recap (film Mon Dec 7)","elvi",0,"","Per AutoTQ Film and Edit Schedule (Video Plan tab).","Film day per Elvi's plan"],["2026-12-01","2026-12-31",2,"VI","Meet the Team: Quick Q&A (film Mon Dec 7)","elvi",0,"","Per AutoTQ Film and Edit Schedule (Video Plan tab).","Film day per Elvi's plan"],["2026-12-01","2026-12-31",2,"VI","NEW: Giveaway promo reels - Hannah on camera, 1 general + 12 'Month Giveaway' intros (film Mon Dec 7)","elvi",0,"","Per AutoTQ Film and Edit Schedule (Video Plan tab).","Film day per Elvi's plan"],["2026-12-03","2026-12-03",0,"WS","AutoTQ Used on a Pediatric Patient: approvals before anything goes out","hannah",0,"All approvals in writing","Facts from the Oct 16 field-use report: a 12-year-old with a knife wound at a Boca Raton school; the school's public-access AutoTQ was applied once by an AutoTQ-certified person, the bleed stopped, and he was taken to the hospital. Before publishing: (1) written OK from the parent/guardian and the school; no name, photo or school name unless they agree; (2) confirm the facts with the person who applied it; (3) say\u2026","By Thu Dec 3"],["2026-12-04","2026-12-04",0,"WB","Set up the Tourniquet Tuesday webinar series","max,carisse",0,"Platform + reg page live","Pick the platform (Zoom or Teams webinar), one registration page per session that feeds the CRM (name, email, phone, org, role, # of AEDs/vehicles, consent), a slide template, a recording workflow (replay page + 3 reels per session), and send reps the full 2027 calendar.","By Fri Dec 4"],["2026-12-04","2026-12-04",0,"WS","AutoTQ Used on a Pediatric Patient: story page","max,carisse",0,"Page live","One page: what happened, the applier's quote (It worked incredibly well), why public-access AutoTQs belong in schools next to the AED, a Is your school ready? 15-min call button, and the January Giveaway link. Every email, post and mailer QR code points here.","By Fri Dec 4"],["2026-12-07","2026-12-07",0,"ML","AutoTQ Used on a Pediatric Patient: mailer to schools","sales,hannah",0,"Mailed to every school contact; 5 meetings","Postcard or 1-page letter titled AutoTQ Used on a Pediatric Patient to schools, districts, campus police (IACLEA list), school nurses (NASN contacts) and the 30 named accounts. QR to the story page. Handwritten note from Hannah on the top 30. Mail by Dec 7 so it lands before winter break.","Mail by Mon Dec 7"],["2026-12-07","2026-12-07",0,"VI","FILM: giveaway promo reels with Hannah","elvi,hannah",0,"13 reels in the can","One general reel ('we're giving away a free AutoTQ kit every month of 2027 - fill out this form and tag us') + 12 short 'January Giveaway', 'February Giveaway'... intros so each month has its own labeled reel. Same setup as the Christmas/Meet the Team shoot.","Mon Dec 7"],["2026-12-07","2026-12-07",0,"VI","AutoTQ Used on a Pediatric Patient: Hannah tells the story (30-60 sec)","elvi,hannah",0,"2 cuts ready by Dec 8","Film during the Dec 7 shoot (same setup as the giveaway reels). Hannah on camera: what happened, what the AutoTQ did, why every school should have one. Cut 1 reel + 1 LinkedIn version with captions.","Mon Dec 7"],["2026-12-08","2026-12-08",0,"SO","AutoTQ Used on a Pediatric Patient: post on all channels","cariss Five years ago, our team at Golden Hour Medical asked ourselves that question, and we couldn't answer it confidently. So we built AutoTQ: an automatic tourniquet that tells you what to do, step by step, and applies pressure at the push of a button.

Florida Atlantic University put AutoTQ beside every AED on campus and in each of its police vehicles.

Want me to put together a station plan for {{company_name}}?`,`Traditional tourniquets need someone to tighten a strap by hand, under stress. Fewer than one in four untrained adults get one on correctly. AutoTQ talks the user through it out loud and inflates an air cuff automatically.

Here's how it works: theautotq.com/for/schools?t=campus&o={{company_slug}}

If it's useful, I can map out where it would go beside your AEDs and in your vehicles.`,"Is bleeding control something you handle at {{company_name}}, or is there someone else I should talk to? A name is plenty."]},{g:"Schools",k:"HigherEd_EHS_Emergency",t:"Higher ed \xB7 EHS & emergency",who:"EHS, emergency management, risk, safety",n:1373,wave:"1",starts:"Dec 14",s:"A question about {{company_name}}",e:[`You have AEDs across {{company_name}} for cardiac emergencies. If someone started bleeding severely, would the person closest know how to stop it?
