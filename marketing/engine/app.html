 know what to do?

Five years ago, our team at Golden Hour Medical asked ourselves that question, and we couldn't answer it confidently. So we built AutoTQ: an automatic tourniquet that tells you what to do, step by step, and applies pressure at the push of a button.

Florida Atlantic University put AutoTQ beside every AED on campus and in each of its police vehicles.

Want me to put together a station plan for {{company_name}}?`,`Traditional tourniquets need someone to tighten a strap by hand, under stress. Fewer than one in four untrained adults get one on correctly. AutoTQ talks the user through it out loud and inflates an air cuff automatically.

.chip.on{background:var(--ink);color:#0b0b0c}
.chip.on b{color:var(--t3)}
.ib:focus-visible,.chip:focus-visible{outline:2px solid rgba(255,255,255,.5);outline-offset:-2px}
@media (max-width:699px){ .ib{width:38px;height:38px} .chip{height:38px;padding:0 13px} }
</style>

</head>
<body>
<div id="vp" aria-label="AutoTQ marketing map">
  <div id="board">
    <svg id="wires" aria-hidden="true"></svg>
    <section id="root" data-id="start"></section>
  </div>
</div>

<button id="back" hidden aria-label="Back to the hub"><svg viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></svg>Back</button>
<nav id="dock" aria-label="Map controls">
  <button class="ib" id="bfit" aria-label="Fit everything"><svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg></button>
  <button class="ib" id="bout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5.5 12h13"/></svg></button>
  <button class="ib" id="bin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
  <span class="sep"></span>
  <div class="chips" id="chips"></div>
</nav>

<script>window.MAP=/*MAP_DATA*/null;<\/script>
<script>
(function(){
"use strict";
var W=380,G=64,PAD=110;
var STATE={auto:"Runs by itself",hand:"By hand",off:"Built, not on",none:"Not built"};

var M=window.MAP||{},B=M.branches||[];

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\\"":"&quot;"}[c];});}
function stepHTML(s,end){
  var body='<div class="st">'+esc(s.t)+'</div><div class="sw"><b>'+STATE[s.s]+'</b>'+(s.w?' \xB7 '+esc(s.w):'')+'</div>'+(s.n?'<div class="sn">'+esc(s.n)+'</div>':'');
  return '<div class="step s-'+s.s+(end?' end':'')+'"><i class="g"></i>'+(s.s==="none"?'<div class="box">'+body+'</div>':body)+(end?'':'<i class="ar"></i>')+'</div>';
}
function stepsHTML(list){
  var out="";
  for(var i=0;i<list.length;i++){var s=list[i];if(s.h){out+='<div class="grp">'+esc(s.h)+'</div>';continue;}
    var nx=list[i+1];out+=stepHTML(s,!nx||!!nx.h);}
  return out;
}
function countsHTML(all){
  var c={auto:0,hand:0,off:0,none:0};all.forEach(function(s){c[s.s]++;});
  var p=[];
  if(c.auto)p.push('<span class="c-auto">'+(c.auto===1?"1 runs by itself":c.auto+" run by themselves")+'</span>');
  if(c.hand)p.push(c.hand+" by hand");
  if(c.off)p.push(c.off+" built, not on");
  if(c.none)p.push(c.none+" not built");
  return p.join(" \xB7 ");
}
function colHTML(b,i){
  var steps=b.how.filter(function(s){return !s.h;}),gaps=b.gaps||[],all=steps.concat(gaps);
  var maxBar=b.bars?Math.max.apply(null,b.bars.map(function(x){return x[1];})):0;
  var h='<div class="col" id="c-'+b.id+'" data-id="'+b.id+'"><div class="spine"></div>';
  h+='<header class="head"><div class="badge">'+(i+1)+'</div><h2>'+esc(b.t)+'</h2><p class="sub">'+esc(b.sub)+'</p>';
  h+='<div class="meter" aria-hidden="true">'+all.map(function(s){return '<i class="m-'+s.s+'"></i>';}).join("")+'</div>';
  h+='<p class="counts">'+countsHTML(all)+'</p></header><div class="stack">';
  h+='<article class="card"><h3>Why we do it</h3><p>'+esc(b.why)+'</p></article>';
  h+='<article class="card"><h3>What we do</h3><ul>'+b.what.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'+
     (b.rule?'<p class="rule">'+esc(b.rule)+'</p>':'')+
     (b.bars?'<div class="bars">'+b.bars.map(function(x){return '<div class="bar"><span>'+esc(x[0])+'</span><i><b style="width:'+(x[1]/maxBar*100).toFixed(1)+'%"></b></i><span>'+x[1]+'</span></div>';}).join("")+'</div>':'')+'</article>';
  h+='<article class="card"><h3>How it runs</h3><div class="steps">'+stepsHTML(b.how)+'</div>'+
     (gaps.length?'<div class="gaps">'+gaps.map(function(s){return stepHTML(s,true);}).join("")+'</div>':'')+'</article>';
  h+='<article class="card"><h3>Who says yes</h3><p>'+esc(b.who)+'</p></article>';
  h+=b.hub.length?'<article class="card"><h3>In the hub</h3><ul>'+b.hub.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></article>'
                 :'<article class="card empty"><h3>In the hub</h3><p>Nothing in the hub yet</p></article>';
  h+='<article class="card now"><h3>Where it stands</h3><div class="big">'+esc(b.big[0])+'<small>'+esc(b.big[1])+'</small></div>'+
     (b.now.length?'<ul>'+b.now.map(function(x){return x.k==="o"?'<li class="o"><span class="tag">Open</span>'+esc(x.t)+'</li>':x.k==="x"?'<li class="x"><span class="tag dash">Not built</span>'+esc(x.t)+'</li>':'<li>'+esc(x.t)+'</li>';}).join("")+'</ul>':'')+'</article>';
  return h+'</div></div>';
}

var vp=document.getElementById("vp"),board=document.getElementById("board"),root=document.getElementById("root"),wires=document.getElementById("wires"),dock=document.getElementById("dock"),chipsEl=document.getElementById("chips");
function asof(){var d=M.asof?new Date(M.asof+"T12:00:00"):null;return d&&!isNaN(d)?"How it runs, as of "+d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}):"How it runs";}
root.innerHTML='<h1>'+esc(M.title||"AutoTQ marketing")+'</h1><p class="asof">'+esc(asof())+'</p>'+
  '<div class="loop" id="loop" role="img" aria-label="'+esc("Every desk works the same loop: "+(M.loop||[]).join(", ")+". "+(M.center||""))+'"><svg id="loopsvg" viewBox="0 0 900 420" aria-hidden="true"></svg><div class="center">'+esc(M.center||"")+'</div></div>'+
  '<div class="desks">'+(M.desks||[]).map(function(d){return '<div class="desk"><b>'+esc(d[0])+'</b><span>'+esc(d[1])+'</span></div>';}).join("")+'</div>'+
  (M.deskline?'<p class="deskline">'+esc(M.deskline)+'</p>':'');
board.insertAdjacentHTML("beforeend",B.map(colHTML).join(""));
chipsEl.innerHTML='<button class="chip" data-go="start">Start</button>'+B.map(function(b,i){return '<button class="chip" data-go="'+b.id+'"><b>'+(i+1)+'</b>'+esc(b.t)+'</button>';}).join("");

/* the loop */
(function(){
  var svg=document.getElementById("loopsvg"),loop=document.getElementById("loop");
  var L=M.loop||[],YES=M.loopYes==null?3:M.loopYes,cx=450,cy=210,rx=350,ry=168,n=L.length,NS="http://www.w3.org/2000/svg";
  var e=document.createElementNS(NS,"ellipse");e.setAttribute("cx",cx);e.setAttribute("cy",cy);e.setAttribute("rx",rx);e.setAttribute("ry",ry);svg.appendChild(e);
  for(var i=0;i<n;i++){
    var th=Math.PI+i*2*Math.PI/n,x=cx+rx*Math.cos(th),y=cy+ry*Math.sin(th);
    var d=document.createElement("div");d.className="node"+(i===YES?" me":"");d.textContent=L[i];d.style.left=x+"px";d.style.top=y+"px";loop.appendChild(d);
    var tm=th+Math.PI/n,mx=cx+rx*Math.cos(tm),my=cy+ry*Math.sin(tm),ang=Math.atan2(ry*Math.cos(tm),-rx*Math.sin(tm))*180/Math.PI;
    var p=document.createElementNS(NS,"polygon");p.setAttribute("points","7,0 -6,-6 -6,6");p.setAttribute("transform","translate("+mx.toFixed(1)+" "+my.toFixed(1)+") rotate("+ang.toFixed(1)+")");svg.appendChild(p);
  }
})();

var BOARD={w:1000,h:1000},COLTOP=0;
function layout(){
  var cols=board.querySelectorAll(".col"),BW=cols.length*W+(cols.length-1)*G;
  root.style.left=(PAD+BW/2-root.offsetWidth/2)+"px";root.style.top=PAD+"px";
  var rootBottom=PAD+root.offsetHeight;COLTOP=rootBottom+210;var maxH=0;
  for(var i=0;i<cols.length;i++){var c=cols[i];c.style.left=(PAD+i*(W+G))+"px";c.style.top=COLTOP+"px";
    var st=c.querySelector(".stack"),last=st.lastElementChild;c.querySelector(".spine").style.height=(st.offsetTop+last.offsetTop+26-17)+"px";
    maxH=Math.max(maxH,c.offsetHeight);}
  BOARD.w=BW+2*PAD;BOARD.h=COLTOP+maxH+PAD;board.style.width=BOARD.w+"px";board.style.height=BOARD.h+"px";
  wires.setAttribute("width",BOARD.w);wires.setAttribute("height",BOARD.h);
  var sx=PAD+BW/2,sy=rootBottom+40,s='<circle cx="'+sx+'" cy="'+sy+'" r="6"/>',paths="";
  for(var j=0;j<cols.length;j++){var ex=PAD+j*(W+G)+17,ey=COLTOP,dy=ey-sy;
    paths+='<path d="M'+sx+' '+sy+' C'+sx+' '+(sy+dy*.6)+' '+ex+' '+(ey-dy*.6)+' '+ex+' '+ey+'"/>';}
  wires.innerHTML=paths+s;
}

/* view */
var EMB=window.parent!==window,TOPX=EMB?48:0;
function closeMap(){try{window.parent.postMessage({hxmap:"close"},"*");}catch(e){}}
if(EMB){var bk=document.getElementById("back");bk.hidden=false;bk.addEventListener("click",closeMap);}
var view={x:0,y:0,k:.2},mode="fit",anim=0,raf=0,settleT=0;
var RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function kMin(){return Math.min(fitView().k*.8,.5);}
function apply(){
  board.style.transform="translate3d("+view.x.toFixed(2)+"px,"+view.y.toFixed(2)+"px,0) scale("+view.k.toFixed(5)+")";
  var g=32*view.k;while(g<16)g*=2;vp.style.backgroundSize=g+"px "+g+"px";vp.style.backgroundPosition=view.x.toFixed(1)+"px "+view.y.toFixed(1)+"px";
  if(!raf)raf=requestAnimationFrame(function(){raf=0;markChip();});
}
function busy(){board.style.willChange="transform";clearTimeout(settleT);settleT=setTimeout(function(){board.style.willChange="auto";},220);}
function fitView(){var vw=innerWidth,vh=innerHeight,dh=dock.offsetHeight+30,k=Math.min((vw-40)/BOARD.w,(vh-dh-34-TOPX)/BOARD.h);
  return {k:k,x:(vw-BOARD.w*k)/2,y:Math.max(16,(vh-dh-TOPX-BOARD.h*k)/2+8)+TOPX};}
function el(id){return id==="start"?root:document.getElementById("c-"+id);}
function jumpView(id){
  var e=el(id),vw=innerWidth,vh=innerHeight,w=e.offsetWidth,phone=vw<700,k;
  if(id==="start"){k=Math.min((vw-(phone?24:80))/w,(vh-dock.offsetHeight-70-TOPX)/e.offsetHeight,1);if(phone)k=(vw-24)/w;}
  else k=phone?(vw-24)/w:Math.min(1,(vw-80)/w);
  return {k:k,x:vw/2-(e.offsetLeft+w/2)*k,y:(phone?18:30)+TOPX-(e.offsetTop-(id==="start"?0:6))*k};
}
function go(t,ms){
  cancelAnimationFrame(anim);busy();ms=RM?Math.min(ms||420,200):(ms||420);
  var s={x:view.x,y:view.y,k:view.k},vw=innerWidth,vh=innerHeight,t0=performance.now();
  var cs={x:(vw/2-s.x)/s.k,y:(vh/2-s.y)/s.k},ct={x:(vw/2-t.x)/t.k,y:(vh/2-t.y)/t.k};
  (function step(now){var p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3),k=s.k*Math.pow(t.k/s.k,e);
    view={k:k,x:vw/2-(cs.x+(ct.x-cs.x)*e)*k,y:vh/2-(cs.y+(ct.y-cs.y)*e)*k};
    if(p>=1)view={x:t.x,y:t.y,k:t.k};apply();busy();if(p<1)anim=requestAnimationFrame(step);})(t0);
}
function setHash(h){if(EMB)return;try{history.replaceState(null,"",h?"#"+h:location.pathname+location.search);}catch(e){}}
function jump(id,instant){mode=id;var t=jumpView(id);if(instant){view=t;apply();}else go(t);setHash(id);}
function fit(instant){mode="fit";var t=fitView();if(instant){view=t;apply();}else go(t);setHash("");}
function zoomAt(px,py,f){var k=clamp(view.k*f,kMin(),2.4),r=k/view.k;view.x=px-(px-view.x)*r;view.y=py-(py-view.y)*r;view.k=k;mode="free";apply();busy();}

var current="";
function markChip(){
  var id="";if(mode!=="fit"&&view.k>=.42){var cx=(innerWidth/2-view.x)/view.k,cy=(innerHeight*.4-view.y)/view.k;
    if(cy<COLTOP-60)id="start";else{var i=Math.floor((cx-PAD+G/2)/(W+G));i=clamp(i,0,B.length-1);id=B[i].id;}}
  if(id===current)return;current=id;
  var bs=chipsEl.querySelectorAll(".chip"),on=null;
  for(var j=0;j<bs.length;j++){var m=bs[j].getAttribute("data-go")===id;bs[j].classList.toggle("on",m);if(m)on=bs[j];}
  if(on)chipsEl.scrollTo({left:on.offsetLeft-chipsEl.clientWidth/2+on.offsetWidth/2});
}

/* gestures */
var pts=new Map(),gest=null,down=null,lastTap=null;
function base(){var p=Array.from(pts.values());
  if(p.length===1)gest={pan:1,x0:p[0].x,y0:p[0].y,vx:view.x,vy:view.y};
  else if(p.length>=2){var a=p[0],b=p[1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;gest={pan:0,d:Math.hypot(a.x-b.x,a.y-b.y)||1,k:view.k,bx:(mx-view.x)/view.k,by:(my-view.y)/view.k};}
}
vp.addEventListener("pointerdown",function(e){
  if(e.pointerType==="mouse"&&e.button!==0)return;
  try{vp.setPointerCapture(e.pointerId);}catch(_){}
  cancelAnimationFrame(anim);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1)down={x:e.clientX,y:e.clientY,t:performance.now(),moved:false,target:e.target};else if(down)down.moved=true;
  base();if(e.pointerType==="mouse")vp.classList.add("drag");
});
vp.addEventListener("pointermove",function(e){
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!gest)return;
  if(gest.pan){var dx=e.clientX-gest.x0,dy=e.clientY-gest.y0;if(down&&Math.hypot(dx,dy)>6)down.moved=true;if(down&&!down.moved)return;
    view.x=gest.vx+dx;view.y=gest.vy+dy;}
  else{var p=Array.from(pts.values()),a=p[0],b=p[1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,k=clamp(gest.k*Math.hypot(a.x-b.x,a.y-b.y)/gest.d,kMin(),2.4);
    view.k=k;view.x=mx-gest.bx*k;view.y=my-gest.by*k;}
  mode="free";apply();busy();
});
function up(e){
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);vp.classList.remove("drag");
  if(pts.size){base();return;}gest=null;
  if(down&&!down.moved&&e.type==="pointerup"&&performance.now()-down.t<450)tap(down);down=null;
}
vp.addEventListener("pointerup",up);vp.addEventListener("pointercancel",up);
function tap(d){
  var now=performance.now();
  if(lastTap&&now-lastTap.t<330&&Math.hypot(d.x-lastTap.x,d.y-lastTap.y)<30){lastTap=null;var f=1.9,k=clamp(view.k*f,kMin(),2.4),r=k/view.k;
    go({k:k,x:d.x-(d.x-view.x)*r,y:d.y-(d.y-view.y)*r},300);mode="free";return;}
  lastTap={t:now,x:d.x,y:d.y};
  var c=d.target&&d.target.closest?d.target.closest(".col,#root"):null;
  if(c&&view.k<.5){lastTap=null;jump(c.getAttribute("data-id"));}
}
vp.addEventListener("wheel",function(e){
  e.preventDefault();cancelAnimationFrame(anim);
  var dy=e.deltaY,dx=e.deltaX;if(e.deltaMode===1){dy*=16;dx*=16;}else if(e.deltaMode===2){dy*=innerHeight;dx*=innerWidth;}
  var mouse=e.deltaMode!==0||(dx===0&&Math.abs(dy)>=40&&Number.isInteger(dy));
  if(e.ctrlKey)zoomAt(e.clientX,e.clientY,Math.exp(-dy*.01));
  else if(mouse&&!e.shiftKey)zoomAt(e.clientX,e.clientY,Math.exp(-dy*.0018));
  else{if(e.shiftKey&&!dx){dx=dy;dy=0;}view.x-=dx;view.y-=dy;mode="free";apply();busy();}
},{passive:false});
document.addEventListener("keydown",function(e){
  var k=e.key,cx=innerWidth/2,cy=innerHeight/2;
  if(k==="Escape"){closeMap();return;}
  if(k==="ArrowLeft"){view.x+=90;}else if(k==="ArrowRight"){view.x-=90;}else if(k==="ArrowUp"){view.y+=90;}else if(k==="ArrowDown"){view.y-=90;}
  else if(k==="+"||k==="="){zoomAt(cx,cy,1.35);return;}else if(k==="-"||k==="_"){zoomAt(cx,cy,1/1.35);return;}
  else if(k==="0"||k==="f"){fit();return;}else return;
  e.preventDefault();mode="free";apply();busy();
});
document.getElementById("bfit").addEventListener("click",function(){fit();});
function zoomBtn(f){var cx=innerWidth/2,cy=(innerHeight-dock.offsetHeight)/2,k=clamp(view.k*f,kMin(),2.4),r=k/view.k;mode="free";go({k:k,x:cx-(cx-view.x)*r,y:cy-(cy-view.y)*r},260);}
document.getElementById("bin").addEventListener("click",function(){zoomBtn(1.6);});
document.getElementById("bout").addEventListener("click",function(){zoomBtn(1/1.6);});
chipsEl.addEventListener("click",function(e){var b=e.target.closest(".chip");if(b)jump(b.getAttribute("data-go"));});

function valid(h){return h==="start"||B.some(function(b){return b.id===h;});}
function place(instant){var h=(location.hash||"").slice(1);if(valid(h))jump(h,instant);else if(innerWidth<700)jump("start",instant);else fit(instant);}
window.addEventListener("hashchange",function(){var h=(location.hash||"").slice(1);if(valid(h)&&h!==mode)jump(h);});
var rt=0;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(mode==="fit")fit(true);else if(valid(mode))jump(mode,true);},60);});

layout();place(true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){layout();if(mode==="fit")fit(true);else if(valid(mode))jump(mode,true);});
})();
<\/script>
</body>
