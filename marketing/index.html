<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>AutoTQ Marketing</title>
<style>
/* AutoTQ Marketing — the operation as a transit map. Porcelain ground, hairline rules, Inter at one UI size with rank
   by weight and case, six line inks at 6px with round caps, stations as ringed circles. Coral fills only the primary
   action and the live dot. */
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("assets/inter-latin.woff2") format("woff2")}
:root{
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ground:#FBFBFA; --paper:#FFFFFF; --panel:#F4F3F0; --rule:#E6E4DF; --rule-2:#EFEEEA; --rule-3:#D6D3CC;
  --ink:#17171A; --ink-2:#4B4A48; --ink-3:#75736E; --ink-4:#A09D96;
  --coral:#D85A30; --coral-ink:#B8481F; --coral-wash:#FBEDE7;
  --l1:#D85A30; --l2:#2F6DB5; --l3:#4E7A2E; --l4:#8E3D64; --l5:#B7791F; --l6:#1C7C7A;
  --ok:#2F6A19; --ok-wash:#E9F3E3; --warn:#85530A; --warn-wash:#FBF0DA; --bad:#A7302A; --bad-wash:#FCEBEA; --info:#1F5C9E; --info-wash:#E7EFFA;
  --sh-1:0 1px 1px rgba(23,23,26,.04),0 1px 3px rgba(23,23,26,.05); --sh-2:0 2px 4px rgba(23,23,26,.05),0 14px 32px -16px rgba(23,23,26,.22); --sh-3:0 24px 60px -24px rgba(23,23,26,.35),0 8px 20px -10px rgba(23,23,26,.14);
  --ring:0 0 0 3px rgba(216,90,48,.22); --r:10px; --r-lg:14px; --r-xl:20px; --ease:cubic-bezier(.2,.8,.2,1); --ui:13.5px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:var(--ui);line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"calt" 0,"ss01" 0}
button{font-family:inherit;cursor:pointer;color:inherit;font-size:inherit}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:2px}
::selection{background:rgba(216,90,48,.18)}
input,textarea{caret-color:var(--coral);accent-color:var(--coral)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}
input:focus-visible,textarea:focus-visible{outline:none}
*{scrollbar-width:thin;scrollbar-color:#CFCCC4 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#D3D0C8;border-radius:99px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}
/* ---- shell ---- */
.top{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:54px;padding:0 20px;background:rgba(251,251,250,.86);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--rule)}
.top .brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.012em}
.top .brand svg{width:15px;height:22px;color:var(--coral)}
.top .brand small{font-weight:500;color:var(--ink-3);margin-left:2px}
.seg{display:inline-flex;background:var(--panel);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;min-height:30px;padding:0 14px;border-radius:8px;font-weight:550;color:var(--ink-3);white-space:nowrap;position:relative;transition:color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(23,23,26,.10),0 0 0 .5px rgba(23,23,26,.05)}
.seg button .cnt{position:absolute;top:1px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;line-height:16px;text-align:center}
.top .right{display:flex;align-items:center;justify-content:flex-end;gap:14px}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--ink-3);font-size:12.5px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(47,106,25,.14)}
.live[data-state=off] i{background:var(--ink-4);box-shadow:none}.live[data-state=up] i{background:var(--warn)}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex:none}
button.av{border:0;padding:0}
.main{max-width:1280px;margin:0 auto;padding:22px 24px 90px}
.ph{display:flex;align-items:baseline;gap:14px;margin:4px 0 16px}
.ph h1{font-size:20px;font-weight:650;margin:0;letter-spacing:-.014em}
.ph p{margin:0;color:var(--ink-3)}
.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:12px}
.t1{font-weight:600;letter-spacing:-.006em;margin:0;color:var(--ink)}
.t2{font-size:12.5px;color:var(--ink-3);margin:2px 0 0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.mark{fill:currentColor;flex:none}
/* ---- the net (transit map) ---- */
.netwrap{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-xl);box-shadow:var(--sh-1);overflow:hidden}
svg.net{width:100%;height:auto;display:block;font-family:var(--font)}
svg.net .col{font-size:11px;letter-spacing:.09em;fill:var(--ink-4);font-weight:600}
svg.net .line{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;transition:opacity .35s var(--ease),stroke-width .25s}
svg.net .line.ghost{stroke-width:3;stroke-dasharray:1 9;opacity:.55}
svg.net .plate{cursor:pointer}svg.net .plate rect{fill:var(--paper);stroke:var(--rule-3);stroke-width:1;transition:stroke .2s}
svg.net .plate:hover rect{stroke:var(--ink-3)}
svg.net .plate .pt{font-size:13px;font-weight:650}svg.net .plate .ps{font-size:11.5px;fill:var(--ink-3)}
svg.net .plate .pn{font-size:22px;font-weight:650;fill:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
svg.net .station{cursor:pointer}svg.net .station circle{fill:var(--paper);stroke:var(--ink);stroke-width:2.5;transition:stroke-width .2s}
svg.net .station:hover circle{stroke-width:3.5}
svg.net .station .st{font-size:12.5px;font-weight:600;fill:var(--ink)}svg.net .station .ss{font-size:11px;fill:var(--ink-3)}
svg.net .station.hold circle{stroke:var(--bad)}svg.net .station.idle circle{stroke:var(--ink-4);stroke-width:2}
svg.net .stop{cursor:pointer}
svg.net .stop .tt{font-size:11.5px;font-weight:600;fill:var(--ink)}svg.net .stop .ts{font-size:11px;fill:var(--ink-3)}
svg.net .train{opacity:.95}
svg.net .dim{opacity:.10;transition:opacity .35s var(--ease)}
svg.net .lbl{font-size:11.5px;fill:var(--ink-3)}
.legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--rule);background:var(--ground)}
.legend .lg{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px 0 10px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;font-weight:550;color:var(--ink-2);transition:border-color .15s,background .15s}
.legend .lg:hover{border-color:var(--rule-3)}.legend .lg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.legend .lg i{width:10px;height:10px;border-radius:50%;flex:none}.legend .lg b{font-weight:650}.legend .lg small{color:inherit;opacity:.7}
.legend .spacer{flex:1}
.vroute{padding:6px 0 14px}
.vplate{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--rule-3);background:var(--paper);border-radius:14px;padding:10px 14px;text-align:left;font:inherit}
.vplate small{display:block;color:var(--ink-3);font-size:12px}
.vline{position:relative;margin:0 0 0 22px;padding:10px 0 0 0;border-left:6px solid var(--c);border-radius:0 0 0 6px}
.vline.ghost{border-left-style:dotted;border-left-width:3px;margin-left:23.5px}
.vst{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 0 6px 14px;text-align:left;font:inherit;position:relative}
.vst i{position:absolute;left:-15px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink)}
.vst.stop i{left:-10px;width:5px;height:22px;border-radius:3px;background:var(--c);border:0}
.vst small{color:var(--ink-3)}
/* ---- inspector drawer ---- */
#scrim{position:fixed;inset:0;background:rgba(23,23,26,.18);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.open{opacity:1;pointer-events:auto}
#insp{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--paper);box-shadow:var(--sh-3);transform:translateX(104%);transition:transform .32s var(--ease);z-index:41;overflow:auto;padding:22px 22px 32px}
#insp.open{transform:none}
#insp h2{font-size:17px;font-weight:650;margin:0 36px 4px 0;letter-spacing:-.012em}
.inspx{position:absolute;top:12px;right:12px;width:32px;height:32px;border:0;border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}.inspx:hover{background:var(--panel)}
.insp-line{height:6px;border-radius:99px;margin:14px 0 16px}
/* ---- components ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 13px;border:1px solid var(--rule-3);background:var(--paper);color:var(--ink);border-radius:var(--r);font-weight:550;white-space:nowrap;transition:background .15s,border-color .15s,transform .12s var(--ease)}
.btn:hover{background:var(--panel)}.btn:active{transform:translateY(.5px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn svg.i{width:15px;height:15px;stroke-width:2}
.btn.sm{min-height:28px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff;font-weight:600}.btn.coral:hover{background:var(--coral-ink);border-color:var(--coral-ink)}
.btn.block{display:flex;width:100%;min-height:44px;border-radius:12px;white-space:normal}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}.btn.ghost:hover{background:var(--panel)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--coral-ink);padding:0 4px;min-height:0;font-weight:600}.btn.quiet:hover{background:transparent;text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;line-height:16px;padding:2px 8px;border-radius:6px;white-space:nowrap;background:var(--panel);color:var(--ink-2);vertical-align:middle}
.pill.warn{background:var(--warn-wash);color:var(--warn)}.pill.dang{background:var(--bad-wash);color:var(--bad)}.pill.ok{background:var(--ok-wash);color:var(--ok)}.pill.info{background:var(--info-wash);color:var(--info)}.pill.coral{background:var(--coral-wash);color:var(--coral-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border:1px solid var(--rule-3);background:var(--paper);border-radius:999px;font-size:12.5px;font-weight:550;color:var(--ink-2);cursor:pointer;user-select:none;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);padding:13px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
button.card{width:100%;font:inherit;text-align:left;transition:border-color .15s,box-shadow .15s}
button.card:hover{border-color:var(--rule-3);box-shadow:var(--sh-2)}
.card.block{display:block}
.list{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px}
.list>.card{margin:0;border:0;border-radius:0;border-top:1px solid var(--rule-2)}.list>:first-child{border-top:0}.list>button.card:hover{background:var(--ground);box-shadow:none}
.reccard{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);padding:16px 18px}
.sech{font-size:15px;font-weight:650;letter-spacing:-.012em;margin:24px 0 10px}
.sectlabel{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.empty{text-align:center;color:var(--ink-3);padding:40px 20px;line-height:1.55}
.tk{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--rule-2)}.tk:first-of-type{border-top:0}.tk>b{width:86px;flex:none;color:var(--ink-3);font-weight:600}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
input.f,textarea.f{width:100%;border:1px solid var(--rule-3);background:var(--paper);border-radius:var(--r);padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input.f:hover,textarea.f:hover{border-color:var(--ink-4)}input.f:focus,textarea.f:focus{border-color:var(--coral);box-shadow:var(--ring)}
textarea.f{min-height:72px;resize:vertical;line-height:1.5}
.wiz{display:flex;gap:6px;margin:14px 0 16px;flex-wrap:wrap}
.wiz button{flex:1;min-width:120px;border:1px solid var(--rule);background:var(--paper);border-radius:11px;padding:10px 12px;font-weight:600;color:var(--ink-3);text-align:left}
.wiz button.on{border-color:var(--ink);color:var(--ink)}.wiz button.done{color:var(--ok)}
.tablewrap{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:auto}
table.lv{width:100%;border-collapse:collapse}
table.lv th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0;background:var(--paper);z-index:1}
table.lv td{padding:9px 12px;border-bottom:1px solid var(--rule-2);white-space:nowrap;vertical-align:top}table.lv tr:last-child td{border-bottom:0}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-weight:550;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:99;box-shadow:var(--sh-3)}
.toast.show{opacity:1;transform:translateX(-50%)}
/* schedule board */
.sched th.dc,.sched td.dc{text-align:center;min-width:46px;padding:8px 4px;font-variant-numeric:tabular-nums}
.sched .we{background:var(--ground);color:var(--ink-4)}.sched .today{box-shadow:inset 0 0 0 2px var(--coral-wash)}.sched th.today{color:var(--coral-ink)}
.sched .cell{display:inline-block;min-width:30px;padding:3px 7px;border-radius:7px;color:#fff;font-size:12px;font-weight:650}.sched .cell.soft{background:var(--panel);color:var(--ink-2)}
.sched tr.tot td{background:var(--ground);font-weight:600}.sched a{text-decoration:none}.sched a:hover{text-decoration:underline}
.sched .bar{height:6px;border-radius:99px;background:var(--panel);overflow:hidden}.sched .bar i{display:block;height:100%;border-radius:99px}
.sched .lane{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px}
/* route cards (campaign list) + route header (one campaign) */
.route{display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(0,2fr) auto;gap:16px;align-items:center;padding:14px 18px}
.route .trk{position:relative;height:40px}
.route .trk .ln{position:absolute;left:0;right:0;top:17px;height:6px;border-radius:99px}
.route .trk .sp{position:absolute;top:12px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2.5px solid currentColor;transform:translateX(-50%)}
.route .trk .sp.done{background:currentColor}
.route .trk .tl{position:absolute;top:30px;font-size:11px;color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
/* login */
.login{max-width:380px;margin:12vh auto 0;padding:0 20px}
.login .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:650;justify-content:center;letter-spacing:-.014em}.login .logo svg{width:20px;height:30px;color:var(--coral)}
.login .tag{text-align:center;color:var(--ink-3);margin:4px 0 26px}
.login .who{color:var(--ink-3);text-align:center;margin-bottom:12px}
.ubtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--paper);padding:12px 14px;text-align:left;font:inherit}
.ubtn:hover{background:var(--ground)}.ubtn .uav{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.ubtn b{display:block;font-size:14.5px}.ubtn small{color:var(--ink-3);font-size:12.5px}
#loginMsg{font-size:13px;color:var(--ink-3);text-align:center;min-height:18px;margin-top:12px}
@media (prefers-reduced-motion:reduce){#insp{transition:none}}
@media (max-width:900px){
  .top{grid-template-columns:1fr auto;grid-template-areas:"brand right" "nav nav";height:auto;padding:8px 12px 8px;gap:8px 8px}
  .top .brand{grid-area:brand}.top .right{grid-area:right}.top .seg{grid-area:nav;width:100%;justify-content:space-between}.seg button{padding:0 8px;font-size:12.5px;flex:1}
  .top .brand small{display:none}
  .main{padding:14px 14px 80px}
  .route{grid-template-columns:1fr;gap:10px}
  #insp{top:auto;left:0;right:0;width:100%;max-height:82vh;border-radius:18px 18px 0 0;transform:translateY(104%)}
}
</style>

let SESSION=null;try{SESSION=JSON.parse(localStorage.getItem(SKEY)||"null");}catch(e){}
let USER=null, DB={}, view="home", curCampaign=null, campStep=1, mktTab="campaigns", leadsQ="", leadsConf="";
const logState={otpEmail:null,pwEmail:null,setPw:null};
const SYNC={lastPull:"1970-01-01T00:00:00Z",dirty:{},timer:null,pushing:false,state:"off",booted:false};
function authed(){return !!(SESSION&&SESSION.access_token);}
function saveSession(s){SESSION=s;if(s)localStorage.setItem(SKEY,JSON.stringify(s));else localStorage.removeItem(SKEY);}
function admin(){return USER==="max";}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(DKEY)||"null");if(r&&r.db){DB=r.db;SYNC.lastPull=r.lastPull||SYNC.lastPull;}}catch(e){}PULL_COLLECTIONS.concat(["activities"]).forEach(c=>{DB[c]=DB[c]||[];});}
function saveLocal(){try{localStorage.setItem(DKEY,JSON.stringify({db:DB,lastPull:SYNC.lastPull}));}catch(e){/* quota — the server copy is the real one */}}
async function supa(path,opts){
  opts=opts||{};const h=Object.assign({"apikey":SUPA_KEY,"Authorization":"Bearer "+(SESSION?SESSION.access_token:""),"Content-Type":"application/json"},opts.headers||{});
  let res=await fetch(SUPA_URL+path,Object.assign({},opts,{headers:h}));
  if(res.status===401&&await refreshSession()){h.Authorization="Bearer "+SESSION.access_token;res=await fetch(SUPA_URL+path,Object.assign({},opts,{headers:h}));}
  return res;
}
async function refreshSession(){
  if(!SESSION||!SESSION.refresh_token)return false;
  try{const res=await fetch(SUPA_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SESSION.refresh_token})});
    if(!res.ok){saveSession(null);USER=null;render();return false;}saveSession(await res.json());return true;}catch(e){return false;}
}
function syncDot(state){SYNC.state=state;const el=document.getElementById("syncdot");if(el){el.dataset.state=state;el.lastChild.textContent=state==="off"?"Offline":state==="up"?"Saving…":"Live";}}
/* writes: put(coll, record) saves locally and upserts to the shared records table (same shape the CRM pushes) */
function put(coll,rec){DB[coll]=DB[coll]||[];const i=DB[coll].findIndex(r=>String(r.id)===String(rec.id));if(i>-1)DB[coll][i]=rec;else DB[coll].push(rec);
  SYNC.dirty[coll+"|"+rec.id]={collection:coll,id:String(rec.id),data:rec,deleted:false};saveLocal();clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushDirty,500);}
function del(coll,id){DB[coll]=(DB[coll]||[]).filter(r=>String(r.id)!==String(id));SYNC.dirty[coll+"|"+id]={collection:coll,id:String(id),data:{id:id},deleted:true};saveLocal();clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushDirty,300);}
async function pushDirty(){
  if(SYNC.pushing||!authed())return;const keys=Object.keys(SYNC.dirty);if(!keys.length)return;
  SYNC.pushing=true;syncDot("up");
  try{const rows=keys.map(k=>Object.assign({updated_by:USER||""},SYNC.dirty[k]));
    const res=await supa("/rest/v1/records?on_conflict=collection,id",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
    if(res.ok){keys.forEach(k=>delete SYNC.dirty[k]);syncDot("ok");}else{syncDot("off");toast("Couldn't save to the team database ("+res.status+") — kept locally, will retry");}
  }catch(e){syncDot("off");}
  SYNC.pushing=false;
}
async function pullChanges(full){
  if(!authed())return;
  try{let changed=false;const from=full?"1970-01-01T00:00:00Z":SYNC.lastPull;let maxTs=SYNC.lastPull,offset=0,page=0;
    const colls="("+PULL_COLLECTIONS.join(",")+")";
    while(page<40){
      const res=await supa("/rest/v1/records?collection=in."+colls+"&updated_at=gte."+encodeURIComponent(from)+"&order=updated_at.asc,collection.asc,id.asc&limit=1000&offset="+offset);
      if(!res.ok){syncDot("off");return;}
      const rows=await res.json();
      rows.forEach(r=>{if(r.updated_at>maxTs)maxTs=r.updated_at;if(SYNC.dirty[r.collection+"|"+r.id])return;
        const arr=DB[r.collection]=DB[r.collection]||[];const i=arr.findIndex(x=>String(x.id)===String(r.id));
        if(r.deleted){if(i>-1){arr.splice(i,1);changed=true;}return;}
        const s=JSON.stringify(r.data);if(i>-1){if(JSON.stringify(arr[i])!==s){arr[i]=r.data;changed=true;}}else{arr.push(r.data);changed=true;}});
      if(rows.length<1000)break;offset+=1000;page++;}
    SYNC.lastPull=maxTs;saveLocal();syncDot("ok");
    if(changed){const ae=document.activeElement;if(!ae||!/INPUT|TEXTAREA/.test(ae.tagName))render();}
  }catch(e){syncDot("off");}
}
async function bootSync(){await pullChanges(!(DB.people||[]).length);SYNC.booted=true;if(Object.keys(SYNC.dirty).length)pushDirty();setInterval(pullChanges,10000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pullChanges();});}

function contactType(p){const c=company(p.cid);if(!c)return "enduser";if(c.type==="manrep"||c.type==="partner")return "manrep";if(c.type==="distributor")return "distrep";return "enduser";}
function distStatus(c){if(c.dstatus)return c.dstatus;return (((c.units||0)>0)||((c.orders||0)>0))?"setup":"potential";}
function myLists(){return (DB.lists||[]).filter(l=>!l.removed);}
function confLeadLists(){const by={};(DB.confLeads||[]).forEach(l=>{(by[l.conf]=by[l.conf]||[]).push(l);});
  return Object.keys(by).map(conf=>{const ls=by[conf];return {conf,total:ls.length,contacted:ls.filter(l=>l.contacted).length,tocall:ls.filter(l=>!l.contacted&&l.segment!=="Set Aside").length,hot:ls.filter(l=>l.temp==="Hot").length};}).sort((a,b)=>b.total-a.total);}

  else h+='<div class="who">Enter the code we emailed to<br><b style="color:var(--ink)">'+esc(logState.otpEmail)+'</b></div><input class="f" id="otpCode" inputmode="numeric" maxlength="12" placeholder="Code" autocomplete="one-time-code" style="text-align:center;font-size:26px;letter-spacing:6px;font-weight:700"><button class="btn coral block" data-act="verifyotp" style="margin-top:14px">Sign in</button><button class="btn block ghost" data-act="otpback" style="margin-top:8px">Back</button><p id="loginMsg"></p>';

function loginMsg(m,bad){const el=document.getElementById("loginMsg");if(el){el.textContent=m;el.style.color=bad?"var(--dang-t)":"var(--muted)";}}
function signedIn(j,email){saveSession(j);USER=TEAM_EMAILS[((j.user&&j.user.email)||email).toLowerCase()]||"";localStorage.setItem(UKEY,USER);logState.pwEmail=null;logState.otpEmail=null;}
async function verifyPw(){const pw=(document.getElementById("pwInput")||{}).value||"";if(!pw){loginMsg("Enter your password",true);return;}loginMsg("Signing in…");
  try{const res=await fetch(SUPA_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:logState.pwEmail,password:pw})});const j=await res.json();
    if(!res.ok||!j.access_token){loginMsg("Wrong password — try again, or use an email code",true);return;}signedIn(j,logState.pwEmail);view="home";render();bootSync();}catch(e){loginMsg("Network problem — try again",true);}}
async function sendOtp(email){loginMsg("Sending code…");
  try{const res=await fetch(SUPA_URL+"/auth/v1/otp",{method:"POST",headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email,create_user:false})});
    if(!res.ok){const j=await res.json().catch(()=>({}));loginMsg(j.msg||j.error_description||"Couldn't send the code — try again",true);return;}logState.otpEmail=email;renderLogin();loginMsg("Code sent — check your email (and spam, the first time).");}catch(e){loginMsg("Network problem — try again",true);}}
async function verifyOtp(){const code=((document.getElementById("otpCode")||{}).value||"").replace(/\D/g,"");if(code.length<6){loginMsg("Enter the full code from the email",true);return;}loginMsg("Checking…");
  try{const res=await fetch(SUPA_URL+"/auth/v1/verify",{method:"POST",headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({type:"email",email:logState.otpEmail,token:code})});const j=await res.json();
    if(!res.ok||!j.access_token){loginMsg(j.msg||j.error_description||"That code didn't work — check it or send a fresh one",true);return;}signedIn(j,logState.otpEmail);logState.setPw=true;renderLogin();bootSync();}catch(e){loginMsg("Network problem — try again",true);}}
async function setPwSave(){const p1=(document.getElementById("pw1")||{}).value||"",p2=(document.getElementById("pw2")||{}).value||"";if(p1.length<8){loginMsg("Use at least 8 characters",true);return;}if(p1!==p2){loginMsg("Those don't match",true);return;}

/* ---------- outbound engine: senders + warmup, already-touched index, verification, the daily plan ---------- */
const RAMP=[20,35,50,75,100,150,200]; // per sender per day; moves up one step after each clean sending day
const TOUCH_DAYS=30;                   // anyone touched (call, email, meeting) inside this window is left alone
const DEFAULT_SENDERS=[ // seeded once; saved to the shared `senders` collection when Max first edits them
 {id:"s-max",email:"max@autotq.net",name:"Max Herbst",owner:"max",pool:"A"},{id:"s-kellan",email:"kellan@autotq.net",name:"Kellan",owner:"kellan",pool:"A"},{id:"s-hello",email:"hello@autotq.net",name:"AutoTQ",owner:"max",pool:"A"},
 {id:"s-johnm",email:"johnm@auto-tq.com",name:"John Morrison",owner:"johnm",pool:"B"},{id:"s-john",email:"john@auto-tq.com",name:"John Cornejo",owner:"john",pool:"B"},{id:"s-tim",email:"tim@auto-tq.com",name:"Tim Ford",owner:"tim",pool:"B"}];
function senders(){const live=(DB.senders||[]).filter(s=>s&&s.id);return live.length?live:DEFAULT_SENDERS.map(s=>Object.assign({log:{},paused:false,hold:false},s));}
function senderDomainOk(s){const st=MAILOUT_STATUS;if(!st||!st.ok)return null;const d=s.email.split("@")[1];return (st.identities||[]).some(i=>i.verified&&(i.name===d||i.name===s.email));}
function senderDay(s){return Object.keys(s.log||{}).filter(d=>(s.log[d].sent||0)>0).length;} // clean sending days so far
function senderCap(s,offset){if(s.paused)return 0;const day=senderDay(s)+(offset||0)-((s.hold&&!offset)?1:0);return RAMP[Math.max(0,Math.min(RAMP.length-1,day))];}
function senderSentToday(s){return ((s.log||{})[todayStr()]||{}).sent||0;}
function senderLeft(s){return Math.max(0,senderCap(s,0)-senderSentToday(s));}
function senderStats(s,date){const ids=new Set();campaigns().forEach(c=>(c.leads||[]).forEach(l=>{Object.keys(l.msg||{}).forEach(k=>{if((l.by||{})[k]===s.email)ids.add(l.msg[k]);});}));
  const n={delivery:0,bounce:0,complaint:0};(DB.mailEvents||[]).forEach(e=>{if(ids.has(e.msgId)&&(!date||String(e.at||"").slice(0,10)===date)&&n[e.type]!=null)n[e.type]++;});return n;}
function senderHealth(s){const st=senderStats(s);const sent=Object.values(s.log||{}).reduce((a,d)=>a+(d.sent||0),0);if(!sent)return {label:"New",cls:"gray"};
  const b=st.bounce/sent,c=st.complaint/sent;if(c>=0.001||b>=0.03)return {label:"Hold",cls:"dang"};if(b>=0.02)return {label:"Watch",cls:"warn"};return {label:"Healthy",cls:"ok"};}
function saveSender(s){if(!s.log)s.log={};put("senders",s);}
/* already touched: one map of email -> {at, how} across everything the team has done */
function touchedMap(){const m=new Map();const hit=(email,at,how)=>{if(!email||!at)return;const k=String(email).toLowerCase();const prev=m.get(k);if(!prev||at>prev.at)m.set(k,{at:String(at).slice(0,10),how});};
  (DB.confLeads||[]).forEach(l=>{if(l.lastEmail)hit(l.email,l.lastEmail,"emailed");if(l.contacted)hit(l.email,(l.contactedAt||l.lastCall||l.updatedAt||"2026-01-01"),"called");});
  const byPid={};(DB.people||[]).forEach(p=>{byPid[p.id]=p;if(p.last&&p.email)hit(p.email,p.last,"contact");});
  (DB.activities||[]).forEach(a=>{const p=a.pid?byPid[a.pid]:null;if(p&&p.email&&/email|call|voicemail|meeting|quote/.test(a.type||""))hit(p.email,a.date,a.type);});
  campaigns().forEach(c=>(c.leads||[]).forEach(l=>{Object.values(l.sent||{}).forEach(at=>hit(l.email,at,"campaign: "+c.name));}));
  return m;}
function enrolledMap(exceptId){const m=new Map();campaigns().forEach(c=>{if(c.id===exceptId||c.status==="done")return;(c.leads||[]).forEach(l=>{if(l.flag==="ok")m.set(String(l.email).toLowerCase(),c.name);});});return m;}
function campApplyGuards(c){ // after flags: drop the already-touched, the enrolled-elsewhere, the suppressed
  const t=touchedMap(),en=enrolledMap(c.id),stop=suppressedSet(),cut=new Date(Date.now()-TOUCH_DAYS*86400000).toISOString().slice(0,10);
  (c.leads||[]).forEach(l=>{if(l.flag!=="ok")return;const k=String(l.email).toLowerCase();
    if(stop.has(k)){l.flag="suppressed";return;}const tt=t.get(k);if(tt&&tt.at>=cut&&!(l.sent&&Object.keys(l.sent).length)){l.flag="touched";l.touched=tt;return;}
    if(en.has(k)){l.flag="enrolled";l.enrolledIn=en.get(k);}});}
/* verification through Apollo (people/bulk_match by email, 10 per call, ~1 credit per match) */
async function campVerify(c){

  if(!confirm("Check "+todo.length+" addresses with Apollo? Up to "+todo.length+" credits."))return;
  toast("Checking "+todo.length+"…");let done=0,bad=0;

    try{const r=await supa(MAILOUT,{method:"POST",body:JSON.stringify({action:"verify",emails:chunk.map(l=>l.email)})});const b=await r.json().catch(()=>({}));
      if(!r.ok||!b.ok)throw new Error(b.error||("HTTP "+r.status));

/* the plan: who goes out on which day, through which inbox */
function campAutoPause(){campaigns().forEach(c=>{if(c.paused||c.status==="done")return;const d=campDelivery(c);const sent=(c.sendLog||[]).reduce((a,e)=>a+(e.count||0),0);if(sent>=50&&(d.complaint/sent>=0.001||d.bounce/sent>=0.03)){c.paused=true;c.pausedBy="auto";c.pausedWhy=d.complaint/sent>=0.001?"complaints above 0.1%":"bounces above 3%";(c.review=c.review||[]).push({id:uid(),by:USER,at:new Date().toISOString(),text:"Paused automatically: "+c.pausedWhy+". Check the list and the message, then resume.",sys:true});saveCamp(c);}});}
function planLanes(){campAutoPause();return campaigns().filter(c=>["approved","active"].includes(c.status)&&!c.paused&&c.basis&&campOk(c).length).sort((a,b)=>(a.priority||5)-(b.priority||5)||String(a.createdAt).localeCompare(b.createdAt));}
function buildPlan(days){ // simulation from today: each lane's leads walk the steps; capacity = the senders' ramps
  const lanes=planLanes(),S=senders().filter(s=>!s.paused),out={days:[],lanes:{},senders:{}};const today=new Date();today.setHours(0,0,0,0);
  const state=lanes.map(c=>({c,leads:campOk(c).map(l=>({sent:Object.assign({},l.sent||{})})),steps:c.steps||[]}));
  for(let d=0;d<days;d++){const date=new Date(today.getTime()+d*86400000);const ds=date.toISOString().slice(0,10);const wk=date.getDay();const col={date:ds,total:0,byLane:{},bySender:{},byLaneSender:{},weekend:wk===0||wk===6};
    if(!col.weekend){let caps=S.map(s=>({s,left:Math.max(0,senderCap(s,d)-(d===0?senderSentToday(s):0))}));
      // which leads are due today per lane (step 1 = unsent, later = gap passed, measured from the simulated send day)
      const due=state.map(st=>st.leads.filter(l=>{for(let i=0;i<st.steps.length;i++){if(l.sent[i])continue;if(i===0)return l._i=0,true;const prev=l.sent[i-1];if(!prev)return false;const gap=(st.steps[i].day||1)-(st.steps[i-1].day||1);return (Math.floor((date-new Date(prev))/86400000)>=gap)?(l._i=i,true):false;}return false;}));
      let moved=true;while(moved){moved=false;for(let li=0;li<state.length;li++){const q=due[li];if(!q.length)continue;const cap=caps.find(x=>x.left>0);if(!cap)break;const l=q.shift();l.sent[l._i]=ds+"T12:00:00Z";cap.left--;moved=true;
        const lid=state[li].c.id;col.byLane[lid]=(col.byLane[lid]||0)+1;col.bySender[cap.s.id]=(col.bySender[cap.s.id]||0)+1;(col.byLaneSender[lid]=col.byLaneSender[lid]||{})[cap.s.id]=((col.byLaneSender[lid]||{})[cap.s.id]||0)+1;col.total++;}}}
    out.days.push(col);}
  lanes.forEach(c=>{const st=state.find(x=>x.c.id===c.id);out.lanes[c.id]={remaining:st.leads.filter(l=>!(c.steps||[]).every((_,k)=>l.sent[k])).length,finishDay:(()=>{for(let d=out.days.length-1;d>=0;d--)if(out.days[d].byLane[c.id])return out.days[d].date;return null;})()};});
  return out;}
/* run today's sends across lanes, rotating inboxes */
async function runToday(){
  if(!admin()){toast("Max runs the day's sends");return;}const st=await mailOutStatus();if(!st||!st.ok){openSheet('<h2>Outbound isn\'t connected</h2><p style="color:var(--muted);font-size:14px">'+esc((st&&st.error)||"mail-out not reachable")+'. Finish SETUP_SES.md first.</p>');return;}
  const lanes=planLanes().filter(c=>campCanSend(c));const S=senders().filter(s=>!s.paused&&senderLeft(s)>0&&senderDomainOk(s));
  if(!lanes.length){toast("No approved campaign has anyone due");return;}if(!S.length){toast("No verified inbox has room today");return;}
  const plan=buildPlan(1).days[0];const total=plan.total;if(!total){toast("Nothing due today");return;}
  if(!confirm("Send "+total+" emails now across "+lanes.length+" campaign"+(lanes.length>1?"s":"")+" and "+S.length+" inboxes?"))return;
  let sent=0,si=0;
  for(const c of lanes){for(let i=0;i<(c.steps||[]).length;i++){let due=campDue(c,i);while(due.length){const s=S[si%S.length];si++;const room=senderLeft(s);if(!room){if(S.every(x=>!senderLeft(x)))break;continue;}
      const batch=due.splice(0,Math.min(room,25));const n=await campSendBatch(c,i,batch,s);sent+=n;if(n<batch.length)break;}}}
  render();toast(sent+" sent today");}
async function campSendBatch(c,i,batch,s){
  const step=c.steps[i];const owner=teamById(s.owner||USER);
  try{const r=await supa(MAILOUT,{method:"POST",body:JSON.stringify({action:"send",from:s.email,fromName:s.name||owner.name,replyTo:userEmail(s.owner)||userEmail(USER)||SALES_FROM,campaign:c.name,
      items:batch.map(l=>{const vv=campVariant(step,l,i);return {to:l.email,subject:campFill(vv.subject,l,c,s),html:campTextHTML(campFill(vv.body,l,c,s)),text:campFill(vv.body,l,c,s),ref:l.refId||l.pid||""};})})});
    const b=await r.json().catch(()=>({}));if(!r.ok||!b.ok)throw new Error(b.error||("HTTP "+r.status));let n=0;
    (b.results||[]).forEach(res=>{const l=batch.find(x=>String(x.email).toLowerCase()===res.to);if(!l)return;
      if(res.msgId){l.sent=l.sent||{};l.sent[i]=new Date().toISOString();l.msg=l.msg||{};l.msg[i]=res.msgId;l.by=l.by||{};l.by[i]=s.email;l.var=l.var||{};l.var[i]=campVariant(step,l,i).v;n++;
        const note="Campaign email "+(i+1)+" — "+campFill(step.subject,l,c,s)+" · "+c.name+" · from "+s.email;
        if(l.pid||l.cid)put("activities",{id:uid(),type:"email",pid:l.pid||null,cid:l.cid||null,note:note,date:todayStr(),by:USER});
        if(l.pid){const p=person(l.pid);if(p){p.last=todayStr();put("people",p);}}
        if(l.refId){const x=(DB.confLeads||[]).find(y=>y.id===l.refId);if(x){x.lastEmail=todayStr();x.notes=((x.notes||"")+" | "+todayStr()+": "+note).slice(0,4000);put("confLeads",x);}}}
      else if(res.skipped==="suppressed")l.flag="suppressed";});
    s.log=s.log||{};s.log[todayStr()]=s.log[todayStr()]||{sent:0};s.log[todayStr()].sent+=n;saveSender(s);
    if(n){c.status="active";c.launchedAt=c.launchedAt||new Date().toISOString();(c.sendLog=c.sendLog||[]).push({step:i,at:new Date().toISOString(),count:n,by:USER,from:s.email,channel:"ses"});}
    if(campOk(c).length&&campOk(c).every(l=>c.steps.every((_,k)=>l.sent&&l.sent[k])))c.status="done";saveCamp(c);return n;}
  catch(e){toast("Stopped on "+s.email+": "+e.message);return 0;}}

/* ---------- the net: the operation as a transit map ---------- */
const LINE_INKS=["#D85A30","#2F6DB5","#4E7A2E","#8E3D64","#B7791F","#1C7C7A"];
function laneInk(col){return String(col).toUpperCase()==='#D85A30'?'#B8481F':col;} // coral at 13px needs the deeper ink for 4.5:1
function laneColor(c,i){return c.color||LINE_INKS[(i!=null?i:campaigns().indexOf(c))%LINE_INKS.length];}
function campColor(c){return laneColor(c,campaigns().indexOf(c));}
let netFocus=null; // {type:"lane"|"station", id}
const REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function trainsHTML(d,col,n,dur,begin){let h='';for(let t=0;t<n;t++)h+=REDUCED?'<circle class="train" r="4.5" fill="'+col+'" data-path="'+d+'" data-f="'+((t+0.5)/n).toFixed(3)+'"/>':'<circle class="train" r="4.5" fill="'+col+'"><animateMotion dur="'+dur+'s" begin="'+(begin-t*(dur/n)).toFixed(2)+'s" repeatCount="indefinite" path="'+d+'"/></circle>';return h;}
function placeStaticTrains(){if(!REDUCED)return;document.querySelectorAll('svg.net .train[data-path]').forEach(el=>{const svg=el.ownerSVGElement;const pth=document.createElementNS('http://www.w3.org/2000/svg','path');pth.setAttribute('d',el.dataset.path);svg.appendChild(pth);const pt=pth.getPointAtLength(pth.getTotalLength()*(+el.dataset.f));svg.removeChild(pth);el.setAttribute('cx',pt.x);el.setAttribute('cy',pt.y);});}
function laneShort(c){return ((c.aud&&c.aud.conf)||c.name||"").replace(/ — .*$/,"").slice(0,22);}
function netLanes(){return campaigns().filter(c=>c.status!=="done"&&!c.paused&&campOk(c).length);}
function fmtShort(ds){const d=new Date(ds+"T12:00:00");return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric"});}
/* one lane's route: plate → the stations it rides through today → its stops. Bends only at 45°. */
function routePath(x0,y0,stations,x1,y1,xS,off){ // stations: array of y at xS; off = this line's parallel offset at the trunk
  const k=22,xT=xS+(off||0);let d="M"+x0+","+y0;
  if(stations.length){const sy=stations[0],ey=stations[stations.length-1];
    const dy=sy-y0,xb=xT-Math.abs(dy)-k;d+=" H"+Math.max(x0+20,xb)+" L"+xT+","+sy;
    const yx=ey+40;d+=" V"+yx; // the trunk runs through the stations it serves, then clears the last label
    const xo=xS+210;d+=" H"+xo+" L"+(xo+Math.abs(y1-yx))+","+y1+" H"+x1; // leave past the station labels, then bend
  }else{const dy=y1-y0;const xm=(x0+x1)/2;d+=" H"+(xm-Math.abs(dy)/2)+" L"+(xm+Math.abs(dy)/2)+","+y1+" H"+x1;}
  return d;}
function haltBanner(){const st=outboundSettings();return st.haltedWhy?'<div class="reccard" style="margin-bottom:12px;border-color:var(--bad)"><p class="t1" style="color:var(--bad)">Sending halted: '+esc(st.haltedWhy)+'</p><p class="t2">The guardrail turned automation off at '+new Date(st.haltedAt).toLocaleString()+'. Check the lists and the message, then clear the halt and turn automation back on.</p>'+(admin()?'<button class="btn sm" data-act="clearhalt" style="margin-top:8px">Clear the halt</button>':'')+'</div>':'';}

  const liveIds=new Set(planLanes().map(c=>c.id));
  const W=1240,rowH=78,n=Math.max(lanes.length,S.length,3),H=70+rowH*n;const xP=36,xPw=232,xS=640,xE=[900,1020,1140];
  const yL=i=>84+rowH*i+(n-lanes.length)*rowH/2,yS=j=>84+rowH*j+(n-S.length)*rowH/2;
  const f=netFocus;const laneOn=c=>!f||(f.type==="lane"&&f.id===c.id)||(f.type==="station"&&(plan.byLaneSender[c.id]||{})[f.id]);

    const used=S.map((s,j)=>({s,j,n:(plan.byLaneSender[c.id]||{})[s.id]||0})).filter(x=>x.n>0);
    const d=routePath(xP+xPw,yL(i),used.map(x=>yS(x.j)),xE[xE.length-1]+14,yL(i),xS,(i-(lanes.length-1)/2)*9);

    if(live&&laneOn(c))g+=trainsHTML(d,col,Math.min(6,Math.max(1,Math.round((plan.byLane[c.id]||0)/20))),7+i*0.6,0);
  });
  // plates
  lanes.forEach((c,i)=>{const y=yL(i),col=laneColor(c,i),nToday=plan.byLane[c.id]||0,ok=campOk(c).length,sent=(c.sendLog||[]).reduce((a,e)=>a+(e.count||0),0);
    g+='<g class="plate'+(laneOn(c)?"":" dim")+'" data-act="netlane" data-id="'+c.id+'" transform="translate('+xP+','+(y-30)+')"><rect width="'+xPw+'" height="60" rx="14"/>'+
     '<text x="18" y="24" class="pt" fill="'+laneInk(col)+'">'+esc(laneShort(c))+'</text><text x="18" y="43" class="ps">'+ok+' people · '+esc(campStatus(c)[1].toLowerCase())+(sent?' · '+sent+' sent':'')+'</text>'+
     '<text x="'+(xPw-14)+'" y="38" class="pn" text-anchor="end">'+nToday+'</text></g>';});
  // stations

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==="closesheet"){closeInsp();return;}
  if(a==="pickuser"){logState.pwEmail=t.dataset.email;renderLogin();return;}
  if(a==="verifypw"){verifyPw();return;}if(a==="sendotp"){sendOtp(t.dataset.email);return;}if(a==="verifyotp"){verifyOtp();return;}
  if(a==="otpback"){logState.pwEmail=null;logState.otpEmail=null;renderLogin();return;}
  if(a==="setpwsave"){setPwSave();return;}if(a==="setpwskip"){logState.setPw=null;view="net";render();return;}
  if(a==="me"){if(confirm("Sign out of AutoTQ Marketing?")){saveSession(null);USER=null;localStorage.removeItem(UKEY);render();}return;}
  if(a==="nav"){view=t.dataset.v;if(view==="camp")curCampaign=null;netFocus=null;closeInsp();render();window.scrollTo(0,0);return;}
  if(a==="mkttab"){mktTab=t.dataset.v;render();return;}
  if(a==="leadsconf"){leadsConf=t.dataset.v;render();return;}
  /* the net */
  if(a==="netall"){netFocus=null;closeInsp();render();return;}
  if(a==="netlane"){const c=campaignById(id);if(!c)return;netFocus=(netFocus&&netFocus.type==="lane"&&netFocus.id===id)?null:{type:"lane",id:id};render();if(netFocus)laneInsp(c);else closeInsp();return;}
  if(a==="netstation"){netFocus=(netFocus&&netFocus.type==="station"&&netFocus.id===id)?null:{type:"station",id:id};render();if(netFocus)senderSheet(id);else closeInsp();return;}
  if(a==="netstop"){const c=campaignById(id);if(c)stopInsp(c,+t.dataset.v);return;}
  if(a==="runtoday"){runToday();return;}
  if(a==="autotoggle"){const st=outboundSettings();st.auto=!st.auto;st.by=USER;st.at=new Date().toISOString();put("settings",st);render();toast(st.auto?"Automation on — the cron sends inside the window":"Automation off — nothing sends by itself");return;}
  if(a==="autowin"){const st=outboundSettings();const [a1,b1]=t.dataset.v.split("-").map(Number);st.startHour=a1;st.endHour=b1;put("settings",st);render();return;}
  if(a==="sender"){e.preventDefault();senderSheet(id);return;}
  if(a==="sowner"){const sd=senders().find(x=>x.id===id);if(sd){sd.owner=t.dataset.v;saveSender(sd);senderSheet(id);}return;}
  if(a==="spause"){const sd=senders().find(x=>x.id===id);if(sd){sd.paused=!sd.paused;saveSender(sd);closeInsp();render();}return;}
  if(a==="shold"){const sd=senders().find(x=>x.id===id);if(sd){sd.hold=!sd.hold;saveSender(sd);senderSheet(id);}return;}
  if(a==="sreset"){const sd=senders().find(x=>x.id===id);if(sd&&confirm("Restart "+sd.email+" at day 1 of the ramp?")){sd.log={};sd.hold=false;saveSender(sd);closeInsp();render();}return;}
  /* campaigns */
  if(a==="scoutstart"){scoutStart(t.dataset.v);return;}
  if(a==="campnew"){newCampaign({src:"conf"},"New campaign");return;}
  if(a==="campnewfrom"){newCampaign({src:"conf",conf:t.dataset.v,segments:["End User"],fresh:true},t.dataset.v+" — end-users");return;}
  if(a==="campnewlist"){const L=myLists().find(x=>x.id===id);newCampaign({src:"list",listId:id},L?L.name:"Call list");return;}
  if(a==="campnewq"){const q=((document.getElementById("campQ")||{}).value||"").trim();if(!q){toast("Describe the list first");return;}newCampaign({src:"contacts",query:q},q);return;}
  if(a==="campopen"){e.preventDefault();closeInsp();curCampaign=id;campStep=+(t.dataset.step||1);view="camp";render();window.scrollTo(0,0);return;}
  if(a==="campback"){curCampaign=null;render();window.scrollTo(0,0);return;}
  if(a==="campstep"){campStep=+t.dataset.v;render();const w=document.querySelector(".wiz");if(w)w.scrollIntoView({block:"start",behavior:"smooth"});return;}
  if(a==="camppick"){const fi=document.getElementById("campFile");if(fi)fi.click();return;}
  if(a==="campdel"){const c=campaignById(id);if(c&&confirm('Delete "'+c.name+'"? Comments and the send log go with it.')){del("campaigns",c.id);curCampaign=null;closeInsp();render();toast("Deleted");}return;}
  if(a==="camppause"){const c=campaignById(id);if(c){c.paused=!c.paused;c.pausedBy=USER;saveCamp(c);closeInsp();render();toast(c.paused?"Paused — off the map until you resume it":"Resumed");}return;}
  const c=curCampaign?campaignById(curCampaign):null;
  if(a==="campsrc"&&c){c.aud={src:t.dataset.v};if(t.dataset.v!=="file"){c.leads=[];c.listName="";}saveCamp(c);render();return;}
  if(a.startsWith("campaud:")&&c){const k=a.slice(8),v=t.dataset.v;c.aud=c.aud||{};if(k==="conf"||k==="listId"){c.aud[k]=v;if(k==="conf"){c.aud.segments=["End User"];c.aud.inds=[];c.aud.regions=[];c.basis="Met us at "+v;}}else if(k==="fresh")c.aud.fresh=!c.aud.fresh;else{const arr=c.aud[k]=c.aud[k]||[];const i=arr.indexOf(v);if(i>-1)arr.splice(i,1);else arr.push(v);}saveCamp(c);render();return;}
  if(a==="campbuild"&&c){if(c.aud&&c.aud.src==="contacts"){const q=document.getElementById("campAudQ");if(q)c.aud.query=q.value;}campBuildAudience(c);campTouched(c);saveCamp(c);render();toast(campOk(c).length+" people will be emailed");return;}
  if(a==="camptpl"&&c){c.template=t.dataset.v;c.steps=campDefaultSteps(t.dataset.v);campTouched(c);saveCamp(c);render();return;}
  if(a==="campaddstep"&&c){const lastDay=Math.max.apply(null,c.steps.map(s=>s.day||1));c.steps.push({day:lastDay+4,subject:"",body:""});campTouched(c);saveCamp(c);render();return;}
  if(a==="campdelstep"&&c&&c.steps.length>1){c.steps.splice(+t.dataset.v,1);campTouched(c);saveCamp(c);render();return;}
  if(a==="campaddalt"&&c){const s=c.steps[+t.dataset.ci];if(s){(s.alts=s.alts||[]).push({subject:"",body:""});campTouched(c);saveCamp(c);render();}return;}
  if(a==="campdelalt"&&c){const s=c.steps[+t.dataset.ci];if(s&&s.alts){s.alts.splice(+t.dataset.v,1);campTouched(c);saveCamp(c);render();}return;}
  if(a==="camptoken"&&c){const ci=+t.dataset.ci;const ta=document.querySelector('textarea[data-cfield="body"][data-ci="'+ci+'"]');if(ta){const tok="{{"+t.dataset.v+"}}";const st=ta.selectionStart!=null?ta.selectionStart:ta.value.length;ta.value=ta.value.slice(0,st)+tok+ta.value.slice(ta.selectionEnd!=null?ta.selectionEnd:st);c.steps[ci].body=ta.value;campTouched(c);saveCamp(c);ta.focus();ta.selectionStart=ta.selectionEnd=st+tok.length;}return;}
  if(a==="leadout"&&c){const l=c.leads[+t.dataset.v];if(l){l.outcome=l.outcome===t.dataset.o?"":t.dataset.o;l.outcomeAt=todayStr();saveCamp(c);render();}return;}
  if(a==="campverify"&&c){campVerify(c);return;}
  if(a==="campbasis"&&c){c.basis=t.dataset.v.replace(/ — say how$/,"");if(c.aud&&c.aud.conf&&/show/.test(t.dataset.v))c.basis="Met us at "+c.aud.conf;campTouched(c);saveCamp(c);render();return;}
  if(a==="campsim"){campSimTest();return;}
  if(a==="clearhalt"){const st=outboundSettings();delete st.haltedWhy;delete st.haltedAt;put("settings",st);render();toast("Halt cleared — turn automation on when you are ready");return;}
  if(a==="campreview"){campSendForReview();return;}if(a==="campapprove"){campApprove();return;}if(a==="campunapprove"){campUnapprove();return;}if(a==="campcomment"){campComment();return;}
  if(a==="campsend"){campSendStep(+t.dataset.v);return;}
  if(a==="campchan"&&c){c.channel=t.dataset.v;saveCamp(c);render();return;}
  if(a==="campfrom"&&c){c.from=t.dataset.v;saveCamp(c);render();return;}
  if(a==="sesrefresh"){MAILOUT_STATUS=null;render();return;}
});
document.addEventListener("input",e=>{
  const el=e.target;const c=curCampaign?campaignById(curCampaign):null;
  if(el.id==="leadsQ"){leadsQ=el.value;clearTimeout(window.__lq);window.__lq=setTimeout(()=>{render();const q=document.getElementById("leadsQ");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}},250);return;}
  if(el.id==="sName"){const sd=senders().find(x=>x.id===el.dataset.sid);if(sd){sd.name=el.value;clearTimeout(window.__sn);window.__sn=setTimeout(()=>saveSender(sd),500);}return;}
  if(!c)return;
  if(el.id==="campName"){c.name=el.value;saveCamp(c);return;}
  if(el.id==="campCap"){c.dailyCap=Math.max(1,parseInt(el.value,10)||50);saveCamp(c);return;}
  if(el.id==="campFrom"){c.from=el.value.trim();saveCamp(c);return;}
  if(el.id==="campFromName"){c.fromName=el.value;saveCamp(c);return;}
  if(el.id==="campReplyTo"){c.replyTo=el.value.trim();saveCamp(c);return;}
  if(el.id==="campAudQ"){c.aud=c.aud||{};c.aud.query=el.value;saveCamp(c);return;}
  if(el.id==="campBasis"){c.basis=el.value;clearTimeout(window.__cb);window.__cb=setTimeout(()=>{campTouched(c);saveCamp(c);},500);return;}
  if(el.dataset&&el.dataset.afield&&c.steps[+el.dataset.ci]){const s=c.steps[+el.dataset.ci];const alt=(s.alts||[])[+el.dataset.aj];if(alt){alt[el.dataset.afield]=el.value;campTouched(c);saveCamp(c);}return;}
  if(el.dataset&&el.dataset.cfield&&c.steps[+el.dataset.ci]){const f=el.dataset.cfield;if(f==="day")c.steps[+el.dataset.ci].day=Math.max(1,parseInt(el.value,10)||1);else c.steps[+el.dataset.ci][f]=el.value;campTouched(c);saveCamp(c);}
});
document.addEventListener("change",e=>{if(e.target.id==="campFile")campHandleFile(e.target.files[0]);});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeInsp();if(e.key==="Enter"&&e.target.id==="pwInput")verifyPw();if(e.key==="Enter"&&e.target.id==="otpCode")verifyOtp();});
let __rw=window.innerWidth<900;window.addEventListener("resize",()=>{const nw=window.innerWidth<900;if(nw!==__rw){__rw=nw;if(USER&&authed())render();}});
/* boot */
loadLocal();
USER=authed()?(TEAM_EMAILS[((SESSION.user&&SESSION.user.email)||"").toLowerCase()]||localStorage.getItem(UKEY)||""):null;
view="net";render();
if(USER&&authed()&&hubUser())bootSync();

</script>
