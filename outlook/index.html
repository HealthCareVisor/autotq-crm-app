<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoTQ Merge</title>
<link rel="icon" href="assets/icon-32.png">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
@font-face{font-family:"Inter";src:url(assets/inter-latin.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --coral:#D85A30;--coral-btn:#C4502A;--coral-btn-h:#B24622;--coral-t:#FBEDE7;--coral-tt:#9A3E1C;
  --ink:#1A1916;--ink-2:#4F4C45;--muted:#6C685F;--faint:#A9A59C;
  --bg:#F6F5F1;--surface:#FFFFFF;--surface-2:#FAF9F6;--sunken:#EEECE6;
  --line:#E4E1D9;--line-2:#EFECE6;--line-3:#D5D1C7;
  --warn-b:#FBF0DA;--warn-t:#85530A;--dang-b:#FCEBEA;--dang-t:#A7302A;--ok-b:#E9F3E3;--ok-t:#2F6A19;
  --gray-b:#EFEDE7;--gray-t:#5F5B53;--ring:0 0 0 3px rgba(216,90,48,.22);--r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;padding:12px 12px 120px}
.top{display:flex;align-items:center;gap:8px;margin:2px 2px 12px}
.top img{width:22px;height:22px;border-radius:6px}
.top b{font-weight:700;font-size:15px;letter-spacing:-.01em}
.top .me{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.lnk{background:none;border:0;padding:0;color:var(--coral-tt);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.ch{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.ch h2{margin:0;font-size:13px;font-weight:650;letter-spacing:-.005em}
.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.sub{font-size:12px;color:var(--muted)}
.subj{font-weight:600;word-break:break-word}
.f{width:100%;border:1px solid var(--line-3);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;padding:8px 10px}
.f:focus{outline:none;border-color:var(--coral);box-shadow:var(--ring)}
textarea.f{min-height:96px;resize:vertical}
label.lbl{display:block;font-size:12px;color:var(--ink-2);margin:8px 0 4px;font-weight:550}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;background:var(--gray-b);color:var(--gray-t);border:1px solid transparent}
.chip.ok{background:var(--ok-b);color:var(--ok-t)}
.chip.bad{background:var(--dang-b);color:var(--dang-t)}
.chip.warn{background:var(--warn-b);color:var(--warn-t)}
.note{border-radius:8px;padding:7px 9px;font-size:12.5px;margin-top:8px}
.note.bad{background:var(--dang-b);color:var(--dang-t)}
.note.warn{background:var(--warn-b);color:var(--warn-t)}
.note.ok{background:var(--ok-b);color:var(--ok-t)}
.seg{display:flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 4px;font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(26,25,22,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-3);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--coral-btn);border-color:var(--coral-btn);color:#fff}
.btn.pri:hover{background:var(--coral-btn-h)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 8px;font-size:12px;font-weight:550}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2)}
.ibtn svg{width:15px;height:15px}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.held{margin-top:8px;border-top:1px solid var(--line-2)}
.held summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);padding:8px 0 4px}
.hrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line-2);font-size:12.5px}
.hrow:first-of-type{border-top:0}
.hrow .who{min-width:0;flex:1}
.hrow .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{display:flex;align-items:center;gap:6px}
.pv .n{font-size:12px;color:var(--muted);min-width:64px;text-align:center}
.to{font-size:12.5px;margin:6px 0 2px;color:var(--ink-2);word-break:break-all}
iframe.body{width:100%;height:260px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:6px}
details.fold>summary{cursor:pointer;font-size:13px;font-weight:650;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";float:right;color:var(--muted);font-weight:400}
details.fold[open]>summary::after{content:"–"}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.row input[type=checkbox]{width:16px;height:16px;accent-color:var(--coral-btn)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:520px;margin:0 auto}
.bar .meta{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.bar .btns{display:flex;gap:8px}
.bar .btns .btn{flex:1}
.prog{height:6px;background:var(--sunken);border-radius:99px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--coral)}
.center{text-align:center;padding:24px 8px}
.muted{color:var(--muted)}
.mt{margin-top:8px}
.signin{max-width:340px;margin:24px auto}
.signin .btn{width:100%;margin-top:10px}
.empty{font-size:12.5px;color:var(--muted);padding:4px 0}
</style>
</head>
<body>
<div id="app"><div class="center muted">Loading…</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
